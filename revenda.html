<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a6e5c">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230a6e5c%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Arial%20Black%2CArial%22%20font-weight%3D%22900%22%20font-size%3D%2228%22%20fill%3D%22white%22%20text-anchor%3D%22middle%22%20letter-spacing%3D%22-1%22%3EZP%3C/text%3E%3C/svg%3E">
<title>ZP Imports | Portal do Revendedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0a6e5c;--pd:#074d40;--pl:#e5f3ef;--acc:#ffb703;--accd:#e09e00;--ink:#2b2b2b;--ink2:#444;--muted:#6f6f6f;--line:#e6e6e6;--bg:#f3f3f3;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:var(--ink2);background:#fff;font-size:15px;line-height:1.55}
a{color:var(--pd);text-decoration:none}button{font:inherit;cursor:pointer}img,svg{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* header */
.rev-hd{border-bottom:1px solid var(--line);background:#fff}
.hd{display:flex;align-items:center;gap:22px;padding:14px 20px;max-width:1100px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.45rem;color:var(--p);letter-spacing:-.02em;flex:none}
.mark{width:44px;height:44px;border-radius:13px;background:var(--acc);display:grid;place-items:center}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:.88rem}
.hd-right .sair{background:none;border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:.4em 1em;font:inherit;font-size:.85rem;cursor:pointer}
.hd-right .sair:hover{border-color:var(--p);color:var(--p)}

/* nav tabs */
.rev-nav{background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rev-nav::-webkit-scrollbar{display:none}
.rev-nav-inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex}
.rev-nav button{background:none;border:0;color:var(--muted);padding:12px 16px;font:inherit;font-size:.88rem;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;transition:.15s}
.rev-nav button:hover{color:var(--p)}
.rev-nav button.on{color:var(--p);border-bottom-color:var(--p)}

/* nav badge */
.nav-badge{background:var(--acc);color:#3b2a00;border-radius:99px;font-size:.68rem;padding:1px 7px;font-weight:700;vertical-align:middle;line-height:1.6}
/* margem simulador */
.marg-box{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;margin-bottom:14px}
.marg-label{font-size:.85rem;color:var(--muted);font-weight:500;white-space:nowrap}
.marg-ctrl{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
.marg-range{flex:1;accent-color:var(--p);height:4px;cursor:pointer}
.marg-pct{font-weight:700;color:var(--p);min-width:36px;text-align:right;font-size:.9rem}
.marg-desc{font-size:.8rem;color:var(--muted);white-space:nowrap}
.marg-hint{font-size:.75rem;color:var(--pd);background:var(--pl);border-radius:6px;padding:2px 7px;margin:3px 0;font-weight:500}
/* cards kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:.15s}
.kpi:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.kpi .val{font-size:1.7rem;font-weight:700;color:var(--p);line-height:1.1;margin:4px 0}
.kpi .lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.kpi .sub{font-size:.75rem;color:var(--muted);margin-top:2px}
.kpi.accent{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:0}
.kpi.accent .val,.kpi.accent .lbl,.kpi.accent .sub{color:#fff}
.kpi.accent .lbl{opacity:.85}.kpi.accent .sub{opacity:.7}
.kpi.warn{border-color:#fbbf24;background:#fffbeb}
.kpi.warn .val{color:#b45309}

/* boxes */
.box{border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.pg{padding:28px 0 70px;min-height:55vh}
h2.sec-t{font-size:1.2rem;color:var(--ink);margin:28px 0 12px;border-bottom:2px solid var(--pl);padding-bottom:8px}
h3{color:var(--ink);margin:0 0 14px}

/* badge/status */
.badge{display:inline-block;padding:.25em .85em;border-radius:999px;font-size:.74rem;font-weight:700}
.badge.novo{background:#dbeafe;color:#1e40af}
.badge.confirmado{background:#dcfce7;color:#166534}
.badge.em-rota{background:#fef9c3;color:#854d0e}
.badge.entregue{background:#f0fdf4;color:#15803d}
.badge.cancelado{background:#fee2e2;color:#991b1b}
.badge.pendente{background:#e5f3ef;color:var(--pd)}
.badge.consignado{background:var(--pl);color:var(--p)}
.badge.comprador{background:#dcfce7;color:#166534}

/* tabela */
table{width:100%;border-collapse:collapse}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;background:var(--bg)}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;font-size:.9rem}
.r{text-align:right}

/* form */
input,select,textarea{border:1px solid #c9c9d2;border-radius:12px;padding:.75em 1em;font:inherit;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p);outline:3px solid var(--pl)}
label{font-weight:500;font-size:.88rem;display:block;margin-bottom:4px}
.fr{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.fr>div{grid-column:span 6}.fr .c2{grid-column:span 3}.fr .c3{grid-column:span 2}.fr .c4{grid-column:span 4}
select{width:auto}

/* btn */
.btn{background:var(--p);color:#fff;border:0;border-radius:20px;padding:.75em 1.4em;font-weight:600;transition:.15s;display:inline-block;text-align:center}
.btn:hover{background:var(--pd);transform:translateY(-1px)}.btn:disabled{background:#b9c2bd;cursor:not-allowed;transform:none}
.btn.sec{background:var(--p);color:#fff}.btn.sec:hover{background:var(--pd)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--p);color:var(--p)}
.btn.acc{background:var(--acc);color:#3b2a00}.btn.acc:hover{background:var(--accd)}
.btn.danger{background:#dc2626;color:#fff}
.btn.full{width:100%}.btn.sm{padding:.45em 1em;font-size:.84rem}

/* note */
.note{background:var(--pl);color:var(--pd);border-radius:12px;padding:12px 14px;font-size:.9rem;margin:10px 0}
.note.warn{background:#fff4d6;color:#6b4c00}.note.err{background:#fdecea;color:#8a1c14}
.note.rev{background:var(--pl);color:var(--pd)}

/* catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;background:#fff;transition:.2s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px)}
.pimg{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden;background:var(--pl)}
.pimg img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px}
.pn{font-size:.88rem;font-weight:500;color:var(--ink);line-height:1.3;min-height:3em}
.price-rev{font-size:1.05rem;font-weight:700;color:var(--p);margin:6px 0 2px}
.price-orig{font-size:.78rem;color:var(--muted);text-decoration:line-through}
.vrow{display:block;padding:10px 0;border-top:1px dashed var(--line)}.vtx{min-width:0}.vnm{display:block;font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.3}.vpr{display:block;margin-top:2px}.vpr b{color:var(--p);font-size:1.12rem}.vpr s{color:var(--muted);font-size:.8rem;margin-left:4px}.vrow .marg-hint{display:block;background:none;padding:0;margin:3px 0 0;font-size:.74rem;color:var(--muted);width:auto}.vac{margin-top:8px}.vac .btn{width:100%}.vac .qty-ctrl{justify-content:center}.mvrow{border-top:1px dashed var(--line);padding:10px 0}.vpv{color:var(--p);margin-left:6px;font-size:1.05rem}.grid.gp{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.desc-badge{display:inline-block;background:var(--pl);color:var(--p);font-size:.7rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-bottom:4px}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;width:fit-content;margin:8px 0}
.qty-ctrl button{border:0;background:none;width:32px;height:32px;font-size:1.1rem;color:var(--p)}
.qty-ctrl span{min-width:26px;text-align:center;font-weight:600;font-size:.9rem}
.card .btn{margin-top:auto;width:100%;font-size:.82rem}

/* carrinho lateral */
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--p);padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:50;transform:translateY(100%);transition:.3s}
.cart-bar.show{transform:none}
.cart-bar .info{flex:1;font-size:.88rem}
.cart-bar .info b{color:var(--p)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.ov.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;transform:scale(.95);transition:.25s}
.ov.on .modal{transform:scale(1)}

/* login — mesma estrutura do admin.html */
.adlogin{display:flex;justify-content:center;padding:34px 16px 60px;min-height:80vh;align-items:center}
.adcard{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 28px;box-shadow:0 18px 50px rgba(7,77,64,.12);text-align:center}
.adico{width:64px;height:64px;border-radius:50%;background:var(--pl);color:var(--pd);display:grid;place-items:center;margin:0 auto 14px}
.adcard h1{font-size:1.5rem;margin:0 0 6px;color:var(--ink)}
.adsub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.adcard form{text-align:left}
.adcard label{display:block;font-size:.85rem;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.adcard input{width:100%;padding:.85em 1em;border:1.5px solid var(--line);border-radius:12px;font-size:1rem;background:#fff}
.adcard input:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(10,110,92,.15)}
.adsenha{position:relative}.adsenha input{padding-right:5.2em}
.adver{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--p);font-weight:600;font-size:.85rem;cursor:pointer;padding:6px 8px}
.adbtn{width:100%;margin-top:22px;padding:1em;border:0;border-radius:12px;background:linear-gradient(90deg,var(--pd),var(--p));color:#fff;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 6px 16px rgba(7,77,64,.28)}
.adbtn:disabled{opacity:.65;cursor:wait}
.adnota{color:var(--muted);font-size:.82rem;margin:18px 0 0}
.adtabs{display:flex;gap:4px;margin:0 0 18px;background:var(--bg);border-radius:12px;padding:4px}
.adtabs button{flex:1;border:0;background:none;padding:.55em;border-radius:9px;font:inherit;font-weight:500;font-size:.88rem;color:var(--muted);cursor:pointer}
.adtabs button.on{background:#fff;color:var(--p);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* login: painel da marca + formulário */
.adlogin{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100vh;padding:0;align-items:stretch;justify-content:stretch;background:#fff}
.lg-brand{position:relative;overflow:hidden;background:linear-gradient(155deg,#0a6e5c 0%,#074d40 100%);color:#fff;padding:44px clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.lg-brand:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#0d8570;opacity:.45;right:-150px;top:-130px}
.lg-brand:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:#053b31;opacity:.7;left:-120px;bottom:-130px}
.lg-brand>*{position:relative;z-index:1}
.lg-logo{display:flex;align-items:center;gap:12px}.lg-mk{width:46px;height:46px;border-radius:14px;background:#fff;color:#0a6e5c;display:grid;place-items:center;padding:11px}.lg-nm{font-weight:700;font-size:1.45rem;letter-spacing:-.02em}
.lg-txt h2{font-size:clamp(1.7rem,3.2vw,2.3rem);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em;text-wrap:balance}
.lg-txt>p{margin:0 0 26px;max-width:36ch;color:#d6efe8;font-size:1rem}
.lg-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.lg-lista li{display:flex;align-items:center;gap:14px}.lg-lista li>span{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#ffb703}
.lg-lista b{display:block;font-size:.98rem;font-weight:600}.lg-lista small{display:block;color:#bfe3da;font-size:.84rem}
.lg-rod{font-size:.8rem;color:#a9d6cb;border-top:1px solid rgba(255,255,255,.18);padding-top:16px}
.lg-side{display:flex;align-items:center;justify-content:center;padding:40px clamp(18px,4vw,56px);background:#fff;min-width:0}
.lg-side .adcard{box-shadow:none;border:0;padding:0;max-width:420px;border-radius:0;text-align:left}
.lg-side .adcard h1{font-size:1.7rem;letter-spacing:-.02em}
@media(max-width:820px){.adlogin{grid-template-columns:minmax(0,1fr);min-height:0}.lg-brand{padding:24px 20px;gap:14px}.lg-txt>p,.lg-lista,.lg-rod{display:none}.lg-txt h2{font-size:1.35rem;margin:0}.lg-side{padding:26px 18px 40px}}
.field{margin-bottom:0}
.msg{border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:12px;display:none}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.warn{background:#fffbeb;color:#92400e}

/* rastreamento */
.tl{position:relative;padding-left:32px}
.tl::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:18px}
.tl-item .dot{position:absolute;left:-26px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--line);border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl-item.done .dot{background:var(--p);box-shadow:0 0 0 2px var(--pl)}
.tl-item.done .dot.pulse{animation:pulse-dot 1.5s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 2px var(--pl)}50%{box-shadow:0 0 0 5px rgba(10,110,92,.2)}}
.tl-item strong{font-size:.9rem;color:var(--ink)}
.tl-item small{display:block;color:var(--muted);font-size:.78rem}

/* extrato consignado */
.extrato{border:2px solid var(--pl);border-radius:var(--r);padding:20px;background:#f0f9f7}
.extrato h3{color:var(--p);margin-bottom:14px}
.ex-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.ex-row:last-child{border-bottom:0}
.ex-row .tipo{font-weight:600}
.ex-row .tipo.saida{color:#dc2626}
.ex-row .tipo.venda{color:#166534}
.ex-row .tipo.repasse{color:var(--p)}
.saldo-box{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border-radius:14px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.saldo-box .s-val{font-size:1.8rem;font-weight:700}
.saldo-box .s-lbl{font-size:.8rem;opacity:.85}

/* meu catálogo / clientes */
.pimg{position:relative}
.pimg .tag{position:absolute;left:8px;bottom:8px;background:var(--pd);color:#fff;font-weight:700;font-size:.95rem;border-radius:10px;padding:3px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.vinp{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.vinp span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.vinp input{padding:.4em .6em;border-radius:8px;font-size:.9rem;text-align:right}
.lucro{font-size:.75rem;color:var(--pd);font-weight:600}
.sumline{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.9rem}
.sumline.big{border-top:2px solid var(--line);padding-top:12px;font-weight:700;font-size:1.1rem;margin-top:8px}
.cli-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
@media print{
  body *{visibility:hidden}
  .cat-print,.cat-print *{visibility:visible}
  .cat-print{position:absolute;left:0;top:0;width:100%}
  .no-print,.vinp,.cart-bar{display:none!important}
  .card{break-inside:avoid;box-shadow:none}
}
@media(max-width:760px){
  .hd{padding:12px 16px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .fr .c2,.fr .c3,.fr .c4{grid-column:span 6}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:12px 0;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{padding:3px 0;border:0}
  td[data-l]::before{content:attr(data-l)": ";color:var(--muted);font-size:.82rem}
  .r{text-align:left!important}
}
</style>
</head>
<body>

<div id="root"></div>

<!-- MODAL -->
<div class="ov" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- CARRINHO FLUTUANTE -->
<div class="cart-bar" id="cart-bar">
  <div class="info" id="cart-bar-info"></div>
  <button class="btn sm ghost" onclick="rPage('catalogo')">Ver mais</button>
  <button class="btn sm" onclick="rPage('checkout')">Finalizar pedido</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============================= CONFIG ============================= */
const SB_URL='https://nnajpgujipucpymhoinq.supabase.co';
const SB_KEY='sb_publishable_vu1Dxk2lC2tkVrLtJgq2tA_V94HsJY0';
let SB=null;

/* ============================= ESTADO ============================= */
let REV_USER=null; // revendedor logado
let PRODUTOS=[];   // produtos do catálogo
let RPROD={},INDIV=false;  // produtos e preços individuais definidos pelo Wesley para este revendedor
let BASE={};      // valor de repasse definido pelo Wesley por variação
let CART=[];       // carrinho {id, nome, qty, preco, preco_orig}
let PAGE='login';  // página atual
let PAGE_DATA={};  // dados extras da página
let PEDIDOS=[];    // pedidos do revendedor
let MOVIMENTOS=[];  // movimentos consignados
let AVISOS=[];      // avisos do admin
let MARGEM_PCT=30;  // margem padrão para calculadora (%)
let PRECOS={};      // tabela de preço exclusiva: produto_id -> custo do revendedor
let VENDA={};       // preço de venda próprio: produto_id -> preço
let CLIENTES=[];    // clientes do revendedor (entrega direta)
let CLIENTE_SEL=''; // cliente escolhido no checkout
let FORMA_PAG='pix'; // forma de pagamento do pedido à vista
const FORMAS=[['pix','Pix'],['cartao_credito','Cartão de crédito (link de pagamento)'],['cartao_debito','Cartão de débito'],['transferencia','Transferência bancária']];
const FORMA_LB=Object.fromEntries(FORMAS.concat([['consignado','Consignado']]));
function clientesAtivo(){const c=(REV_USER&&REV_USER.config)||{};return c.clientes_ativo!==false}
let OBS_TMP='';     // observação do checkout (preservada ao redesenhar)

const LS='zp_rev_';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v!=null?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch{}};

const esc=s=>s==null?'':(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const fmtD=t=>{if(!t)return '—';const d=new Date(t);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};

window.addEventListener('DOMContentLoaded',async()=>{
  if(typeof supabase==='undefined'){showErr('Erro ao carregar. Verifique a internet.');return}
  SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  // Recuperar sessão salva
  const sess=lsGet('session',null);
  if(sess&&sess.id){
    // Validar sessão no banco
    const {data}=await SB.from('revendedores').select('*').eq('id',sess.id).eq('status','ativo').maybeSingle();
    if(data){REV_USER=data;CART=lsGet('cart',[]);await carregarDados()}
    else{lsSet('session',null);PAGE='login'}
  }
  render();
});

function showErr(msg){$('#root').innerHTML=`<div style="padding:40px;text-align:center;color:#b91c1c">${msg}</div>`}

async function carregarDados(){
  try{
    const [pr,pe,mo,av,pz,vd,cl,vr,rp,rpd]=await Promise.all([
      SB.from('produtos').select('id,nome,imagem,estoque,ativo,categoria,sob_consulta,ordem').eq('ativo',true),
      SB.from('pedidos_revendedor').select('*').eq('revendedor_id',REV_USER.id).order('criado_em',{ascending:false}),
      REV_USER.tipo==='consignado'?SB.from('consignado_movimentos').select('*').eq('revendedor_id',REV_USER.id).order('criado_em',{ascending:false}):Promise.resolve({data:[]}),
      SB.from('avisos_revendedores').select('*').eq('ativo',true).order('criado_em',{ascending:false}).limit(10),
      SB.from('revendedor_precos_var').select('variacao_id,preco').eq('revendedor_id',REV_USER.id),
      SB.from('revendedor_venda_var').select('variacao_id,preco_venda').eq('revendedor_id',REV_USER.id),
      SB.from('revendedor_clientes').select('*').eq('revendedor_id',REV_USER.id).order('nome'),
      SB.from('produto_variacoes').select('id,produto_id,nome,unidades,preco,ativo,ordem,descricao').eq('ativo',true).order('ordem'),
      SB.from('catalogo_revenda').select('variacao_id,preco'),
      SB.from('revendedor_produtos').select('variacao_id,habilitado,preco').eq('revendedor_id',REV_USER.id)
    ]);
    BASE={};((rp&&rp.data)||[]).forEach(r=>{BASE[r.variacao_id]=+r.preco});
    PRECOS={};(pz.data||[]).forEach(r=>{PRECOS[r.variacao_id]=+r.preco});
    VENDA={};(vd.data||[]).forEach(r=>{VENDA[r.variacao_id]=+r.preco_venda});
    CLIENTES=cl.data||[];
    // cada VARIAÇÃO do produto vira um item do catálogo (ex.: "Caixa fechada 5 ampolas"), com o preço dela
    const foto=f=>!f?'':(/^https?:/.test(f)?f:SB_URL+'/storage/v1/object/public/produtos/'+encodeURIComponent(f));
    const cfg=REV_USER.config||{};
    INDIV=cfg.preco_individual===true;
    RPROD={};((rpd&&rpd.data)||[]).forEach(r=>{RPROD[r.variacao_id]={h:r.habilitado!==false,p:r.preco==null?null:+r.preco}});
    PRODUTOS=[];
    (vr.data||[]).forEach(v=>{
      const p=(pr.data||[]).find(x=>x.id===v.produto_id);if(!p)return;
      if(cfg.produtos_visiveis&&cfg.produtos_visiveis.length&&!cfg.produtos_visiveis.includes(p.id))return;
      const preco=(v.preco==null||v.preco==='')?null:+v.preco;
      if(INDIV){const r0=RPROD[v.id];if(!r0||!r0.h||r0.p==null)return} // preços individuais: só entra o que está habilitado e com preço
      else if(preco==null&&PRECOS[v.id]==null&&BASE[v.id]==null)return; // sem valor definido, não entra no catálogo do revendedor
      PRODUTOS.push({id:v.id,produto_id:p.id,nome:p.nome+' — '+v.nome,nome_produto:p.nome,nome_var:v.nome,unidades:+v.unidades||1,preco,imagem:foto(p.imagem),estoque:+p.estoque||0,categoria:p.categoria,consulta:false,descricao:v.descricao||'',ordem_prod:(p.ordem==null?9999:+p.ordem),ordem_var:(v.ordem==null?9999:+v.ordem)});
    });
    // a linha de tirzepatida (e o que o Wesley colocar primeiro) vem antes; depois segue a ordem do cadastro
    PRODUTOS.sort((a,b)=>(a.ordem_prod-b.ordem_prod)||String(a.nome_produto).localeCompare(String(b.nome_produto))||(a.ordem_var-b.ordem_var));
    PEDIDOS=pe.data||[];
    MOVIMENTOS=mo.data||[];
    AVISOS=(av.data||[]).filter(a=>a.revendedor_id==null||a.revendedor_id===REV_USER.id);
    // mantém o carrinho com os preços atuais e sem produtos que saíram do catálogo
    CART=CART.filter(i=>i.outros||PRODUTOS.some(p=>p.id===i.id));
    CART.forEach(i=>{if(i.outros)return;const p=PRODUTOS.find(x=>x.id===i.id);i.preco=precoRev(p);i.preco_orig=p.preco});
    lsSet('cart',CART);
  }catch(e){console.error(e)}
}

let authTab='entrar';
async function doLogin(e){
  e.preventDefault();
  const email=$('#l-email').value.trim().toLowerCase();
  const senha=$('#l-senha').value;
  msgAuth('');
  const {data,error}=await SB.rpc('revendedor_entrar',{p_email:email,p_senha:senha});
  if(!data||error){msgAuth('E-mail ou senha incorretos.','err');return false}
  if(data.status==='pendente'){msgAuth('Seu cadastro ainda está aguardando aprovação. Em breve você receberá o acesso.','warn');return false}
  if(data.status==='bloqueado'){msgAuth('Acesso bloqueado. Entre em contato com a ZP Imports.','err');return false}
  REV_USER=data;lsSet('session',{id:data.id});
  await carregarDados();PAGE='dashboard';render();return false;
}
async function doCadastro(e){
  e.preventDefault();
  const nome=$('#c-nome').value.trim();
  const email=$('#c-email').value.trim().toLowerCase();
  const tel=$('#c-tel').value.trim();
  const senha=$('#c-senha').value;
  const senha2=$('#c-senha2').value;
  if(senha!==senha2){msgAuth('As senhas não coincidem.','err');return false}
  if(senha.length<6){msgAuth('A senha deve ter ao menos 6 caracteres.','err');return false}
  msgAuth('');
  const {error}=await SB.rpc('revendedor_cadastrar',{p_nome:nome,p_email:email,p_telefone:tel,p_senha:senha});
  if(error){if(error.code==='23505'||/EMAIL_EXISTE/.test(error.message||''))msgAuth('Este e-mail já está cadastrado.','err');else msgAuth('Erro ao cadastrar. Tente novamente.','err');return false}
  msgAuth('Cadastro realizado! Aguarde a aprovação da ZP Imports. Você receberá uma confirmação.','ok');return false;
}
function msgAuth(txt,tipo){const m=$('#auth-msg');if(!m)return;m.textContent=txt;m.className='msg'+(txt?' show':'')+' '+(tipo||'');}
function logout(){REV_USER=null;lsSet('session',null);lsSet('cart',[]);CART=[];PAGE='login';render()}

/* ============================= CARRINHO ============================= */
const temExclusivo=p=>INDIV||PRECOS[p.id]!=null;
// preço de venda do revendedor; sem preço definido, usa o custo + margem do simulador
function precoVenda(id,custo){const v=VENDA[id];return v!=null?v:custo*(1+MARGEM_PCT/100)}
function precoRev(p){
  if(INDIV){const r=RPROD[p.id];return r&&r.p!=null?r.p:0}
  if(PRECOS[p.id]!=null)return PRECOS[p.id];
  const desc=(REV_USER&&REV_USER.desconto_pct)||0;
  const base=BASE[p.id]!=null?BASE[p.id]:p.preco;
  return Math.round((base||0)*(1-desc/100)*100)/100;
}
function cartAdd(prod){
  const item=CART.find(i=>i.id===prod.id);
  if(item)item.qty++;
  else CART.push({id:prod.id,produto_id:prod.produto_id,nome:prod.nome,qty:1,preco:precoRev(prod),preco_orig:prod.preco});
  lsSet('cart',CART);updCartBar();render();
}
function cartSet(id,qty){
  if(qty<=0){CART=CART.filter(i=>i.id!==id)}
  else{const item=CART.find(i=>i.id===id);if(item)item.qty=qty}
  lsSet('cart',CART);updCartBar();render();
}
const cartTotal=()=>CART.reduce((s,i)=>s+i.preco*i.qty,0);
const cartQtd=()=>CART.reduce((s,i)=>s+i.qty,0);
function updCartBar(){
  const bar=$('#cart-bar');if(!bar)return;
  if(!CART.length){bar.classList.remove('show');return}
  bar.classList.add('show');
  const info=$('#cart-bar-info');
  if(info)info.innerHTML=`<b>${cartQtd()} item${cartQtd()!==1?'s':''}</b> no carrinho &nbsp;·&nbsp; <b>${brl(cartTotal())}</b>`;
}

/* ============================= PEDIDOS ============================= */
async function fazerPedido(obs){
  if(!CART.length)return;
  const itens=CART.map(i=>i.outros?{id:i.id,nome:i.nome,qty:i.qty,preco:0,preco_orig:0,preco_venda:0,outros:true,descricao:i.descricao||''}:{id:i.id,produto_id:i.produto_id,nome:i.nome,qty:i.qty,preco:i.preco,preco_orig:i.preco_orig,preco_venda:precoVenda(i.id,i.preco),preco_tipo:INDIV?'individual':'padrao'});
  const subtotal=cartTotal();
  const venda_total=itens.reduce((s,i)=>s+i.preco_venda*i.qty,0);
  const cli=clientesAtivo()?CLIENTES.find(c=>c.id===CLIENTE_SEL):null;
  const tipo_pag=REV_USER.tipo==='consignado'?'consignado':'avista';
  const {data,error}=await SB.from('pedidos_revendedor').insert([{
    revendedor_id:REV_USER.id,
    revendedor_nome:REV_USER.nome,
    itens,subtotal,obs:obs||'',
    custo_total:subtotal,venda_total,
    cliente_id:cli?cli.id:null,cliente_nome:cli?cli.nome:null,
    entrega:cli?{nome:cli.nome,telefone:cli.telefone,cep:cli.cep,endereco:cli.endereco,numero:cli.numero,complemento:cli.complemento,bairro:cli.bairro,cidade:cli.cidade}:null,
    tipo_pagamento:tipo_pag,
    forma_pagamento:tipo_pag==='consignado'?'consignado':FORMA_PAG,
    status:'novo'
  }]).select().maybeSingle();
  if(error){alert(/forma_pagamento|column|schema/i.test(error.message||'')?'Falta liberar a forma de pagamento no sistema. Avise a ZP Imports.':'Erro ao enviar pedido. Tente novamente.');return}
  // Se consignado: registrar saída de estoque
  if(REV_USER.tipo==='consignado'&&data){
    const movs=itens.filter(i=>!i.outros).map(i=>({revendedor_id:REV_USER.id,tipo:'saida',produto_id:i.produto_id,produto_nome:i.nome,quantidade:i.qty,valor_unitario:i.preco,valor_total:i.preco*i.qty,pedido_id:data.id,criado_em:new Date().toISOString()}));
    await SB.from('consignado_movimentos').insert(movs);
  }
  CART=[];lsSet('cart',[]);updCartBar();CLIENTE_SEL='';OBS_TMP='';
  await carregarDados();
  PAGE='pedidos';PAGE_DATA={success:data.id};render();
}

const ORD={};
function ordTab(t,c){const s=ORD[t]||{};ORD[t]={c,d:s.c===c?-s.d:1};render()}
function ordTh(t,c,txt,cls){const s=ORD[t];return '<th'+(cls?' class="'+cls+'"':'')+' style="cursor:pointer;user-select:none" ondblclick="ordTab(\''+t+'\',\''+c+'\')" title="Dê dois cliques para ordenar">'+txt+((s&&s.c===c)?(s.d>0?' ▲':' ▼'):'')+'</th>'}

function renderPage(){
  switch(PAGE){
    case 'dashboard':return pageDashboard();
    case 'catalogo':return pageCatalogo();
    case 'meucat':return pageMeuCatalogo();
    case 'clientes':return pageClientes();
    case 'checkout':return pageCheckout();
    case 'pedidos':return pagePedidos();
    case 'extrato':return pageExtrato();
    case 'avisos':return pageAvisos();
    case 'perfil':return pagePerfil();
    default:return pageDashboard();
  }
}

async function salvarVenda(id,txt){
  txt=(txt||'').trim();
  if(!txt){
    delete VENDA[id];atualizaVendaUI(id);
    await SB.from('revendedor_venda_var').delete().eq('revendedor_id',REV_USER.id).eq('variacao_id',id);return;
  }
  const v=parseFloat(txt.replace(/\./g,'').replace(',','.'));
  if(isNaN(v)||v<0){alert('Preço inválido.');return}
  VENDA[id]=v;atualizaVendaUI(id);
  const {error}=await SB.from('revendedor_venda_var').upsert([{revendedor_id:REV_USER.id,variacao_id:id,preco_venda:v,atualizado_em:new Date().toISOString()}],{onConflict:'revendedor_id,variacao_id'});
  if(error)alert('Não foi possível salvar o preço. Tente novamente.');
}
async function preencherVendaMargem(){
  const rows=PRODUTOS.filter(p=>!p.consulta&&precoRev(p)>0&&VENDA[p.id]==null).map(p=>{
    const v=Math.round(precoRev(p)*(1+MARGEM_PCT/100)*100)/100;
    return {revendedor_id:REV_USER.id,variacao_id:p.id,preco_venda:v,atualizado_em:new Date().toISOString()};
  });
  if(!rows.length)return;
  const {error}=await SB.from('revendedor_venda_var').upsert(rows,{onConflict:'revendedor_id,variacao_id'});
  if(error){alert('Não foi possível salvar os preços.');return}
  rows.forEach(r=>{VENDA[r.variacao_id]=r.preco_venda});render();
}
async function baixarImagemProduto(id){
  const p=PRODUTOS.find(x=>x.id===id);if(!p)return;
  const pv=precoVenda(id,precoRev(p));
  const S=1080,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#e5f3ef';g.fillRect(0,0,S,S);
  let semFoto=!p.imagem;
  if(p.imagem){
    try{
      const img=await new Promise((ok,no)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>ok(im);im.onerror=no;im.src=p.imagem});
      const r=Math.max(S/img.width,S/img.height),w=img.width*r,h=img.height*r;
      g.drawImage(img,(S-w)/2,(S-h)/2,w,h);
    }catch{semFoto=true}
  }
  g.fillStyle='rgba(7,77,64,.93)';g.fillRect(0,S-240,S,240);
  g.textBaseline='alphabetic';g.fillStyle='#fff';g.font='600 46px Poppins,Arial,sans-serif';
  let nome=p.nome;while(nome.length>3&&g.measureText(nome).width>S-96)nome=nome.slice(0,-2);
  if(nome!==p.nome)nome=nome.trimEnd()+'…';
  g.fillText(nome,48,S-148);
  g.fillStyle='#ffb703';g.font='700 104px Poppins,Arial,sans-serif';
  g.fillText(brl(pv),48,S-40);
  try{
    c.toBlob(b=>{
      if(!b){alert('Não foi possível gerar a imagem.');return}
      const a=document.createElement('a');a.href=URL.createObjectURL(b);
      a.download=(p.nome.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'produto')+'.png';
      a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      if(semFoto&&p.imagem)alert('A foto não pôde ser carregada; a imagem foi gerada sem ela.');
    },'image/png');
  }catch{alert('O navegador bloqueou a exportação da foto. Use Imprimir / salvar PDF.')}
}

function repetirPedido(id){
  const p=PEDIDOS.find(x=>x.id===id);if(!p)return;
  const novos=[],fora=[];
  (p.itens||[]).forEach(x=>{

}

/* digitou o CEP: preenche rua, bairro e cidade (ViaCEP), sem apagar o que o revendedor já escreveu */
async function cepRev(el){
  const d=el.value.replace(/\D/g,'').slice(0,8);
  el.value=d.length>5?d.slice(0,5)+'-'+d.slice(5):d;
  if(d.length!==8)return;
  try{
    const r=await fetch('https://viacep.com.br/ws/'+d+'/json/');const j=await r.json();if(!j||j.erro)return;
    const set=(id,v)=>{const e=document.getElementById(id);if(e&&v&&!e.value.trim())e.value=v};
    set('cl-endereco',j.logradouro);set('cl-bairro',j.bairro);set('cl-cidade',j.localidade);
    const n=document.getElementById('cl-numero');if(n)n.focus();
  }catch(e){}
}

async function salvarCliente(e,id){
  e.preventDefault();
  const g=k=>document.getElementById('cl-'+k).value.trim();
  const d={nome:g('nome'),telefone:g('telefone'),cep:g('cep'),endereco:g('endereco'),numero:g('numero'),complemento:g('complemento'),bairro:g('bairro'),cidade:g('cidade'),obs:g('obs')};
  if(!d.nome){msgPerfil('cl-msg','Informe o nome do cliente.','err');return false}
  if(!d.endereco||!d.cidade){msgPerfil('cl-msg','Informe ao menos a rua e a cidade para a entrega.','err');return false}
  const fn=String(d.telefone||'').replace(/\D/g,'').slice(-8);
  const igual=fn.length>=8?CLIENTES.find(c=>c.id!==id&&String(c.telefone||'').replace(/\D/g,'').slice(-8)===fn):null;
  if(igual&&!confirm('Já existe um cliente com este telefone: '+igual.nome+'.\n\nCadastrar mesmo assim? (OK = cadastrar de novo · Cancelar = voltar)'))return false;
  let q;
  if(id)q=SB.from('revendedor_clientes').update(d).eq('id',id).eq('revendedor_id',REV_USER.id).select().maybeSingle();
  else q=SB.from('revendedor_clientes').insert([{...d,revendedor_id:REV_USER.id}]).select().maybeSingle();
  const {data,error}=await q;
  if(error){msgPerfil('cl-msg','Erro ao salvar o cliente. Tente novamente.','err');return false}
  const {data:lista}=await SB.from('revendedor_clientes').select('*').eq('revendedor_id',REV_USER.id).order('nome');
  CLIENTES=lista||CLIENTES;
  if(!id&&data&&PAGE==='checkout')CLIENTE_SEL=data.id;
  closeModal();render();return false;
}
async function excluirCliente(id){
  if(!confirm('Excluir este cliente? Os pedidos já feitos continuam no histórico.'))return;
  const {error}=await SB.from('revendedor_clientes').delete().eq('id',id).eq('revendedor_id',REV_USER.id);
  if(error){alert('Não foi possível excluir.');return}
  CLIENTES=CLIENTES.filter(c=>c.id!==id);if(CLIENTE_SEL===id)CLIENTE_SEL='';render();
}

function verPedido(id){
  const p=PEDIDOS.find(x=>x.id===id);if(!p)return;
  setTimeout(()=>comprovanteCarrega(p),0);
  const stEtapas=[
    {k:'novo',l:'Pedido recebido',i:'📋'},
    {k:'confirmado',l:'Confirmado pela ZP Imports',i:'✅'},
    {k:'em_separacao',l:'Em separação',i:'📦'},
    {k:'em_rota',l:'Saiu para entrega',i:'🚚'},
    {k:'entregue',l:'Entregue',i:'🎉'},
  ];
  const idx=stEtapas.findIndex(s=>s.k===p.status);
  openModal(`<h3 style="margin-top:0">Pedido de ${fmtD(p.criado_em)}</h3>
    <span class="badge ${ST_CLS[p.status]||'novo'}">${ST_LAB[p.status]||p.status}</span>
    <h4 style="margin:16px 0 6px">Itens</h4>
    <table><thead><tr><th>Produto</th><th>Qtd</th><th class="r">Subtotal</th></tr></thead>
    <tbody>${(p.itens||[]).map(i=>`<tr><td>${esc(i.nome)}</td><td>${i.qty}</td><td class="r">${brl(i.preco*i.qty)}</td></tr>`).join('')}
    <tr><td colspan="2"><b>Seu custo</b></td><td class="r"><b>${brl(p.subtotal)}</b></td></tr>
    ${p.venda_total!=null?`<tr><td colspan="2">Venda estimada</td><td class="r">${brl(p.venda_total)}</td></tr><tr><td colspan="2">Lucro estimado</td><td class="r" style="color:var(--p)"><b>${brl(p.venda_total-p.subtotal)}</b></td></tr>`:''}</tbody></table>
    ${p.entrega?`<div class="note rev">📍 <b>Entrega para ${esc(p.entrega.nome)}</b><br>${esc(enderecoCli(p.entrega))}${p.entrega.telefone?'<br>📞 '+esc(p.entrega.telefone):''}</div>`:''}
    <div style="margin-top:12px"><button class="btn ghost sm" onclick="waPedidoZP('${p.id}')" style="display:inline-flex;align-items:center;gap:6px">${WA_ICO} Falar com a ZP sobre este pedido</button></div>
    ${cobrancaPedidoHtml(p)}
    <h4 style="margin:16px 0 6px">Acompanhamento</h4>
    <div class="tl">
      ${stEtapas.map((s,i)=>{
        const done=i<=idx&&idx>=0;
        const current=i===idx;
        return `<div class="tl-item ${done?'done':''}">
          <div class="dot ${current?'pulse':''}"></div>
          <strong>${s.i} ${s.l}</strong>
          ${i===idx?`<small>Status atual</small>`:''}
        </div>`;
      }).join('')}
    </div>
    ${p.forma_pagamento?`<div class="note">💳 <b>Pagamento:</b> ${esc(FORMA_LB[p.forma_pagamento]||p.forma_pagamento)}</div>`:''}
    ${p.obs?`<div class="note"><b>Obs:</b> ${esc(p.obs)}</div>`:''}
    <button class="btn ghost full" style="margin-top:12px" onclick="closeModal()">Fechar</button>`);
}

    <div class="box">
      <table>
        <thead><tr>${ordTh('mov','d','Data')}${ordTh('mov','t','Tipo')}${ordTh('mov','p','Produto')}${ordTh('mov','q','Qtd')}${ordTh('mov','v','Valor','r')}</tr></thead>
        <tbody>${ordLista('mov',MOVIMENTOS,{d:m=>String(m.criado_em||''),t:m=>m.tipo||'',p:m=>String(m.produto_nome||'').toLowerCase(),q:m=>+m.quantidade||0,v:m=>+m.valor_total||0}).map(m=>`<tr>
          <td data-l="Data" style="font-size:.8rem">${fmtD(m.criado_em)}</td>
          <td data-l="Tipo"><span class="tipo ${m.tipo}">${{saida:'📦 Saída',venda:'💰 Venda',repasse:'✅ Repasse',devolucao:'↩ Devolução'}[m.tipo]||m.tipo}</span></td>
          <td data-l="Produto">${esc(m.produto_nome||'—')}</td>
          <td data-l="Qtd">${m.quantidade||'—'}</td>
          <td class="r" data-l="Valor"><b>${brl(m.valor_total)}</b></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`}
    <div class="note warn" style="margin-top:16px">
      <b>Como funciona:</b> Quando você faz um pedido, as saídas são registradas automaticamente.
      As vendas e repasses são registrados pela ZP Imports conforme seu atendimento.
    </div>
  </div>`;
}

function calcSaldo(){
  const saidas=MOVIMENTOS.filter(m=>m.tipo==='saida').reduce((s,m)=>s+(m.valor_total||0),0);
  const repasses=MOVIMENTOS.filter(m=>['repasse','devolucao'].includes(m.tipo)).reduce((s,m)=>s+(m.valor_total||0),0);
  return Math.max(0,saidas-repasses);
}

async function doEditarPerfil(e){
  e.preventDefault();
  const btn=e.target.querySelector('[type=submit]');
  if(btn){btn.disabled=true;btn.textContent='Salvando...'}
  const nome=document.getElementById('pf-nome').value.trim();
  const tel=document.getElementById('pf-tel').value.trim();
  const {error}=await SB.from('revendedores').update({nome,telefone:tel}).eq('id',REV_USER.id);
  if(btn){btn.disabled=false;btn.textContent='Salvar alterações'}
  if(error){msgPerfil('pf-msg','Erro ao salvar. Tente novamente.','err');return false}
  REV_USER.nome=nome;REV_USER.telefone=tel;
  lsSet('session',{id:REV_USER.id});
  msgPerfil('pf-msg','Dados atualizados com sucesso!','ok');
  render();return false;
}

async function doTrocarSenha(e){
  e.preventDefault();
  const btn=e.target.querySelector('[type=submit]');
  const atual=document.getElementById('ps-atual').value;
  const nova=document.getElementById('ps-nova').value;
  const nova2=document.getElementById('ps-nova2').value;
  if(nova!==nova2){msgPerfil('ps-msg','As novas senhas não coincidem.','err');return false}
  if(nova.length<6){msgPerfil('ps-msg','A nova senha deve ter pelo menos 6 caracteres.','err');return false}
  if(btn){btn.disabled=true;btn.textContent='Alterando...'}
  const {data:ok,error}=await SB.rpc('revendedor_alterar_senha',{p_id:REV_USER.id,p_atual:atual,p_nova:nova});
  if(btn){btn.disabled=false;btn.textContent='Alterar senha'}
  if(error){msgPerfil('ps-msg','Erro ao atualizar. Tente novamente.','err');return false}
  if(!ok){msgPerfil('ps-msg','Senha atual incorreta.','err');return false}
  msgPerfil('ps-msg','Senha alterada com sucesso!','ok');
  return false;
}

/* ---- catálogo em PDF: monta uma página HTML pronta para imprimir/salvar em PDF (A4) ---- */
function catEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function catBrl(v){return 'R$ '+Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
/* itens: [{nome,sku,descricao,cat,foto,vars:[{nome,unidades,preco,preco_promo}]}]
   op: {titulo,marca,fone,valores (false = sem preços),detalhes (true = mostra código e descrição),imprimir}
   Cada categoria começa numa página nova, com o nome da categoria embaixo da linha do topo. */
function catalogoHtml(itens,op){
  op=op||{};const marca=op.marca||'ZP Imports',titulo=op.titulo||'Catálogo de Produtos';
  const mostraValores=op.valores!==false,detalhes=!!op.detalhes;
  const POR=6;
  const ordem=[];itens.forEach(function(p){if(ordem.indexOf(p.cat||'')<0)ordem.push(p.cat||'')});
  const paginas=[];
  ordem.forEach(function(c){const g=itens.filter(function(p){return (p.cat||'')===c});for(let i=0;i<g.length;i+=POR)paginas.push({cat:c,itens:g.slice(i,i+POR),cont:i>0})});
  const cruz='<svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="18" rx="1.5"/><rect x="3" y="9" width="18" height="6" rx="1.5"/></svg>';
  const logo='<div class="logo"><span class="mk">'+cruz+'</span><span class="nm">'+catEsc(marca)+'</span></div>';
  /* uma linha por variação: "Caixa com 4 unidades — R$ 380,00". Sem preço (ou com valores desligados), só o nome. */
  const linha=function(v){
    const tem=mostraValores&&v.preco!=null&&v.preco!==''&&!isNaN(+v.preco);
    if(!tem)return '<div class="pv"><span class="vn">'+catEsc(v.nome)+'</span></div>';
    const promo=v.preco_promo!=null&&v.preco_promo!==''&&+v.preco_promo>0&&+v.preco_promo<+v.preco;
    const un=+v.unidades>1?'<small>'+catBrl((promo?v.preco_promo:v.preco)/v.unidades)+' por unidade</small>':'';
    const val=promo?'<s>'+catBrl(v.preco)+'</s> <b>'+catBrl(v.preco_promo)+'</b>':'<b>'+catBrl(v.preco)+'</b>';
    return '<div class="pv"><span class="vn">'+catEsc(v.nome)+' <span class="tr">—</span></span> <span class="vp">'+val+'</span>'+un+'</div>';
  };
  const card=function(p){
    const vs=(p.vars||[]);const lim=vs.length>4?3:4;const vis=vs.slice(0,lim);
    const faltam=vs.length-lim;const mais=faltam>0?'<div class="mais">+ '+faltam+' outra'+(faltam>1?'s':'')+' opç'+(faltam>1?'ões':'ão')+'</div>':'';
    const img=p.foto?'<img src="'+catEsc(p.foto)+'" alt="">':'<span class="ph">'+catEsc((p.nome||'?').trim().charAt(0).toUpperCase())+'</span>';
    return '<div class="card"><div class="foto">'+img+'</div><div class="corpo"><h3>'+catEsc(p.nome)+'</h3>'+(detalhes&&p.sku?'<div class="sku">Cód. '+catEsc(p.sku)+'</div>':'')+(detalhes&&p.descricao?'<p>'+catEsc(p.descricao)+'</p>':'')+'<div class="precos">'+vis.map(linha).join('')+mais+'</div></div></div>';
  };
  const css='@page{size:A4;margin:0}*{box-sizing:border-box;margin:0;padding:0}html,body{background:#fff}body{font-family:"Poppins",Arial,Helvetica,sans-serif;color:#2b2b2b;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
   +'.pag{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always;break-after:page;background:#fff}.pag:last-child{page-break-after:auto;break-after:auto}'
   +'.logo{display:flex;align-items:center;gap:3mm}.mk{width:11mm;height:11mm;border-radius:3.2mm;background:#0a6e5c;color:#fff;display:inline-grid;place-items:center;padding:2.2mm}.nm{font-weight:700;font-size:15pt;letter-spacing:-.02em;color:#0a6e5c}'
   +'.topo{position:absolute;left:14mm;right:14mm;top:0;height:23mm;display:flex;align-items:center;justify-content:space-between;border-bottom:.5mm solid #ffb703}.topo .tt{font-size:9.5pt;color:#6f6f6f;font-weight:500;letter-spacing:.04em;text-transform:uppercase}'
   +'.catt{position:absolute;left:14mm;right:14mm;top:25mm;height:11mm;display:flex;align-items:center;font-size:15pt;font-weight:700;color:#0a6e5c;letter-spacing:-.01em}.catt small{font-size:9pt;font-weight:500;color:#8a8a8a;margin-left:3mm}'
   +'.grade{position:absolute;left:14mm;right:14mm;top:37mm;bottom:18mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:5mm}'
   +'.card{border:.3mm solid #e2e8e5;border-radius:4mm;overflow:hidden;display:flex;flex-direction:column;background:#fff;text-align:center}'
   +'.foto{height:32mm;position:relative;overflow:hidden;background:#f1f7f5;flex:none}.foto img{position:absolute;left:1.5mm;top:1.5mm;width:calc(100% - 3mm);height:calc(100% - 3mm);object-fit:contain}.ph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16mm;height:16mm;border-radius:50%;background:#dcefe9;color:#0a6e5c;display:grid;place-items:center;font-size:18pt;font-weight:700}'
   +'.corpo{flex:1 1 0;min-height:0;overflow:hidden;padding:3.2mm 4mm 2.4mm;display:flex;flex-direction:column;align-items:center}.corpo>*{flex:none}.corpo>:first-child{margin-top:auto}.corpo>:last-child{margin-bottom:auto}'
   +'.corpo h3{font-size:11pt;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.sku{font-size:7pt;color:#8a8a8a;margin-top:.6mm}.corpo p{font-size:7.8pt;color:#6f6f6f;line-height:1.4;margin-top:1mm;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}'
   +'.precos{margin-top:2.2mm;width:100%}.pv{padding:.7mm 0;line-height:1.3;font-size:9pt}.vn{font-weight:500;color:#333}.tr{color:#9a9a9a}.vp{white-space:nowrap}.vp b{font-size:12.5pt;color:#0a6e5c;font-weight:800;letter-spacing:-.01em}.vp s{color:#8a8a8a;font-size:8.5pt;font-weight:500;margin-right:.8mm}.pv small{display:block;font-size:6.8pt;font-weight:400;color:#8a8a8a}.mais{font-size:7pt;color:#8a8a8a;margin-top:.6mm}'
   +'.rodape{position:absolute;left:14mm;right:14mm;bottom:0;height:14mm;border-top:.3mm solid #e2e8e5;display:flex;align-items:center;justify-content:space-between;font-size:8pt;color:#6f6f6f}.rodape b{color:#0a6e5c;font-weight:600}';
  const corpo=paginas.map(function(pg){
    return '<section class="pag"><div class="topo">'+logo+'<span class="tt">'+catEsc(titulo)+'</span></div>'+(pg.cat?'<div class="catt">'+catEsc(pg.cat)+(pg.cont?'<small>(continuação)</small>':'')+'</div>':'')+'<div class="grade">'+pg.itens.map(card).join('')+'</div><div class="rodape"><span><b>'+catEsc(marca)+'</b> — Catálogo</span>'+(op.fone?'<span>WhatsApp '+catEsc(op.fone)+'</span>':'<span></span>')+'</div></section>';
  }).join('');
  const auto='<script>(function(){function ajusta(){[].forEach.call(document.querySelectorAll(".card"),function(c){var f=c.querySelector(".foto"),i=c.querySelector(".corpo"),h=32;while(i.scrollHeight>i.clientHeight+1&&h>12){h-=1;f.style.height=h+"mm"}})}var im=[].slice.call(document.images).filter(function(i){return !i.complete});var f=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();Promise.all([f].concat(im.map(function(i){return new Promise(function(r){i.onload=i.onerror=r})}))).then(function(){ajusta();'+(op.imprimir?'setTimeout(function(){window.print()},400);':'')+'})})()<\/script>';
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>'+catEsc(titulo)+' - '+catEsc(marca)+'</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>'+css+'@media screen{body{background:#e9edeb;padding:8mm 0}.pag{margin:0 auto 8mm;box-shadow:0 2px 16px rgba(0,0,0,.18)}}</style></head><body>'+corpo+auto+'</body></html>';
}
function catalogoPdfAbrir(){
  const prods={};
  PRODUTOS.filter(p=>!p.consulta&&precoRev(p)>0).forEach(p=>{(prods[p.produto_id]=prods[p.produto_id]||{id:p.produto_id,nome:p.nome_produto||p.nome,itens:[]}).itens.push(p)});
  window.CATPDF=prods;const lista=Object.values(prods);
  if(!lista.length){alert('Ainda não há produtos com preço no seu catálogo.');return}
  openModal(`<h3 style="margin-top:0">Catálogo em PDF</h3><p style="color:var(--muted);margin:0 0 10px">Escolha o que entra. O catálogo sai com a marca ZP Imports e o seu WhatsApp, e você salva em PDF.</p>
    <label style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" id="cp-val" checked style="width:auto"> Mostrar os meus preços de venda</label>

}
function catalogoPdfGerar(){
  const marcados=[].slice.call(document.querySelectorAll('.cp-p:checked')).map(x=>x.value);
  if(!marcados.length){alert('Marque pelo menos um produto.');return}
  const valores=!!(document.getElementById('cp-val')||{}).checked;
  const itens=marcados.map(id=>window.CATPDF[id]).filter(Boolean).map(p=>({nome:p.nome,cat:((p.itens[0].categoria||[])[0])||'',foto:p.itens[0].imagem,vars:p.itens.map(v=>({nome:v.nome_var||v.nome,unidades:v.unidades,preco:precoVenda(v.id,precoRev(v)),preco_promo:null}))}));
  const d=String(REV_USER.telefone||'').replace(/\D/g,'');
  const fone=d.length>=10?'('+d.slice(-11,-9||undefined)+') '+d.slice(-9,-4)+'-'+d.slice(-4):'';
  const html=catalogoHtml(itens,{titulo:'Catálogo de Produtos',marca:'ZP Imports',fone,valores,imprimir:true});
  const w=window.open('','_blank');
  if(!w){alert('O navegador bloqueou a janela do catálogo. Libere os pop-ups e tente de novo.');return}
  w.document.open();w.document.write(html);w.document.close();
}

/*
  TABELAS NECESSÁRIAS NO SUPABASE:

  CREATE TABLE revendedores (
    id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
    nome text NOT NULL,
    email text UNIQUE NOT NULL,
    telefone text,
    senha text NOT NULL,
    tipo text DEFAULT 'comprador', -- 'comprador' | 'consignado'

    criado_em timestamptz DEFAULT now(),
    aprovado_em timestamptz,
    obs text
  );

  CREATE TABLE pedidos_revendedor (
    id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
    revendedor_id uuid REFERENCES revendedores(id),
    revendedor_nome text,
    itens jsonb NOT NULL,
    subtotal numeric DEFAULT 0,
    status text DEFAULT 'novo',
    tipo_pagamento text DEFAULT 'avista',
    obs text,
    criado_em timestamptz DEFAULT now()
  );

  CREATE TABLE consignado_movimentos (
    id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
    revendedor_id uuid REFERENCES revendedores(id),
    tipo text, -- 'saida' | 'venda' | 'repasse' | 'devolucao'
    produto_id integer,
    produto_nome text,
    quantidade integer DEFAULT 0,
    valor_unitario numeric DEFAULT 0,
    valor_total numeric DEFAULT 0,
    pedido_id uuid,
    obs text,
    criado_em timestamptz DEFAULT now()
  );

  -- Preços exclusivos, preço de venda, clientes e custo/venda do pedido:
  -- veja supabase/19_revendedor_precos_clientes.sql

  -- RLS: habilitar e criar políticas adequadas
  ALTER TABLE revendedores ENABLE ROW LEVEL SECURITY;
  ALTER TABLE pedidos_revendedor ENABLE ROW LEVEL SECURITY;
  ALTER TABLE consignado_movimentos ENABLE ROW LEVEL SECURITY;

  -- Política permissiva temporária (ajustar conforme necessidade):
