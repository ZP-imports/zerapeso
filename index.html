<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0a6e5c;--pd:#074d40;--pl:#e5f3ef;--acc:#ffb703;--accd:#e09e00;--ink:#2b2b2b;--ink2:#444;--muted:#6f6f6f;--line:#e6e6e6;--bg:#f3f3f3;--wa:#25d366;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:var(--ink2);background:#fff;font-size:15px;line-height:1.55}
a{color:var(--pd);text-decoration:none}button{font:inherit;cursor:pointer}
img,svg{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.proto{background:#fff8e1;color:#6b4c00;font-size:.78rem;text-align:center;padding:6px 12px;border-bottom:1px solid #f1e0a8}
.hd{display:flex;align-items:center;gap:22px;padding:14px 20px;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.45rem;color:var(--p);letter-spacing:-.02em;cursor:pointer;flex:none}
.mark{width:44px;height:44px;border-radius:13px;background:var(--acc);display:grid;place-items:center}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;border:1.5px solid #c9c9d2;border-radius:14px;padding:0 14px;height:48px;color:var(--muted)}
.search:focus-within{border-color:var(--p)}.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;color:var(--ink);min-width:0;padding:0}
.tools{margin-left:auto;display:flex;align-items:center;gap:18px}
.tool{display:flex;align-items:center;gap:8px;font-weight:500;font-size:.9rem;color:var(--ink);background:none;border:0;padding:0;position:relative}
.tool:hover{color:var(--p)}
.cnt{position:absolute;top:-9px;right:-11px;background:var(--acc);color:#3b2a00;border-radius:999px;min-width:20px;height:20px;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cnt.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.6)}100%{transform:scale(1)}}
.burger{display:none;background:none;border:0;color:var(--p)}
nav.main{background:var(--bg);position:relative}
nav.main ul{list-style:none;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;justify-content:center;max-width:1240px;align-items:center}
nav.main>ul>li>a{display:flex;align-items:center;gap:4px;padding:14px 14px;font-weight:500;color:var(--ink);cursor:pointer;font-size:.93rem}
nav.main>ul>li:hover>a{color:var(--p)}
nav.main>ul>li.amigo>a{background:var(--acc);color:#3b2a00;border-radius:999px;padding:7px 16px;margin:0 6px;font-weight:600}
nav.main>ul>li.amigo>a:hover{background:var(--accd);color:#3b2a00}
@media(min-width:761px){nav.main ul{justify-content:flex-start}nav.main>ul>li.amigo{margin-left:auto}}
.mega{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border-top:3px solid var(--acc);box-shadow:0 18px 40px rgba(0,0,0,.14);padding:24px 0;z-index:40}
nav.main>ul>li.m{position:static}
nav.main>ul>li:hover>.mega{display:block}
.mega-g{max-width:1240px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px}
.mega b{display:block;color:var(--p);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;cursor:pointer}
.mega i{display:block;font-style:normal;padding:3px 0;font-size:.88rem;color:var(--ink2);cursor:pointer}.mega i:hover{color:var(--p);text-decoration:underline}
.simple{position:relative}.simple .mega-s{display:none;position:absolute;left:0;top:100%;background:#fff;border-top:3px solid var(--acc);box-shadow:0 18px 40px rgba(0,0,0,.14);padding:12px 18px;min-width:250px;z-index:40}
.simple:hover .mega-s{display:block}.mega-s a{display:block;padding:5px 0;font-size:.88rem;color:var(--ink2)}
.faixa{background:var(--p);color:#fff;text-align:center;font-size:.85rem;font-weight:500;padding:9px 12px}
.hero{position:relative;overflow:hidden;height:clamp(230px,34vw,440px)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .6s;color:#fff;display:flex;align-items:center;cursor:pointer}
.sl.on{opacity:1;z-index:1}.sl .wrap{width:100%}
.sl strong{display:block;font-size:clamp(1.7rem,4.6vw,3.4rem);line-height:1.08;max-width:16ch;letter-spacing:-.02em}
.tag{display:inline-block;background:var(--acc);color:#3b2a00;border-radius:999px;padding:.2em 1em;font-weight:600;font-size:.85rem;margin-bottom:14px}
.sl u{text-decoration:none;display:inline-block;margin-top:20px;background:#fff;color:var(--pd);border-radius:999px;padding:.7em 1.6em;font-weight:600}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);display:grid;place-items:center}
.arr.l{left:12px}.arr.r{right:12px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.7);padding:0}.dots button.on{background:var(--acc);width:26px;border-radius:6px}
.ben{padding:26px 0 6px}.ben .g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bi{display:flex;align-items:center;gap:16px;background:var(--bg);border-radius:var(--r);padding:20px}
.bi .ic{width:62px;height:62px;border-radius:50%;background:#e3e3e3;display:grid;place-items:center;color:var(--p);flex:none}
.bi b{display:block;color:var(--ink);font-size:.98rem}.bi small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35}
.sec{padding:34px 0 6px}.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}.sh h2{margin:0;font-size:1.45rem;color:var(--ink)}.sh a{color:var(--p);font-weight:500;font-size:.9rem;cursor:pointer}
.deps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.dep{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:500;color:var(--ink);cursor:pointer;text-align:center}
.dep span{width:104px;height:104px;border-radius:50%;background:var(--pl);display:grid;place-items:center;color:var(--p);border:3px solid transparent;transition:.2s}.dep:hover span{border-color:var(--acc);transform:translateY(-4px)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{min-height:150px;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(135deg,var(--p),var(--pd));cursor:pointer;transition:.2s}.tile:nth-child(2n){background:linear-gradient(135deg,#0b5a8a,#084a73)}.tile:hover{transform:translateY(-4px)}
.tile b{font-size:1.1rem}.tile em{font-style:normal;font-size:.82rem;opacity:.9}
.amigoban{margin-top:40px;background:linear-gradient(120deg,#ffb703,#ffd166);color:#3b2a00;padding:34px 0}.amigoban .g{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.amigoban h2{margin:0 0 4px;font-size:clamp(1.4rem,3vw,2rem)}.amigoban p{margin:0;max-width:60ch}
.app{background:linear-gradient(120deg,var(--pd),var(--p));color:#fff;padding:44px 0;margin-top:30px}.app .g{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.app h2{font-size:clamp(1.5rem,3vw,2.2rem);margin:12px 0}.app p{opacity:.92;max-width:48ch}.stores{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stores span{background:#000;border-radius:12px;padding:.7em 1.2em;font-size:.88rem}
.appart{justify-self:center;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;color:var(--acc)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.unit{border:1px solid var(--line);border-radius:var(--r);padding:18px}.unit small{color:var(--p);font-weight:600}.unit h3{margin:4px 0 6px;font-size:1rem;color:var(--ink)}.unit p{margin:0;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;position:relative;background:#fff;transition:.2s}
.card:hover{box-shadow:0 12px 30px rgba(0,0,0,.1);transform:translateY(-3px)}
.pimg{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;margin-bottom:10px;cursor:pointer;color:#fff}
.pn{font-size:.9rem;font-weight:500;color:var(--ink);line-height:1.35;min-height:4em;cursor:pointer}
.price{margin:8px 0;font-weight:700;font-size:1.1rem;color:var(--ink)}.price del{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.sale{position:absolute;top:10px;left:10px;background:var(--acc);color:#3b2a00;border-radius:999px;padding:.35em .9em;font-weight:700;font-size:.72rem;z-index:2}
.out{position:absolute;top:10px;left:10px;background:#9aa5a0;color:#fff;border-radius:999px;padding:.35em .9em;font-weight:700;font-size:.72rem;z-index:2}
.btn{background:var(--p);color:#fff;border:0;border-radius:20px;padding:.75em 1.4em;font-weight:600;transition:.15s;text-align:center;display:inline-block}
.btn:hover{background:var(--pd);transform:translateY(-1px)}.btn:disabled{background:#b9c2bd;cursor:not-allowed;transform:none}
.btn.acc{background:var(--acc);color:#3b2a00}.btn.acc:hover{background:var(--accd)}.btn.wa{background:var(--wa);color:#06361f}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}.btn.sm{padding:.5em 1.1em;font-size:.88rem}
.card .btn{margin-top:auto;width:100%}
.btn.ok{background:#2e7d32!important;color:#fff!important}
.pg{padding:26px 0 70px;min-height:55vh}
.bc{font-size:.82rem;color:var(--muted);margin-bottom:16px}.bc a{color:var(--muted);cursor:pointer}.bc a:hover{color:var(--p)}
h1.t{font-size:1.9rem;color:var(--ink);margin:0 0 6px}
.cat{display:grid;grid-template-columns:240px 1fr;gap:26px;align-items:start}
.side{border:1px solid var(--line);border-radius:var(--r);padding:16px}.side h4{margin:0 0 8px;color:var(--p)}
.side a{display:block;padding:5px 0;color:var(--ink2);cursor:pointer;font-size:.9rem}.side a.on{color:var(--p);font-weight:600}.side a.sub{padding-left:14px;font-size:.85rem;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px;gap:10px;flex-wrap:wrap}
select,input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],textarea,.fr input:not([type=checkbox]),.box input:not([type=checkbox]):not([type=date]):not([type=number]){border:1px solid #c9c9d2;border-radius:12px;padding:.75em 1em;font:inherit;background:#fff;width:100%}
select{width:auto}.fr select{width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--p);outline:3px solid var(--pl)}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.pbig{aspect-ratio:1;border-radius:var(--r);display:grid;place-items:center;color:#fff}
.pinfo h1{font-size:1.7rem;margin:0 0 8px;color:var(--ink)}.pinfo .price{font-size:1.9rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}.qty button{border:0;background:none;width:36px;height:36px;font-size:1.1rem}.qty span{min-width:28px;text-align:center}
.box{border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px);background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px}td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}.r{text-align:right}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:start}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 18px;margin:12px 0}.tot .big{font-size:1.25rem;font-weight:700;color:var(--pd);border-top:1px solid var(--line);padding-top:8px}
.tot .dsc{color:#1b5e20;font-weight:600}
.note{background:var(--pl);color:var(--pd);border-radius:12px;padding:12px 14px;font-size:.9rem;margin:12px 0}.note.warn{background:#fff4d6;color:#6b4c00}.note.err{background:#fdecea;color:#8a1c14}
.fr{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.fr>div{grid-column:span 6}.fr .c2{grid-column:span 3}.fr .c3{grid-column:span 2}.fr .c4{grid-column:span 4}
label{font-weight:500;font-size:.88rem;display:block;margin-bottom:4px}
address{font-style:normal;background:var(--bg);border-radius:12px;padding:12px 14px;line-height:1.7}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs button{border:0;background:var(--bg);padding:.6em 1.2em;border-radius:999px;font-weight:500}.tabs button.on{background:var(--p);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;z-index:80}.ov.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:#fff;transform:translateX(100%);transition:.3s;z-index:90;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}.dw.on{transform:none}
.dw header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--ink)}
.dw .body{flex:1;overflow:auto;padding:12px 18px}.dw footer{padding:16px 18px;border-top:1px solid var(--line)}
.mi{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.mi .th{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast a{color:var(--acc);font-weight:600;cursor:pointer}
.wafloat{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;z-index:70;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .2s}
.wafloat::before,.wafloat::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--wa);opacity:.55;z-index:-1;animation:pulse 2.2s ease-out infinite}
.wafloat::after{animation-delay:1.1s}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.wafloat:hover{transform:scale(1.08)}
.wafloat .wl{position:absolute;right:72px;background:#fff;color:var(--ink);padding:6px 12px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:.82rem;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}
.wafloat:hover .wl{opacity:1}
.phone{width:min(330px,100%);margin:0 auto;border-radius:34px;background:#0b141a;padding:12px}
.scr{border-radius:24px;overflow:hidden;background:#0b141a}.wh{background:#202c33;color:#e9edef;padding:12px 14px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:var(--wa);display:grid;place-items:center;color:#06361f;font-weight:700}
.chat{min-height:340px;max-height:420px;overflow:auto;padding:14px 10px}.bub{background:#005c4b;color:#e9edef;border-radius:10px 10px 2px 10px;padding:9px 11px;font-size:.76rem;white-space:pre-wrap;word-break:break-word;margin-left:auto;max-width:96%;line-height:1.45}.bub.g{opacity:.55;border:1px dashed #6b8f86;background:transparent}
.wf{background:#202c33;padding:10px;display:flex;gap:8px;align-items:center;color:#8696a0;font-size:.8rem}.wf .in{flex:1;background:#2a3942;border-radius:999px;padding:8px 12px}.send{background:var(--wa);border:0;color:#06361f;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.tl{list-style:none;margin:14px 0 0;padding:0}.tl li{position:relative;padding:0 0 22px 36px}
.tl li::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:2px;background:var(--line)}.tl li:last-child::before{display:none}
.tl .d{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #cfd8d4;display:grid;place-items:center}
.tl li.done .d{background:var(--p);border-color:var(--p);color:#fff}.tl li.done::before{background:var(--p)}
.tl li.cur .d{border-color:var(--acc);box-shadow:0 0 0 5px #ffe9a8}
.tl strong{display:block;color:var(--ink)}.tl small{display:block;color:var(--muted)}.tl li.todo{opacity:.55}
.trk{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.88rem}.trk code{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.15em .6em;font-weight:600}
.st{display:inline-block;border-radius:6px;padding:.15em .6em;font-size:.78rem;font-weight:600}
.s-aguardando{background:#ffe9a8;color:#6b4c00}.s-confirmado{background:#c8e6c9;color:#1b5e20}.s-separacao{background:#bbdefb;color:#0d47a1}.s-enviado{background:#d1c4e9;color:#311b92}.s-entregue{background:#a5d6a7;color:#1b5e20}.s-cancelado{background:#e0e0e0;color:#424242}
.olist button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.olist button.on{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
.stb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.stb button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3em .9em;font-size:.84rem}.stb button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hist{background:#f7faf7;border:1px solid var(--line);border-radius:12px;padding:14px}.hist .big{font-weight:700;color:var(--pd);font-size:1.1rem}

<script>
/* ======================= CONFIGURAÇÃO ======================= */
const PC={ativa:true,pct:10};   // desconto de primeira compra (editável no painel)
const CFG0={brand:'ZP Imports',faixa:'Medicamentos para emagrecimento: {pct}%OFF na sua primeira compra',wa:'551231973615',frete:'Informada pela loja',linkPag:'',
 resp:['ZP Imports','CNPJ: preencher','Responsável técnico: preencher nome','CRF: preencher'],
 aviso:'Medicamentos devem ser usados com moderação. Leia a bula e siga as orientações da equipe.'};
let CFG=Object.assign({},CFG0);
const AMDEF={ativa:true,nome:'Amigo Emagrece Amigo, campanha Out/Nov 2026',pct:10,inicio:'2026-10-01',fim:'2026-11-30',limite:10};
const UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const TURNOS={manha:'Manhã',tarde:'Tarde',noite:'Noite'};
const LOGDEF={turnos:{manha:true,tarde:true,noite:true},antecedencia:1,janela:30,dias:[1,2,3,4,5,6],bloqueados:[],atrasoHoras:24,alertaAmarelo:12,alertaLaranja:20,fim:{manha:12,tarde:18,noite:22}};
const ADMINS=[];
const ICON={
 inj:'<rect x="4" y="9" width="12" height="6" rx="2" transform="rotate(-35 10 12)"/><path d="m15 7 3-3M17 9l3-3M5.5 18.5 8 16"/>',
 pill:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-40 12 12)"/>',
 caps:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-40 12 12)"/><path d="m10 8.5 5.5 6.5"/>',
 bottle:'<path d="M9 3h6v3H9z"/><path d="M8 6h8v14a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z"/><path d="M8 11h8"/>',
 needle:'<path d="M4 20 15 9"/><path d="m14 4 6 6M12 6l6 6"/>',
 scale:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9a4 4 0 0 1 8 0z"/><path d="m12 9 1.5-2"/>',
 tape:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 4v3M20 12h-3"/>',
 leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-15 14z"/><path d="M5 19 14 10"/>',
 heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 cross:'<rect x="9" y="3" width="6" height="18" rx="1.5"/><rect x="3" y="9" width="18" height="6" rx="1.5"/>'};
const svg=(k,s=56)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||ICON.cross}</svg>`;
const SOON=['Acompanhamento'];
const TREE={
 'Medicamentos':{'Injetáveis':['Canetas Aplicadoras'],'Orais':['Comprimidos','Cápsulas'],'Acessórios de Aplicação':['Agulhas','Seringas','Álcool e Algodão']},
 'Acompanhamento':{},
 'Ofertas':{}
};
const waUrl=msg=>'https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(msg||('Olá, '+CFG.brand+'! Gostaria de atendimento.'));
const EXTRA=[{t:'Campanhas',go:'/amigo',sub:[['Amigo Emagrece Amigo','/amigo'],['Regulamento Amigo Emagrece Amigo','/reg/amigo'],['Desconto na primeira compra','/reg/primeira-compra']]},{t:'Atendimento',go:'wa:',sub:[['Falar com o atendimento','wa:'],['Dúvidas frequentes','/info/duvidas'],['Como comprar','/info/como-comprar'],['Entregas','/info/entregas'],['Formas de pagamento','/info/pagamento']]}];
const PRODUCTS=[
];
const BASE=JSON.parse(JSON.stringify(PRODUCTS));
const OFERTA=p=>!!p.sale;
const LIVE=()=>PRODUCTS.filter(p=>p.ativo!==false);
const REG={'primeira-compra':'Desconto na primeira compra'};
const brl=v=>'R$ '+Number(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const unit=p=>{if(p.vars&&p.vars.length){const l=p.vars.filter(v=>!v.sp).map(v=>v.sale!=null?v.sale:v.p);return l.length?Math.min(...l):0}return p.sale||p.p};
const byId=id=>PRODUCTS.find(p=>p.id===+id);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

/* ======================= ESTADO (banco local, compartilhado entre abas) ======================= */
const DB={get(k,d){try{const v=localStorage.getItem('xp_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('xp_'+k,JSON.stringify(v))}catch(e){}}};
let cart,users,me,orders,seqUser,clock,AM,SITE,LOG,PEDIT,ROTAS,SEEN,ADMIN,OFFSET,REV,ENTR,ROTE,RETIR;
function load(){
  cart=DB.get('cart',[]).filter(i=>{const p=PRODUCTS.find(x=>x.id===+i.id);return p&&p.ativo!==false});users=DB.get('users',{});me=DB.get('me',null);orders=DB.get('orders',[]).filter(o=>!o.real).concat((typeof MEUS!=='undefined'&&MEUS)||[]);seqUser=DB.get('seq',{});clock=DB.get('clock',100);
  AM=Object.assign({},AMDEF,DB.get('amigo',{}));AM.nome=String(AM.nome).replace('Amigo Indica Amigo','Amigo Emagrece Amigo');
  SITE=DB.get('site',{});LOG=Object.assign({},LOGDEF,DB.get('log',{}));PEDIT=DB.get('pedit',{});ROTAS=DB.get('rotas',{});SEEN=DB.get('seen',{});ADMIN=DB.get('adm',null);OFFSET=DB.get('offset',0);REV=DB.get('rev',0);ENTR=DB.get('entr',[]);ROTE=DB.get('rote',[]);RETIR=DB.get('ret',[]);
  migrate();applySite();applyProd();
}
function save(){
  DB.set('cart',cart);DB.set('users',users);DB.set('me',me);DB.set('orders',orders.filter(o=>!o.real));DB.set('seq',seqUser);DB.set('clock',clock);DB.set('amigo',AM);
  DB.set('site',SITE);DB.set('log',LOG);DB.set('pedit',PEDIT);DB.set('rotas',ROTAS);DB.set('seen',SEEN);DB.set('adm',ADMIN);DB.set('offset',OFFSET);DB.set('entr',ENTR);DB.set('rote',ROTE);DB.set('ret',RETIR);
  REV=uid()+Date.now();DB.set('rev',REV);
}
function applySite(){
  CFG=Object.assign({},CFG0,SITE.cfg||{});
  PC.pct=SITE.pct!=null?+SITE.pct:10;
  CFG.faixa=String(SITE.cfg&&SITE.cfg.faixa?SITE.cfg.faixa:CFG0.faixa).replace('{pct}',PC.pct);
  CFG.resp=[CFG.brand].concat(CFG0.resp.slice(1));
  if(/orientação profissional/.test(CFG.aviso))CFG.aviso=CFG0.aviso;
  if(CFG.frete==='Grátis')CFG.frete=CFG0.frete;
  if(CFG.brand==='XP Imports')CFG.brand='ZP Imports';
}
function applyProd(){
  PRODUCTS.forEach((p,i)=>{Object.keys(p).forEach(k=>{if(!(k in BASE[i]))delete p[k]});Object.assign(p,BASE[i],PEDIT[p.id]||{});if(p.sale===''||p.sale==null||isNaN(p.sale))delete p.sale})
}
const STATUS_OLD={pago:'realizado',aguardando:'realizado','em-separacao':'separacao',enviado:'em-rota'};
function migrate(){
  let ch=false;
  orders.forEach(o=>{
    if(STATUS_OLD[o.status]){o.status=STATUS_OLD[o.status];ch=true}
    if(!o.eventos){o.eventos=(o.hist||[]).map(h=>({id:uid(),t:h.t,tipo:'status',para:STATUS_OLD[h.s]||h.s,publico:true,texto:pubTxt({entrega:o.entrega||{}},STATUS_OLD[h.s]||h.s,''),por:'Sistema'}));ch=true}
    if(!o.entrega){const u=users[o.user]||{};const e=u.end||{};o.entrega={nome:(u.nome||'')+' '+(u.sobrenome||''),fone:u.fone||'',principal:e,secundario:null,dest:e,data:'',turno:'',obs:o.obs||''};ch=true}
    if(!o.avisos){o.avisos=[];ch=true}
    if(migPag(o))ch=true;
  });
  if(ch)DB.set('orders',orders.filter(o=>!o.real));
}
load();

/* ======================= TEMPO E DATAS ======================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const now=()=>Date.now()+(OFFSET||0);
const hojeS=()=>ymd(new Date(now()));
const addDias=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const fmtDay=s=>s?new Date(s+'T12:00').toLocaleDateString('pt-BR'):'';
const fmtDM=s=>s?fmtDay(s).slice(0,5):'';
const wd=s=>new Date(s+'T12:00').getDay();
const fmtD=t=>t?new Date(t).toLocaleDateString('pt-BR')+' '+new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const dur=min=>{min=Math.max(0,Math.round(min));const d=Math.floor(min/1440),h=Math.floor(min%1440/60),m=min%60;return (d?d+' d ':'')+(h?h+' h ':'')+(!d?m+' min':'')};
const turnoNome=t=>TURNOS[t]||'';
const monthKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)};

/* ======================= STATUS, EVENTOS E ATRASO ======================= */
const ST=[['realizado','Pedido realizado'],['confirmado','Pedido confirmado'],['preparacao','Em preparação'],['separacao','Em separação'],['aguardando-programacao','Aguardando programação de entrega'],['programada','Entrega programada'],['em-rota','Saiu para entrega'],['entregue','Entregue']];
const STIDX=Object.fromEntries(ST.map((s,i)=>[s[0],i]));
const LAB=Object.assign(Object.fromEntries(ST),{tentativa:'Tentativa de entrega não concluída',cancelado:'Cancelado'});
const CLS={realizado:'s-aguardando',confirmado:'s-confirmado',pago:'s-confirmado',preparacao:'s-separacao',separacao:'s-separacao','aguardando-programacao':'s-prog',programada:'s-enviado','em-rota':'s-rota',entregue:'s-entregue',tentativa:'s-falha',cancelado:'s-cancelado'};
const COUNT=['confirmado','pago','preparacao','separacao','aguardando-programacao','programada','em-rota','entregue','tentativa'];
const FINAL=['entregue','cancelado'];
const actor=()=>ADMIN?ADMIN.nome:(me?'Cliente':'Sistema');
function pubTxt(o,s,motivo){
  const e=o.entrega||{};const dt=e.data?fmtDay(e.data)+(e.turno?', '+turnoNome(e.turno):''):'';
  return ({realizado:'Recebemos o seu pedido.',confirmado:'Pedido confirmado pela loja.',pago:'Pagamento confirmado! Seu pedido foi aprovado.',preparacao:'Estamos preparando o seu pedido.',separacao:'Seu pedido está em separação.','aguardando-programacao':'Estamos programando a entrega do seu pedido.',programada:'Entrega programada'+(dt?' para '+dt:'')+'.','em-rota':'Seu pedido saiu para entrega.'+(dt?' Previsão: '+dt+'.':''),entregue:'Pedido entregue.',tentativa:'Não foi possível concluir a entrega.'+(motivo?' Motivo: '+motivo+'.':''),cancelado:'Pedido cancelado.'+(motivo?' Motivo: '+motivo+'.':'')})[s]||'';
}
const IMPORTANTE=['programada','em-rota','entregue','tentativa','cancelado'];
function addEv(o,e){o.eventos=o.eventos||[];const ev=Object.assign({id:uid(),t:now(),por:actor(),publico:false},e);o.eventos.push(ev);return ev}
function addAviso(o,titulo,texto,extra){o.avisos=o.avisos||[];o.avisos.push(Object.assign({id:uid(),t:now(),titulo,texto,lido:false},extra||{}))}
function setStatus(o,s,opt){
  opt=opt||{};const de=o.status;if(de===s)return;
  o.status=s;
  if(COUNT.includes(s)){if(!o.conf)o.conf=clock++;o.reduced=true}
  if(s==='cancelado')o.reduced=false;
  const txt=opt.texto||pubTxt(o,s,opt.motivo);
  const ev=addEv(o,{tipo:'status',de,para:s,publico:true,texto:txt,motivo:opt.motivo||'',interno:opt.interno||''});
  if(IMPORTANTE.includes(s))addAviso(o,LAB[s],txt,{motivo:opt.motivo||'',previsao:o.entrega.data?{data:o.entrega.data,turno:o.entrega.turno}:null,evId:ev.id});
  if(s==='em-rota'&&typeof prepararMsgRota==='function')prepararMsgRota(o);
  save();return ev;
}
function fimJanela(o){

function validarEntrega(d,t){
  if(!d)return 'Escolha a data desejada para receber o pedido.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d+'T12:00')))return 'Data inválida.';
  const min=addDias(hojeS(),LOG.antecedencia),max=addDias(hojeS(),LOG.janela);
  if(d<min)return 'A data deve ser a partir de '+fmtDay(min)+'.';
  if(d>max)return 'A data deve ser até '+fmtDay(max)+'.';
  if(!LOG.dias.includes(wd(d)))return 'Não fazemos entregas neste dia da semana. Escolha outra data.';
  if(LOG.bloqueados.includes(d))return 'Não há entregas em '+fmtDay(d)+'. Escolha outra data.';
  if(!t)return 'Escolha o turno desejado.';
  if(!TURNOS[t]||!LOG.turnos[t])return 'Turno indisponível.';
  return '';
}
function validarEnd(a,pre){
  const e=[];a=a||{};pre=pre||'';
  if(digits(a.cep).length!==8)e.push(pre+'CEP inválido (8 números).');
  if(!UFS.includes(String(a.uf||'').toUpperCase()))e.push(pre+'Informe o estado (UF) válido.');
  if(!String(a.cidade||'').trim())e.push(pre+'Informe a cidade.');
  if(!String(a.bairro||'').trim())e.push(pre+'Informe o bairro.');
  if(!String(a.rua||'').trim())e.push(pre+'Informe a rua.');
  if(!String(a.num||'').trim())e.push(pre+'Informe o número do imóvel.');
  return e;
}

const cartSub=()=>cart.reduce((s,i)=>s+ipreco(i)*i.qty,0);
const user=()=>me&&users[me];
const myOrders=()=>orders.filter(o=>o.user===me);
const purchases=u=>orders.filter(o=>o.user===u&&COUNT.includes(o.status)).sort((a,b)=>a.conf-b.conf);
const pnum=o=>{const i=purchases(o.user).findIndex(x=>x.id===o.id);return i<0?null:i+1};
const before=o=>purchases(o.user).filter(x=>x.id!==o.id).length;
const subtotal=o=>o.items.reduce((s,i)=>s+i.unit*i.qty,0);
const total=o=>subtotal(o)-(o.disc?o.disc.valor:0);
const amOn=()=>AM.ativa&&hojeS()>=AM.inicio&&hojeS()<=AM.fim;
const ownerByCode=c=>Object.entries(users).find(([e,u])=>u.code===String(c||'').trim().toUpperCase());
const refOrders=owner=>orders.filter(o=>o.ref&&o.ref.owner===owner&&o.status!=='cancelado');
const refMonthCount=(owner,t)=>refOrders(owner).filter(o=>monthKey(o.at)===monthKey(t||now())).length;
function makeCode(nome){let c;do{c='ZP'+nome.normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()+String(Math.floor(1000+Math.random()*9000))}while(ownerByCode(c));return c}
function credits(owner){
  const conf=orders.filter(o=>o.ref&&o.ref.owner===owner&&COUNT.includes(o.status)).sort((a,b)=>a.conf-b.conf);
  const perMonth={},earned=[];
  conf.forEach(o=>{const k=monthKey(o.at);perMonth[k]=(perMonth[k]||0)+1;o._cred=perMonth[k]<=AM.limite?'ok':'limite';if(o._cred==='ok')earned.push({order:o.id,pct:(o.disc&&o.disc.pct)||AM.pct})});
  const used=orders.filter(o=>o.user===owner&&o.disc&&o.disc.tipo==='credito'&&o.status!=='cancelado').length;
  return {earned,used,avail:Math.max(0,earned.length-used),conf};
}
const sameAddr=(a,b)=>a&&b&&digits(a.cep)===digits(b.cep)&&String(a.num).trim()===String(b.num).trim();
function validateRefLocal(code){
  code=String(code||'').trim().toUpperCase();
  if(!code)return {err:'Informe o código de indicação.'};
  if(!amOn())return {err:'A campanha Amigo Emagrece Amigo não está ativa no momento.'};
  const o=ownerByCode(code);if(!o)return {err:'Código de indicação não encontrado.'};
  const [oe,ou]=o,u=user();
  if(oe===me)return {err:'Você não pode usar o seu próprio código.'};
  if(purchases(me).length||orders.some(x=>x.user===me&&x.ref&&x.status!=='cancelado'))return {err:'O desconto de indicação vale só na primeira compra de quem foi indicado.'};
  if(digits(u.fone)===digits(ou.fone)||sameAddr(u.end,ou.end))return {err:'Não foi possível aplicar: os dados parecem ser da mesma pessoa ou da mesma casa de quem indicou.'};
  if(refMonthCount(oe)>=AM.limite)return {err:'Este código atingiu o limite de indicações deste mês. Peça ao seu amigo para indicar no mês que vem.'};
  return {ok:true,owner:oe,pct:AM.pct};
}
let rv={code:'',use:false,msg:''};
function firstEligible(){
  const u=user();if(!u||!PC.ativa)return false;
  if(orders.some(o=>o.user===me&&o.status!=='cancelado'))return false;
  for(const [e,x] of Object.entries(users)){
    if(e===me)continue;
    if(!orders.some(o=>o.user===e&&o.status!=='cancelado'))continue;
    if(digits(x.fone)===digits(u.fone)||sameAddr(x.end,u.end))return false;
  }
  return true;
}
const dNome=d=>d.tipo==='primeira'?'primeira compra':d.tipo==='indicacao'?'indicação (código '+d.code+')':'indicação usado';
const dLabel=d=>d.tipo==='primeira'?'Desconto de primeira compra':d.tipo==='indicacao'?'Desconto de indicação':'Desconto de indicação usado';
const dTxt=d=>d.tipo==='primeira'?' (primeira compra, '+d.pct+'%)':d.tipo==='indicacao'?' (indicação, código '+d.code+', '+d.pct+'%)':' (desconto de indicação usado, '+d.pct+'%)';
function calcDisc(sub){
  if(!me)return null;const c=[];
  const mk=(tipo,pct,extra)=>Object.assign({tipo,pct,valor:+(sub*pct/100).toFixed(2)},extra||{});
  if(firstEligible())c.push(mk('primeira',PC.pct));
  if(amOn()){
    if(rv.code){const v=validateRef(rv.code);if(v.ok)c.push(mk('indicacao',v.pct,{code:rv.code.trim().toUpperCase(),owner:v.owner}))}
    if(rv.use){const k=credits(me);if(k.avail>0)c.push(mk('credito',k.earned[k.used].pct))}
  }
  if(!c.length)return null;
  const prio={indicacao:3,credito:2,primeira:1};
  c.sort((x,y)=>y.valor-x.valor||prio[y.tipo]-prio[x.tipo]);
  return c[0];
}
function friendRows(owner){
  Object.keys(users).forEach(credits);
  const por={};
  orders.filter(o=>o.ref&&o.ref.owner===owner).forEach(o=>{(por[o.user]=por[o.user]||[]).push(o)});
  return Object.entries(por).map(([e,os])=>{
    const u=users[e];let st='Pedido aguardando atendimento',cl='';
    const c=os.find(o=>COUNT.includes(o.status));
    if(c){st=c._cred==='limite'?'Comprou, acima do limite do mês':'Comprou, desconto gerado';cl='ok'}
    else if(os.every(o=>o.status==='cancelado'))st='Pedido cancelado';
    return {nome:u.nome+' '+(u.sobrenome||'').slice(0,1)+'.',st,cl}
  });
}

function addCart(id,qty=1,opt='',btn){
  const p=byId(id);if(p&&p.consulta){window.open(waProd(p),'_blank');return}const left=stockLeft(p);const ex=cart.find(i=>i.id===id&&i.opt===opt);const now_=ex?ex.qty:0;
  if(left<=0){toast('Produto sem estoque.');return}
  if(now_+qty>left){toast('Só há '+left+' unidade'+(left>1?'s':'')+' em estoque.');return}
  if(ex)ex.qty+=qty;else cart.push({id,qty,opt});
  save();updHead();bump();
  if(btn){const o=btn.textContent;btn.classList.add('ok');btn.textContent='Adicionado';setTimeout(()=>{btn.classList.remove('ok');btn.textContent=o},1400)}
  toast('Produto adicionado ao carrinho.',['Ver carrinho','openCart()']);
  openCart();
}

const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128B(text){
  const codes=[104];
  for(const ch of String(text)){const c=ch.charCodeAt(0)-32;if(c<0||c>95)throw new Error('caractere inválido para Code 128: '+ch);codes.push(c)}
  let sum=codes[0];for(let i=1;i<codes.length;i++)sum+=codes[i]*i;
  codes.push(sum%103);codes.push(106);
  const w=[];codes.forEach(c=>C128[c].split('').forEach(d=>w.push(+d)));
  return {widths:w,codes,modules:w.reduce((a,b)=>a+b,0)};
}

const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const HB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const K=72/25.4;
const CP={'–':0x96,'—':0x97,'“':0x93,'”':0x94,'‘':0x91,'’':0x92,'•':0x95,'…':0x85,'€':0x80};
function toCp(s){
  let o='';
  for(const ch of String(s)){
    const c=ch.codePointAt(0);
    if(c>=32&&c<=126)o+=ch;else if(c>=0xA0&&c<=0xFF)o+=ch;else if(CP[ch])o+=String.fromCharCode(CP[ch]);else o+='?';
  }
  return o;
}
const pdfEsc=s=>toCp(s).replace(/[\\()]/g,m=>'\\'+m);
function tw(s,size,bold){
  const t=bold?HB:HW;let w=0;
  for(const ch of String(s).normalize('NFD').replace(/[̀-ͯ]/g,'')){const c=ch.charCodeAt(0);w+=(c>=32&&c<=126?t[c-32]:556)}
  return w/1000*size/K;   // mm
}
function wrapTxt(s,size,bold,maxw){
  const out=[];
  String(s).split(/\n/).forEach(par=>{
    let line='';
    par.split(/\s+/).filter(Boolean).forEach(word=>{
      const test=line?line+' '+word:word;
      if(tw(test,size,bold)<=maxw)line=test;
      else{if(line)out.push(line);
        if(tw(word,size,bold)>maxw){let part='';for(const ch of word){if(tw(part+ch,size,bold)>maxw){out.push(part);part=ch}else part+=ch}line=part}else line=word}
    });
    out.push(line);
  });
  return out;
}
class Pg{
  constructor(w,h){this.w=w;this.h=h;this.ops=[];this.img=null}
  X(x){return (x*K).toFixed(2)}
  Y(y){return ((this.h-y)*K).toFixed(2)}
  text(x,y,s,size,bold,o){
    o=o||{};let xx=x;const wd=tw(s,size,bold);
    if(o.align==='right')xx=x-wd;else if(o.align==='center')xx=x-wd/2;
    if(o.gray!=null)this.ops.push(o.gray+' g');
    this.ops.push(`BT /F${bold?2:1} ${size} Tf ${this.X(xx)} ${this.Y(y)} Td (${pdfEsc(s)}) Tj ET`);
    if(o.gray!=null)this.ops.push('0 g');
    return wd;
  }
  para(x,y,s,size,bold,maxw,maxLines,lh){
    const L=wrapTxt(s,size,bold,maxw);const lin=maxLines?L.slice(0,maxLines):L;
    if(maxLines&&L.length>maxLines){lin[lin.length-1]=lin[lin.length-1].replace(/\s*\S*$/,'')+'…'}
    lh=lh||size*0.42;lin.forEach((l,i)=>this.text(x,y+i*lh,l,size,bold));
    return y+lin.length*lh;
  }
  rect(x,y,w,h,mode,lw,gray){
    if(gray!=null)this.ops.push(gray+' g');
    if(mode==='S'||mode==='B')this.ops.push((lw||0.3)*K+' w');
    this.ops.push(`${this.X(x)} ${this.Y(y+h)} ${(w*K).toFixed(2)} ${(h*K).toFixed(2)} re ${mode||'f'}`);
    if(gray!=null)this.ops.push('0 g');
  }
  line(x1,y1,x2,y2,lw,dash){
    this.ops.push(`${(lw||0.3)*K} w`+(dash?' [2 2] 0 d':'')+` ${this.X(x1)} ${this.Y(y1)} m ${this.X(x2)} ${this.Y(y2)} l S`+(dash?' [] 0 d':''));
  }
  bars(x,y,h,widths,mod){
    let cx=x;widths.forEach((wd,i)=>{if(i%2===0)this.ops.push(`${this.X(cx)} ${this.Y(y+h)} ${(wd*mod*K).toFixed(3)} ${(h*K).toFixed(2)} re f`);cx+=wd*mod});
    return cx-x;
  }
  image(x,y,w,h){this.ops.push(`q ${(w*K).toFixed(2)} 0 0 ${(h*K).toFixed(2)} ${this.X(x)} ${this.Y(y+h)} cm /Im1 Do Q`);this.img=true}
}
const strBytes=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u};
function b64ToBytes(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function bytesToB64(u){let s='';const ch=0x8000;for(let i=0;i<u.length;i+=ch)s+=String.fromCharCode.apply(null,u.subarray(i,i+ch));return btoa(s)}
function pdfBuild(pages,logo,info){
  const parts=[];let off=0;const xr=[];
  const push=s=>{const u=typeof s==='string'?strBytes(s):s;parts.push(u);off+=u.length};
  const obj=(n,body)=>{xr[n]=off;push(n+' 0 obj\n'+body+'\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const hasImg=!!logo&&pages.some(p=>p.img);
  const first=hasImg?6:5;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(first+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  if(hasImg){
    xr[5]=off;push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+logo.w+' /Height '+logo.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+logo.bytes.length+' >>\nstream\n');
    push(logo.bytes);push('\nendstream\nendobj\n');
  }
  pages.forEach((p,i)=>{
    const pid=first+i*2,cid=pid+1;
    const content=p.ops.join('\n');
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+(p.w*K).toFixed(2)+' '+(p.h*K).toFixed(2)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+(hasImg?' /XObject << /Im1 5 0 R >>':'')+' >> /Contents '+cid+' 0 R >>');
    xr[cid]=off;push(cid+' 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
  });
  const infoId=first+pages.length*2;
  obj(infoId,'<< /Title ('+pdfEsc(info&&info.title||'Etiquetas')+') /Producer (ZP Imports) /Creator (ZP Imports) >>');
  const n=infoId+1;const xo=off;
  let x='xref\n0 '+n+'\n0000000000 65535 f \n';
  for(let i=1;i<n;i++)x+=String(xr[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+n+' /Root 1 0 R /Info '+infoId+' 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  const out=new Uint8Array(off);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}

/* ---------- logomarca: aceita PNG/JPG/WebP e converte para JPEG ---------- */
function logoLoad(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const max=600,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      res({data:c.toDataURL('image/jpeg',0.92),w:c.width,h:c.height})};im.onerror=()=>rej(new Error('Imagem inválida'));im.src=fr.result};
    fr.onerror=()=>rej(new Error('Falha ao ler o arquivo'));fr.readAsDataURL(file);
  });
}

function gerarPdfBytes(S,cfg,logo,tipo){

function cfgSnap(){return {w:LBL.w,h:LBL.h,m:LBL.m,fs:LBL.fs,barcodePos:LBL.barcodePos,logoH:LBL.logoH,remetente:LBL.remetente,remEnd:LBL.remEnd,logoKey:LBL.logoKey}}

/* ---------- versões, histórico e atualização ---------- */
const ultimaVersao=o=>(o.etiquetas||[]).slice(-1)[0]||null;
function etqStale(o){const u=ultimaVersao(o);if(!u)return true;return u.hash!==snapHash(snapOrder(o),cfgSnap())}
function etqDiff(o){
  const u=ultimaVersao(o);if(!u)return 'Primeira geração';
  const a=u.snap,b=snapOrder(o);const ch=[];
  const cmp=(n,x,y)=>{if(JSON.stringify(x)!==JSON.stringify(y))ch.push(n)};
  cmp('endereço',a.dest,b.dest);cmp('telefone',a.fone,b.fone);cmp('data',a.data,b.data);cmp('turno',a.turno,b.turno);cmp('janela',a.janela,b.janela);
  cmp('produtos ou quantidades',a.itens,b.itens);cmp('observações',[a.obs,a.obsEntregador,a.obsInt,a.obsSep],[b.obs,b.obsEntregador,b.obsInt,b.obsSep]);cmp('pagamento',a.pag,b.pag);cmp('nome',a.nome,b.nome);
  const cu=u.cfgHash!==hashStr(JSON.stringify(cfgSnap()));if(cu)ch.push('configuração da etiqueta');
  return ch.length?'Alteração em: '+ch.join(', '):'Sem alterações';
}
function gerarEtiquetas(o,motivo,force){
  const S=snapOrder(o),cfg=cfgSnap();const hash=snapHash(S,cfg);const u=ultimaVersao(o);
  if(u&&u.hash===hash&&!force)return u;     // evita arquivo duplicado para o mesmo pedido e versão
  const logo=currentLogo();
  const bytes=gerarPdfBytes(S,cfg,logo,'ambas');
  const v=(u?u.v:0)+1;
  (o.etiquetas||[]).forEach(x=>{if(x.status==='atual')x.status='substituida'});
  o.etiquetas=o.etiquetas||[];
  const rec={v,t:now(),por:actor(),motivo:motivo||etqDiff(o),hash,cfgHash:hashStr(JSON.stringify(cfg)),snap:S,cfg,status:'atual',tam:bytes.length,arquivo:'etiquetas-'+S.codigo+'-v'+v+'.pdf'};
  DB.set('pdf_'+o.id+'_'+v,bytesToB64(bytes));
  if(LBL.logo&&LBL.logoKey)DB.set('logo_'+LBL.logoKey,LBL.logo);
  o.etiquetas.push(rec);
  addEv(o,{tipo:'etiqueta',publico:false,texto:'Etiquetas geradas (versão '+v+')',motivo:rec.motivo,para:'v'+v});
  save();return rec;
}
function pdfDaVersao(o,v,tipo){
  const rec=(o.etiquetas||[]).find(x=>x.v===v);if(!rec)return null;
  if(tipo==='ambas'){const b=DB.get('pdf_'+o.id+'_'+v,null);if(b)return b64ToBytes(b)}
  const lg=rec.cfg.logoKey?DB.get('logo_'+rec.cfg.logoKey,null):null;
  return gerarPdfBytes(rec.snap,rec.cfg,lg?{w:lg.w,h:lg.h,bytes:b64ToBytes(lg.data.split(',')[1])}:null,tipo);
}
function blobUrl(bytes){return URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}))}
function logEtq(o,rec,acao,tipo){addEv(o,{tipo:'etiqueta',publico:false,texto:acao+' ('+(tipo==='externa'?'etiqueta externa':tipo==='interna'?'etiqueta interna':'as duas etiquetas')+', versão '+rec.v+')',para:'v'+rec.v});save()}
function etqObter(oid,v,acao){
  const o=orders.find(x=>x.id===oid);if(!o)return null;
  let rec=(o.etiquetas||[]).find(x=>x.v===v)||ultimaVersao(o);
  if(!rec){rec=gerarEtiquetas(o,'Geração a partir de pedido existente')}
  const desat=etqStale(o)||rec.status==='substituida';
  if(desat){
    if(confirm('A etiqueta (versão '+rec.v+') está desatualizada em relação ao pedido.\n\nOK: gerar uma etiqueta atualizada agora e usá-la.\nCancelar: continuar com a versão desatualizada.')){rec=gerarEtiquetas(o,etqDiff(o),true)}

}

function chartBars(labels,vals,cor){
  const W=560,H=190,pb=28,pt=14,pl=26,mx=Math.max(1,...vals);const bw=(W-pl-8)/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico de barras">`;
  [0,0.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e6e6e6"/><text x="${pl-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#888">${Math.round(mx*f)}</text>`});
  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/mx;const x=pl+i*bw+bw*0.15;s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*0.7}" height="${h}" rx="3" fill="${cor}"><title>${labels[i]}: ${v}</title></rect>${v?`<text x="${x+bw*0.35}" y="${H-pb-h-3}" font-size="9" text-anchor="middle" fill="#555">${v}</text>`:''}<text x="${x+bw*0.35}" y="${H-10}" font-size="9" text-anchor="middle" fill="#777">${labels[i]}</text>`});
  return s+'</svg>';
}
function chartLine(labels,vals,cor){
  const W=560,H=190,pb=28,pt=14,pl=26,mx=Math.max(1,...vals);const step=(W-pl-14)/Math.max(1,vals.length-1);
  const pts=vals.map((v,i)=>[pl+i*step,H-pb-(H-pt-pb)*v/mx]);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico de linha">`;
  [0,0.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e6e6e6"/><text x="${pl-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#888">${Math.round(mx*f)}</text>`});
  s+=`<polyline fill="none" stroke="${cor}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${cor}"><title>${labels[i]}: ${vals[i]}</title></circle><text x="${p[0]}" y="${H-10}" font-size="9" text-anchor="middle" fill="#777">${labels[i]}</text>`});
  return s+'</svg>';
}

function timelineCliente(o){
  const ev=(o.eventos||[]).filter(e=>e.publico);
  const at=atraso(o);const bad=o.status==='cancelado';
  const first=s=>(ev.find(e=>e.tipo==='status'&&e.para===s)||{}).t;
  const last=s=>ev.filter(e=>e.tipo==='status'&&e.para===s).slice(-1)[0];
  const rea=reagendados(o);
  const cur=bad?-1:faseDe(o.status);
  const reached=i=>bad?FASES[i].s.some(s=>first(s)):i<=cur;
  const total6=FASES.length;const nDone=FASES.filter((f,i)=>reached(i)).length;const pct=Math.round(nDone/total6*100);
  let h='';
  if(bad)h+='<div class="note err">Pedido cancelado. Em caso de dúvida, fale com a nossa equipe pelo WhatsApp de atendimento.</div>';
  else{
    const px=PROX[o.status];
    h+=`<div class="rprog"><div class="rprog-t"><b>${o.status==='entregue'?'Pedido entregue':'Fase '+Math.max(1,nDone)+' de '+total6}</b><span>${pct}% concluído</span></div><div class="rprog-b"><i style="width:${pct}%"></i></div>${o.status!=='entregue'?`<div class="rprog-n"><div><small>Agora</small><b>${LAB[o.status]||''}</b></div><div><small>Próximo passo</small><b>${px?esc(LAB[px]):''}</b></div><div><small>Última atualização</small><b>${fmtD(ultimoMov(o))}</b></div></div>`:''}</div>`;
  }
  if(o.track&&(o.track.code||o.track.link))h+=`<div class="trk trk-top"><span>Rastreio: ${esc(o.track.carrier)}</span>${o.track.code?`<code>${esc(o.track.code)}</code>`:''}${o.track.link?`<a href="${esc(o.track.link)}" target="_blank" rel="noopener">Rastrear na transportadora</a>`:''}</div>`;
  if(o.status==='tentativa')h+='<div class="note warn"><b>Tentativa de entrega não concluída.</b> Entraremos em contato para reprogramar.</div>';
  if(rea&&!FINAL.includes(o.status))h+='<div class="note warn"><b>Pedido reagendado.</b> Veja a nova previsão no histórico abaixo.</div>';
  if(at&&at.janela&&!bad)h+='<div class="note warn"><b>Pedido com atraso.</b> A previsão de entrega foi ultrapassada. Estamos tratando e você será avisado por aqui.</div>';
  h+='<ol class="tl">'+FASES.map((f,i)=>{
    const done=reached(i);const isCur=!bad&&i===cur;const isNext=!bad&&i===cur+1;const cls=done?'done':isNext?'cur':'todo';
    const sub=f.s.filter(s=>first(s));
    const unico=f.s.length===1;
    const t=unico?first(f.s[0]):(sub.length?first(sub[0]):0);
    const ult=sub.length?last(sub[sub.length-1]):null;
    const texto=done?(unico&&ult&&ult.texto?ult.texto:(unico?pubTxt(o,f.s[0],''):'')):f.d;
    const subHtml=(!unico&&sub.length)?`<ul class="subtl">${sub.map(s=>`<li><span>${LAB[s]}</span><small>${fmtD(first(s))}</small></li>`).join('')}</ul>`:'';
    return `<li class="${cls}"><span class="d">${done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="m5 12 5 5 9-10"/></svg>':''}</span><strong>${f.n}${isCur?' <em class="agora">etapa atual</em>':''}${isNext?' <em class="agora prox">próxima etapa</em>':''}</strong>${done&&unico&&t?`<small>${fmtD(t)}</small>`:''}${(unico||!done)&&texto?`<small>${esc(texto)}</small>`:''}${subHtml}${f.s[0]==='em-rota'&&done&&o.track&&(o.track.code||o.track.link)?`<div class="trk"><span>${esc(o.track.carrier)}</span>${o.track.code?`<code>${esc(o.track.code)}</code>`:''}${o.track.link?`<a href="${esc(o.track.link)}" target="_blank" rel="noopener">Rastrear na transportadora</a>`:''}</div>`:''}</li>`}).join('')+'</ol>';
  h+=rotaCliente(o);
  const hist=ev.slice().reverse();
  h+=`<details class="hist-c" ${rea||o.status==='tentativa'||bad?'open':''}><summary>Histórico de atualizações (${hist.length})</summary><ul class="evl">${hist.map(e=>`<li class="${e.tipo==='reagendado'?'rea':e.tipo==='atraso'||(e.para==='tentativa')?'warn':''}"><small>${fmtD(e.t)}</small><div>${e.tipo==='reagendado'?'<b>Entrega reagendada.</b> ':''}${esc(e.texto)}</div></li>`).join('')}</ul></details>`;
  return h;
}

/* ======================= PROGRESSÃO DO PEDIDO: BIPAR E AVANÇAR ETAPA =======================
   Cada etapa tem um responsável. O botão só oferece a próxima etapa, sem pular. Voltar ou pular é só do administrador. */
const FLUXO=['pago','confirmado','preparacao','separacao','aguardando-programacao','programada','em-rota','entregue'];
/* Cada gesto (bip ou clique) leva o pedido ao destino 'to' e ativa, na ordem, as etapas intermediárias 'via'. */
const GESTO={
 preparacao:{acao:'Iniciar preparação',via:{pago:['confirmado'],realizado:['confirmado']},resp:['separador','logistica'],txt:'Ativa Pedido confirmado e Em preparação'},
 'aguardando-programacao':{acao:'Separado: deixar para a logística',via:{preparacao:['separacao']},resp:['separador','logistica'],txt:'Ativa Em separação e Aguardando programação de entrega'},
 programada:{acao:'Programar entrega',via:{},resp:['logistica'],txt:'Ativa Entrega programada'},
 'em-rota':{acao:'Saiu para entrega',via:{},resp:['logistica'],txt:'Ativa Saiu para entrega e prepara a mensagem com o link de pagamento'},
 entregue:{acao:'Marcar como entregue',via:{},resp:['logistica'],txt:'Ativa Entregue'}
};
const ACAO=Object.fromEntries(Object.entries(GESTO).map(([k,g])=>[k,g.acao]));
const RESP=Object.fromEntries(Object.entries(GESTO).map(([k,g])=>[k,g.resp]));
const PAPEL_NOME={admin:'Administração',logistica:'Logística',separador:'Separação'};
const respNome=s=>(RESP[s]||[]).map(p=>PAPEL_NOME[p]).join(' ou ');
const PROX={realizado:'preparacao',pago:'preparacao',confirmado:'preparacao',preparacao:'aguardando-programacao',separacao:'aguardando-programacao','aguardando-programacao':'programada',programada:'em-rota','em-rota':'entregue',tentativa:'programada'};
function proximoStatus(o){
  if(!ativo(o)||o.status==='entregue')return null;
  return PROX[o.status]||null;
}
const podeAvancar=s=>!!ADMIN&&!!RESP[s]&&(ADMIN.papel==='admin'||RESP[s].includes(ADMIN.papel));
function avancarPedido(id){
  const o=orders.find(x=>x.id===id);if(!o||!ADMIN)return false;
  const s=proximoStatus(o);
  if(!s){toast('Este pedido não tem próxima etapa.');return false}
  if(!podeAvancar(s)){toast('Esta etapa é da '+respNome(s)+'.');return false}
  if(['programada','em-rota'].includes(s)&&(!o.entrega.data||!o.entrega.turno)){toast('Defina data e turno antes.');return false}
  const via=(GESTO[s].via[o.status]||[]);
  via.forEach(v=>{setStatus(o,v,{})});
  setStatus(o,s,{});
  A.bp=A.bp||{q:'',oid:null,hist:[],erro:''};
  A.bp.hist.unshift({t:now(),cod:codigoPedido(o),acao:ACAO[s],ativou:via.concat([s]).map(x=>LAB[x]).join(' + '),por:ADMIN.nome});A.bp.hist=A.bp.hist.slice(0,8);
  toast(codigoPedido(o)+': '+via.concat([s]).map(x=>LAB[x]).join(' e ')+'. O cliente já vê.'+(s==='em-rota'?' A mensagem com o link de pagamento está pronta no pedido.':''));
  return true;
}
function admAvancar(id){if(avancarPedido(id))route()}
function admTentativa(id){
  const o=orders.find(x=>x.id===id);const mot=v_('tntM').trim();
  if(!o||!ADMIN||ADMIN.papel==='separador')return;
  if(o.status!=='em-rota'){toast('A tentativa só pode ser registrada em um pedido que saiu para entrega.');return}
  if(!mot){toast('Informe o motivo da tentativa sem sucesso.');return}
  setStatus(o,'tentativa',{motivo:mot});toast('Tentativa registrada. O cliente foi avisado.');route();
}
function avancarHtml(o){
  if(o.status==='cancelado')return '<div class="note err">Pedido cancelado.</div>';
  const s=proximoStatus(o);
  if(!s)return `<div class="note">Pedido ${LAB[o.status].toLowerCase()}. Não há próxima etapa.</div>`;
  const ok=podeAvancar(s);
  let h=`<div class="avanca"><div><small>Etapa atual</small><b>${LAB[o.status]}</b></div><div class="seta">&rarr;</div><div><small>Próxima etapa</small><b>${(GESTO[s].via[o.status]||[]).concat([s]).map(x=>LAB[x]).join(' + ')}</b></div>${ok?`<button class="btn acc" onclick="admAvancar(${o.id})">${ACAO[s]}</button>`:`<span class="note" style="margin:0">Etapa da ${respNome(s)}</span>`}</div>${ok?`<div class="bipsub" style="text-align:left">${GESTO[s].txt}.</div>`:''}`;
  if(o.status==='em-rota'&&ADMIN&&ADMIN.papel!=='separador')h+=`<div class="fr" style="margin-top:10px"><div class="c4"><label for="tntM">Entrega não concluída? Informe o motivo</label><input id="tntM" placeholder="Ex.: cliente ausente"></div><div class="c2" style="align-self:end"><button class="btn ghost sm" onclick="admTentativa(${o.id})">Registrar tentativa sem sucesso</button></div></div>`;
  return h;
}

/* ---------- tela de separação: bipar a etiqueta ---------- */
function bipBuscar(){
  A.bp=A.bp||{q:'',oid:null,hist:[],erro:''};const B=A.bp;
  const q=v_('bpq').trim();B.q=q;B.erro='';B.oid=null;
  if(!q){route();return}
  let o=pedidoPorCodigo(q);

/* ---------- padronização de endereço ---------- */
const ART=new Set(['de','da','do','das','dos','e','a','o']);
const ROMANO=/^(i{1,3}|iv|v|vi{0,3}|ix|x)$/;
const tc=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase().split(' ').map((w,i)=>ROMANO.test(w)?w.toUpperCase():(i>0&&ART.has(w))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const normEnd=a=>Object.assign({},a,{rua:tc(a.rua),bairro:tc(a.bairro),cidade:tc(a.cidade),uf:String(a.uf||'').toUpperCase()});
const fmtCep=v=>{const d=digits(v).slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d};
async function cepConsulta(d){
  try{const r=await fetch('https://viacep.com.br/ws/'+d+'/json/');if(!r.ok)throw new Error('http');const j=await r.json();if(j.erro)return {erro:'nf'};return {uf:j.uf,cidade:j.localidade,bairro:j.bairro,rua:j.logradouro}}catch(e){return {erro:'net'}}
}
/* map: ids dos campos. Cidade e UF ficam travadas depois de uma busca bem sucedida, para manter o padrão. */
async function cepAuto(el,map){
  el.value=fmtCep(el.value);const d=digits(el.value);
  const lock=(on)=>{const c=document.getElementById(map.cidade),u=document.getElementById(map.uf);if(c)c.readOnly=on;if(u){u.style.pointerEvents=on?'none':'';u.style.background=on?'#eee':''}};
  if(d.length!==8){lock(false);return}
  const r=await cepConsulta(d);if(digits(el.value)!==d)return;
  if(r.erro==='nf'){lock(false);toast('CEP não encontrado. Confira os números ou preencha o endereço.');return}
  if(r.erro){lock(false);toast('Não foi possível buscar o CEP agora. Preencha o endereço manualmente.');return}
  const set=(k,v)=>{const e=document.getElementById(map[k]);if(e&&v)e.value=v};
  set('uf',r.uf);set('cidade',r.cidade);set('bairro',r.bairro);set('rua',r.rua);lock(true);
  toast('Endereço preenchido pelo CEP. Falta só o número.');
  const n=document.getElementById(map.num);if(n)n.focus();
}
async function entCep(el){
  el.value=fmtCep(el.value);ent.s.cep=el.value;const d=digits(el.value);
  if(d.length!==8){ent.slock=false;return}
  const r=await cepConsulta(d);if(digits(el.value)!==d)return;
  if(r.erro==='nf'){ent.slock=false;toast('CEP não encontrado. Confira os números ou preencha o endereço.');return}
  if(r.erro){ent.slock=false;toast('Não foi possível buscar o CEP agora. Preencha o endereço manualmente.');return}
  Object.assign(ent.s,{uf:r.uf,cidade:r.cidade,bairro:r.bairro,rua:r.rua});ent.slock=true;route();
  setTimeout(()=>{const n=document.getElementById('sNum');if(n)n.focus()},60);
}

/* ---------- semáforo do pedido em aberto ---------- */
function nivelPedido(o){
  if(!ativo(o))return {n:-1,cor:'c',rot:'Cancelado',min:0,rest:Infinity,par:0};
  const H=36e5,par=(now()-ultimoMov(o))/H,fim=fimJanela(o),rest=fim?(fim-now())/H:Infinity;
  const venc=!!fim&&rest<0;
  let n=0;
  if(venc||par>LOG.atrasoHoras)n=3;else if(rest<6||par>LOG.alertaLaranja)n=2;else if(rest<24||par>LOG.alertaAmarelo)n=1;
  const min=Math.max(venc?-rest*60:0,par>LOG.atrasoHoras?(par-LOG.atrasoHoras)*60:0);
  return {n,cor:['v','a','l','r'][n],rot:['No prazo','Atenção','Quase atrasado','Atrasado'][n],min,rest,par,venc,forte:n===3&&(par>LOG.atrasoHoras*2||(venc&&rest<-24))};
}
const semDot=o=>{const s=nivelPedido(o);return `<span class="sem ${s.cor}${s.forte?' forte':''}" title="${s.rot}" role="img" aria-label="${s.rot}"></span>`};
function cmpUrgencia(a,b){
  const na=nivelPedido(a),nb=nivelPedido(b);
  if(nb.n!==na.n)return nb.n-na.n;
  if(na.n===3&&nb.min!==na.min)return nb.min-na.min;
  if(na.n>=0&&na.rest!==nb.rest&&isFinite(na.rest)&&isFinite(nb.rest))return na.rest-nb.rest;
  return a.at-b.at;
}
function tempoTxt(o){
  const s=nivelPedido(o);const p=[`aberto há ${dur((now()-o.at)/60000)}`];
  if(s.n===3){p.push(s.venc?`prazo vencido há ${dur(-s.rest*60)}`:`parado há ${dur(s.par*60)}`)}
  return p.join(' · ');
}

/* ---------- filtros por região (cidade e turno) ---------- */
const cidKey=o=>norm(o.entrega.dest.cidade)+'/'+String(o.entrega.dest.uf).toUpperCase();
const regiaoMatch=F=>o=>(!F.cid||cidKey(o)===F.cid)&&(!F.tur||o.entrega.turno===F.tur);
function fltSet(w,k,v,k2,v2){const F=w==='ab'?A.ab:A.fo;F[k]=k==='cid'?decodeURIComponent(v):v;if(k2)F[k2]=v2;route()}
function painelRegiao(base,F,w){
  const C={};const tT={manha:0,tarde:0,noite:0};
  base.forEach(o=>{const k=cidKey(o);const c=C[k]=C[k]||{n:0,nome:o.entrega.dest.cidade+'/'+String(o.entrega.dest.uf).toUpperCase(),t:{manha:0,tarde:0,noite:0}};c.n++;if(c.t[o.entrega.turno]!=null)c.t[o.entrega.turno]++;if(tT[o.entrega.turno]!=null)tT[o.entrega.turno]++});
  const chip=(ck,t,n,lab)=>`<a class="rgt ${F.cid===ck&&F.tur===t?'on':''}" onclick="fltSet('${w}','cid','${enc(ck)}','tur','${t}')">${lab} <b>${n}</b></a>`;
  const linhas=Object.keys(C).sort((a,b)=>C[b].n-C[a].n).map(ck=>{const c=C[ck];return `<div class="rgl ${F.cid===ck?'on':''}"><a class="rgn" onclick="fltSet('${w}','cid','${enc(ck)}','tur','')">${esc(c.nome)} <span class="cn">${c.n}</span></a><span>${chip(ck,'manha',c.t.manha,'Manhã')}${chip(ck,'tarde',c.t.tarde,'Tarde')}${chip(ck,'noite',c.t.noite,'Noite')}</span></div>`}).join('');
  return `<div class="box"><h3 style="margin-top:0">Por região</h3><div class="rgl ${!F.cid?'on':''}"><a class="rgn" onclick="fltSet('${w}','cid','','tur','')">Todas as cidades <span class="cn">${base.length}</span></a><span>${['manha','tarde','noite'].map(t=>`<a class="rgt ${!F.cid&&F.tur===t?'on':''}" onclick="fltSet('${w}','cid','','tur','${t}')">${TURNOS[t]} <b>${tT[t]}</b></a>`).join('')}</span></div>${linhas||'<p style="color:var(--muted);margin:6px 0 0">Nenhum pedido.</p>'}</div>`;
}

/* ---------- aba Em aberto ---------- */
function tabAberto(){
  A.ab=Object.assign({cid:'',tur:'',sem:'',pag:'todos'},A.ab);const F=A.ab;

  list.sort(cmpUrgencia);

   <div class="semleg">${leg.map(l=>`<a class="${F.sem===l[0]?'on':''}" onclick="A.ab.sem=A.ab.sem==='${l[0]}'?'':'${l[0]}';route()" title="${l[2]}"><span class="sem ${l[0]}"></span> ${l[1]} <b>${cont[l[0]]}</b></a>`).join('')}</div><p style="margin:6px 0 0;font-size:.8rem;color:var(--muted)">Do mais atrasado para o mais recente. Clique numa cor para filtrar. Os limites de horas ficam em Regras de entrega.</p></div>

}

/* ---------- alterações do pedido: o cliente é avisado e a loja já fica com a mensagem pronta ---------- */

/* ---------- rota prevista para o cliente, a partir da preparação ---------- */
function rotaCliente(o){
  if(!['preparacao','separacao','aguardando-programacao','programada','em-rota','tentativa'].includes(o.status))return '';
  const r=ROTAS[rotaKey(o)];const e=o.entrega;const rota=o.status==='em-rota';
  if(!(r&&r.lista&&r.lista.length))return rota?'<div class="rota"><b>Saiu para entrega</b><div>Previsão: <b>'+fmtDay(e.data)+', '+turnoNome(e.turno)+'</b></div><div style="margin-top:6px;color:var(--muted);font-size:.85rem">A sequência da rota ainda não foi divulgada.</div></div>':'';
  const meu=norm(e.dest.bairro);const i=r.lista.findIndex(l=>norm(l)===meu);
  const hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
  let est='';
  if(r.saida&&/^\d{2}:\d{2}$/.test(r.saida)&&i>=0){const [h,mi]=r.saida.split(':').map(Number);est=`<div style="margin-top:8px">Chegada aproximada na sua região: <b>por volta das ${hhmm(h*60+mi+(i+1)*(r.min||20))}</b></div><div style="font-size:.8rem;color:var(--muted)">Horário estimado, não garantido. A entrega pode chegar mais cedo ou mais tarde.</div>`}
  return `<div class="rota"><b>${rota?'Saiu para entrega':'Rota prevista da sua região'}</b><div>Previsão: <b>${fmtDay(e.data)}, ${turnoNome(e.turno)}</b></div><div style="margin-top:6px;color:var(--muted);font-size:.85rem">Sequência planejada (aproximada):</div><ol class="rota-l">${r.lista.map((l,k)=>`<li class="${rota&&k<=r.atual?'ok':''} ${norm(l)===meu?'meu':''}">${esc(l)}${norm(l)===meu?' <small>(sua região)</small>':''}${rota&&k===r.atual?' <small>andamento atual</small>':''}</li>`).join('')}</ol>${est}<div class="rota-aviso">Rota planejada pela loja. Não é a localização em tempo real do entregador.</div></div>`;
}

/* ---------- telefone: (XX) 9 XXXX-XXXX, ou (XX) XXXX-XXXX para quem não tem o 9 ---------- */
const DDDS=new Set('11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' '));
function fmtFone(d,sem9){
  d=String(d||'');if(!d)return '';if(d.length<=2)return '('+d;
  const ddd=d.slice(0,2),r=d.slice(2);
  if(sem9)return '('+ddd+') '+r.slice(0,4)+(r.length>4?'-'+r.slice(4):'');
  return '('+ddd+') '+r[0]+(r.length>1?' '+r.slice(1,5):'')+(r.length>5?'-'+r.slice(5):'');
}
function foneMask(el,sem9){
  let d=digits(el.value);
  if(!sem9&&d.length>=3&&d[2]!=='9')d=d.slice(0,2)+'9'+d.slice(2);
  d=d.slice(0,sem9?10:11);el.value=fmtFone(d,sem9);
}
function foneToggle9(idCampo,sem9){
  const el=document.getElementById(idCampo);if(!el)return;let d=digits(el.value);
  if(sem9){if(d.length>2&&d[2]==='9')d=d.slice(0,2)+d.slice(3)}else if(d.length>2&&d[2]!=='9')d=d.slice(0,2)+'9'+d.slice(2);
  d=d.slice(0,sem9?10:11);el.value=fmtFone(d,sem9);el.placeholder=sem9?'(12) 8888-7777':'(12) 9 8888-7777';el.focus();
}
/* devolve '' se válido, ou a mensagem de erro */
function foneErro(v,sem9){
  const d=digits(v);
  if(d.length!==(sem9?10:11))return 'Informe o telefone completo, com DDD'+(sem9?'':' e o 9 na frente')+'.';
  if(!DDDS.has(d.slice(0,2)))return 'O DDD informado não existe. Confira o telefone.';
  if(!sem9&&d[2]!=='9')return 'O celular precisa ter o 9 depois do DDD.';
  const rest=d.slice(sem9?2:3);
  if(/^(\d)\1+$/.test(rest))return 'Esse telefone não parece válido. Confira os números.';
  if(sem9&&!/[2-9]/.test(rest[0]))return 'Esse telefone não parece válido. Confira os números.';
  return '';
}
const foneOk=v=>{const d=digits(v);return (d.length===10||d.length===11)&&DDDS.has(d.slice(0,2))};
function foneCampo(id,valor,sem9){
  return `<input id="${id}" type="tel" required inputmode="numeric" autocomplete="tel-national" placeholder="${sem9?'(12) 8888-7777':'(12) 9 8888-7777'}" value="${esc(valor||'')}" oninput="foneMask(this,document.getElementById('${id}n9').checked)"><label style="font-weight:500;font-size:.88rem;margin-top:6px"><input type="checkbox" id="${id}n9" style="width:auto" ${sem9?'checked':''} onchange="foneToggle9('${id}',this.checked)"> Meu número não tem o 9 na frente</label>`;
}

/* ---------- visão geral: painel executivo ---------- */
function chartBars2(labels,vals,vals2,c1,c2){
  const W=560,H=190,pb=28,pt=14,pl=26,mx=Math.max(1,...vals);const bw=(W-pl-8)/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico de barras: total de pedidos e pagos">`;
  [0,0.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e6e6e6"/><text x="${pl-4}" y="${y+3}" font-size="9" text-anchor="end" fill="#888">${Math.round(mx*f)}</text>`});
  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/mx,h2=(H-pt-pb)*vals2[i]/mx;const x=pl+i*bw+bw*0.15;s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*0.7}" height="${h}" rx="3" fill="${c1}"><title>${labels[i]}: ${v} pedidos, ${vals2[i]} pagos</title></rect><rect x="${x+bw*0.12}" y="${H-pb-h2}" width="${bw*0.46}" height="${h2}" rx="2" fill="${c2}"/>${v?`<text x="${x+bw*0.35}" y="${H-pb-h-3}" font-size="9" text-anchor="middle" fill="#555">${v}</text>`:''}<text x="${x+bw*0.35}" y="${H-10}" font-size="9" text-anchor="middle" fill="#777">${labels[i]}</text>`});
  return s+'</svg>';
}

/* ======================= PAGAMENTO POR LINK, NA ROTA =======================
   O valor é combinado antes (com a taxa de entrega). O cliente paga por um link, enviado quando o pedido entra em rota.
   Nada de gateway: a loja registra o recebimento. */
const PAGST={pendente:['Pagar por link na rota','amarelo'],link:['Link enviado','amarelo'],pago:['Pagamento recebido','verde']};
const pago=o=>!!(o&&o.pagamento&&o.pagamento.status==='pago');
const ativo=o=>!!o&&o.status!=='cancelado';
const FORMAS={credito:'Cartão de crédito',debito:'Cartão de débito',pix:'Pix',outro:'Outro'};
const taxaEnt=o=>+((o.pagamento||{}).taxaEntrega)||0;
const valorAcordado=o=>+(total(o)+taxaEnt(o)).toFixed(2);
function pagLabel(p){return p&&p.forma?FORMAS[p.forma]+(p.forma==='credito'&&p.parcelas>1?' em '+p.parcelas+'x':''):'Link de pagamento'}
function pagTxt(o){const p=o.pagamento||{};return {metodo:pagLabel(p),status:(PAGST[p.status]||['Não definido'])[0]}}
function pagChip(o){const p=o.pagamento;if(!p)return '';const s=PAGST[p.status]||['',''];return `<span class="st pg-${s[1]}">${s[0]}</span>`}
function tokenNovo(){return Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8)}
function migPag(o){
  let ch=false;const p=o.pagamento;
  if(!o.token){o.token=tokenNovo();ch=true}
  if(p&&p.modo==='link')return ch;
  const ap=p&&(p.status==='aprovado'||p.status==='Confirmado');
  const forma={pix:'pix',credito:'credito',debito:'debito'}[p&&p.metodo]||'outro';
  o.pagamento={modo:'link',status:ap?'pago':'pendente',taxaEntrega:0};
  if(ap){const bruto=o.items.reduce((s,i)=>s+i.unit*i.qty,0)-(o.disc?o.disc.valor:0);Object.assign(o.pagamento,{forma,parcelas:(p&&p.parcelas)||1,bruto,taxaPct:0,taxaValor:0,liquido:bruto,pagoEm:(p&&p.aprovadoEm)||o.at,prevRepasse:null,repassado:false})}
  return true;
}
const urlAcompanhar=o=>location.href.split('#')[0]+'#/acompanhar/'+codigoPedido(o)+'/'+(o.token||'');
function msgLinkCliente(o){
  const prim=String(o.entrega.nome||'').split(' ')[0];const taxa=taxaEnt(o);

}

/* ---------- o que o cliente vê sobre o pagamento ---------- */
function payCliente(o){
  const p=o.pagamento||{};const v=valorAcordado(o);const link=o._link||CFG.linkPag;const taxa=taxaEnt(o);
  if(pago(o))return `<div class="paybox ok"><b>Pagamento recebido</b><div>${p.pagoEm?'Recebido em '+fmtD(p.pagoEm)+'. ':''}Obrigado!</div></div>`;
  if(o.status==='cancelado')return '';
  const valor=`<div style="margin:6px 0 0"><b>Valor combinado: ${brl(v)}</b>${taxa>0?' (produtos '+brl(total(o))+' + entrega '+brl(taxa)+')':''}</div>`;
  if(!['em-rota','entregue','tentativa'].includes(o.status))return `<div class="paybox wait"><b>Como será o pagamento</b><p style="margin:6px 0 0">O valor combinado será pago por um link de pagamento que enviamos quando o seu pedido entrar em rota para entrega. Você não precisa pagar agora.</p>${valor}</div>`;
  return `<div class="paybox wait"><b>Seu pedido está em rota. Chegou a hora de pagar.</b>${valor}<p style="margin:6px 0 8px">Pague pelo link abaixo, no valor combinado${taxa>0?', já com a taxa de entrega':''}.</p>${link?`<a class="btn acc" href="${esc(link)}" target="_blank" rel="noopener">Pagar ${brl(v)} agora</a>`:'<div class="note warn" style="margin:0">O link de pagamento ainda não foi disponibilizado. Fale com o atendimento.</div>'}</div>`;
}

/* ---------- regras operacionais (não dependem mais de pagamento prévio) ---------- */
function atraso(o){
  if(FINAL.includes(o.status))return null;const r=[];
  const horas=(now()-ultimoMov(o))/36e5;
  if(horas>LOG.atrasoHoras)r.push({tipo:'sem-movimento',min:Math.round((horas-LOG.atrasoHoras)*60)});
  const fim=fimJanela(o);if(fim&&now()>fim)r.push({tipo:'janela',min:Math.round((now()-fim)/60000)});
  if(!r.length)return null;
  return {r,horas,min:Math.max(...r.map(x=>x.min)),janela:r.some(x=>x.tipo==='janela'),sem:r.some(x=>x.tipo==='sem-movimento')};
}
function lgOrders(){return orders.filter(o=>ativo(o)&&(A.lgAll||!FINAL.includes(o.status)))}
function flags(o){
  let f='';const at=atraso(o);
  if(['em-rota','entregue','tentativa'].includes(o.status)&&!pago(o))f+=' <span class="st pg-vermelho">Pagamento pendente</span>';
  if(at)f+=` <span class="st s-falha">${at.janela?'Prazo vencido':'Sem movimentação'}</span>`;
  if(reagendados(o))f+=' <span class="st s-prog">Reagendado</span>';
  if(etqStale(o)&&(o.etiquetas||[]).length)f+=' <span class="st s-aguardando">Etiqueta desatualizada</span>';
  return f;
}
function alertas(){
  const A_=[];
  orders.forEach(o=>{
    if(o.status==='cancelado')return;
    if(o.status==='entregue'&&!pago(o))A_.push({id:'semp:'+o.id,sev:'critico',tipo:'Entregue sem pagamento recebido',o,t:ultimoMov(o)});
    if(FINAL.includes(o.status))return;
    if(o.status==='realizado')A_.push({id:'novo:'+o.id,sev:'info',tipo:'Novo pedido recebido',o,t:o.at});
    if(['confirmado','preparacao'].includes(o.status))A_.push({id:'sep:'+o.id+':'+o.status,sev:'atencao',tipo:'Pedido aguardando separação',o,t:ultimoMov(o)});
    if(o.status==='em-rota'&&o.pagamento&&o.pagamento.status==='pendente')A_.push({id:'link:'+o.id,sev:'atencao',tipo:'Em rota sem link de pagamento enviado',o,t:ultimoMov(o)});
    const at=atraso(o);
    if(at&&at.sem)A_.push({id:'mov:'+o.id+':'+Math.floor(ultimoMov(o)/1000),sev:'critico',tipo:'Pedido sem movimentação há mais de '+LOG.atrasoHoras+' h',o,t:ultimoMov(o)});
    if(at&&at.janela)A_.push({id:'prazo:'+o.id+':'+o.entrega.data+o.entrega.turno,sev:'critico',tipo:'Entrega com prazo ultrapassado',o,t:fimJanela(o)});
    const rg=(o.eventos||[]).filter(e=>e.tipo==='reagendado').pop();
    if(rg)A_.push({id:'rea:'+o.id+':'+rg.id,sev:'atencao',tipo:'Pedido reagendado',o,t:rg.t});
    if(o.status==='programada'&&o.entrega.data&&o.entrega.data<=hojeS())A_.push({id:'saida:'+o.id+':'+o.entrega.data,sev:'atencao',tipo:'Pedido aguardando saída para entrega',o,t:now()});
  });
  const ord={critico:0,atencao:1,info:2};
  return A_.sort((a,b)=>ord[a.sev]-ord[b.sev]||b.t-a.t);
}

  if(![c.taxaCredito,c.taxaDebito,c.taxaPix].every(x=>x>=0&&x<=30)||![c.prazoCredito,c.prazoDebito,c.prazoPix].every(x=>x>=0&&x<=365&&Number.isInteger(x))){toast('Confira as taxas (0 a 30%) e os prazos (0 a 365 dias, números inteiros).');return}

function retSalvar(){

  os.forEach(o=>{o.pagamento.repassado=true;o.pagamento.retiradaId=r.id;addEv(o,{tipo:'pagamento',publico:false,texto:'Incluído na retirada nº '+r.n+' ('+fmtDay(data)+')'})});

function tabPagamentos(){
  A.pg=Object.assign({per:'mes',forma:'',st:'',sel:[]},A.pg);const F=A.pg;const c=pgcfg();
  const d0=hojeS(),mes=d0.slice(0,7),d30=addDias(d0,-29);
  const noPer=o=>{if(!pago(o))return true;const d=ymd(new Date(o.pagamento.pagoEm));return F.per==='todos'||(F.per==='mes'?d.slice(0,7)===mes:d>=d30)};
  const base=orders.filter(o=>ativo(o)&&(pago(o)||['em-rota','entregue','tentativa'].includes(o.status)));
  let rows=base.filter(noPer);
  if(F.forma)rows=rows.filter(o=>pago(o)&&o.pagamento.forma===F.forma);
  if(F.st)rows=rows.filter(o=>sitPag(o)===F.st);
  rows.sort((a,b)=>(pago(b)?b.pagamento.pagoEm:b.at)-(pago(a)?a.pagamento.pagoEm:a.at));
  const pagos=base.filter(pago).filter(noPer);
  const aReceber=base.filter(o=>!pago(o)),aRepassar=base.filter(o=>pago(o)&&!o.pagamento.repassado);
  const per=ret=>F.per==='todos'||(F.per==='mes'?ret.data.slice(0,7)===mes:ret.data>=d30);
  const retPer=RETIR.filter(per);

  const card=(v,t,s)=>`<div class="kpi"><b>${v}</b><span>${t}</span>${s?`<small>${s}</small>`:''}</div>`;
