  <div class="box"><div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">${chips('per',[['mes','Neste mês'],['30','Últimos 30 dias'],['todos','Tudo']])}${chips('forma',[['','Todas as formas'],['credito','Crédito'],['debito','Débito'],['pix','Pix']])}${chips('st',[['','Todas as situações'],['aguardando','Aguardando o cliente'],['repassar','A repassar'],['repassado','Repassado']])}</div></div>
  <div class="box" style="margin-top:12px"><h3 style="margin-top:0">Recebimentos <span class="cn big">${rows.length}</span></h3>${rows.length?`<div class="tbl"><table><thead><tr><th></th><th>Pedido</th><th>Cliente</th><th>Forma</th><th class="r">Valor</th><th class="r">Taxa</th><th class="r">Líquido</th><th>Pago em</th><th>Repasse</th><th>Situação</th><th></th></tr></thead><tbody>${rows.map(o=>{const p=o.pagamento,s=sitPag(o);return `<tr><td>${s==='repassar'?`<input type="checkbox" style="width:auto" ${F.sel.includes(o.id)?'checked':''} onchange="pgTog(${o.id},this.checked)" aria-label="Incluir na retirada">`:''}</td><td><b>${codigoPedido(o)}</b></td><td>${esc(o.entrega.nome)}</td><td>${s==='aguardando'?'<span style="color:var(--muted)">Link de pagamento</span>':esc(pagLabel(p))}</td><td class="r">${brl(s==='aguardando'?valorAcordado(o):p.bruto)}</td><td class="r">${s==='aguardando'?'':brl(p.taxaValor)}</td><td class="r">${s==='aguardando'?'':brl(p.liquido)}</td><td>${s==='aguardando'?'':fmtDM(ymd(new Date(p.pagoEm)))}</td><td>${s==='aguardando'?'':(s==='repassado'?'Retirada nº '+((RETIR.find(r=>r.id===p.retiradaId)||{}).n||'')+'':(p.prevRepasse?fmtDay(p.prevRepasse):''))}</td><td><span class="st ${s==='repassado'?'s-confirmado':s==='repassar'?'s-aguardando':'pg-amarelo'}">${s==='aguardando'?'Aguardando o cliente':s==='repassar'?'A repassar':'Repassado'}</span></td><td class="r" style="white-space:nowrap">${s==='aguardando'?`<button class="btn sm" onclick="pgAbrir(${o.id})">Registrar pagamento</button> `:''}<button class="btn sm ghost" onclick="admAbrir(${o.id})">Abrir</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="note">Nenhum recebimento neste filtro.</div>'}
  ${selOs.length?`<div class="avanca" style="margin-top:10px"><div><small>Retirada</small><b>${selOs.length} pagamento${selOs.length!==1?'s':''} · ${brl(selOs.reduce((s,o)=>s+o.pagamento.liquido,0))} líquidos</b></div><div class="c3" style="flex:none"><label for="rtD" style="margin:0">Data da retirada</label><input id="rtD" type="date" value="${hojeS()}"></div><button class="btn acc" onclick="retSalvar()">Registrar retirada</button></div>`:'<p style="font-size:.82rem;color:var(--muted);margin:10px 0 0">Marque os pagamentos "A repassar" para registrar uma retirada (saque do saldo para a conta).</p>'}</div>
  <div class="two" style="grid-template-columns:1fr 1fr;margin-top:12px"><div class="box"><h3 style="margin-top:0">Histórico de retiradas</h3>${RETIR.length?`<div class="tbl"><table><thead><tr><th>Nº</th><th>Data</th><th>Pedidos</th><th class="r">Líquido</th><th></th></tr></thead><tbody>${RETIR.slice().sort((a,b)=>b.n-a.n).map(r=>`<tr><td>${r.n}</td><td>${fmtDay(r.data)}</td><td style="font-size:.8rem">${r.pedidos.map(id=>{const o=orders.find(x=>x.id===id);return o?codigoPedido(o):''}).join(', ')}</td><td class="r">${brl(r.total)}</td><td class="r"><button class="btn sm ghost" onclick="retDesfazer('${r.id}')">Desfazer</button></td></tr>`).join('')}</tbody></table></div>`:'<p style="color:var(--muted);margin:0">Nenhuma retirada registrada.</p>'}</div>
  <div class="box"><h3 style="margin-top:0">Estimativas de taxa e prazo</h3><p style="margin:0 0 8px;font-size:.82rem;color:var(--muted)">Usadas como sugestão ao registrar um pagamento. Troque pelos valores reais do seu provedor.</p><div class="fr"><div class="c3"><label for="cfC">Taxa crédito (%)</label><input id="cfC" type="number" step="0.01" value="${c.taxaCredito}"></div><div class="c3"><label for="cfD">Taxa débito (%)</label><input id="cfD" type="number" step="0.01" value="${c.taxaDebito}"></div><div class="c3"><label for="cfX">Taxa Pix (%)</label><input id="cfX" type="number" step="0.01" value="${c.taxaPix}"></div><div class="c3"><label for="cfPC">Prazo crédito (dias)</label><input id="cfPC" type="number" value="${c.prazoCredito}"></div><div class="c3"><label for="cfPD">Prazo débito (dias)</label><input id="cfPD" type="number" value="${c.prazoDebito}"></div><div class="c3"><label for="cfPX">Prazo Pix (dias)</label><input id="cfPX" type="number" value="${c.prazoPix}"></div></div><p><button class="btn acc" onclick="pgCfgSalvar()">Salvar estimativas</button></p></div></div>`;
}

/* ---------- entregadores ---------- */
const rotaCod=r=>'R-'+String(r.n).padStart(3,'0');
function rotaStats(r){
  const os=r.orders.map(id=>orders.find(x=>x.id===id)).filter(Boolean);
  return {os,qtd:os.length,entregues:os.filter(o=>o.status==='entregue').length,valor:os.reduce((s,o)=>s+valorAcordado(o),0),taxas:os.reduce((s,o)=>s+taxaEnt(o),0),recebido:os.filter(pago).reduce((s,o)=>s+valorAcordado(o),0)};
}
function rotaSit(r){
  const s=rotaStats(r);
  if(s.qtd&&s.os.every(o=>FINAL.includes(o.status)))return 'Concluída';
  if(s.os.some(o=>o.status==='em-rota'||o.status==='tentativa'))return 'Em rota';
  return r.enviadaEm?'Enviada ao entregador':'Montada';
}
function entStats(e){
  let ped=0,ent=0,val=0,tx=0;const rs=ROTE.filter(r=>r.entregadorId===e.id);
  rs.forEach(r=>{const s=rotaStats(r);ped+=s.qtd;s.os.filter(o=>o.status==='entregue').forEach(o=>{ent++;val+=valorAcordado(o);tx+=taxaEnt(o)})});
  return {rotas:rs.length,ped,ent,val,tx};
}
const entNome=id=>{const e=ENTR.find(x=>x.id===id);return e?e.nome:'(removido)'};
function entSalvar(){
  A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);
  const nome=tc(v_('enN'));const sem9=c_('enWn9');const w=v_('enW');
  if(nome.length<2){toast('Informe o nome do entregador.');return}
  const er=foneErro(w,sem9);if(er){toast(er);return}
  const dig=digits(w);
  if(ENTR.some(x=>digits(x.whats)===dig&&x.id!==A.ent.edit)){toast('Já existe um entregador com este WhatsApp.');return}
  if(A.ent.edit){const e=ENTR.find(x=>x.id===A.ent.edit);if(e){e.nome=nome;e.whats=w;e.sem9=sem9}A.ent.edit=null;toast('Entregador atualizado.')}
  else{ENTR.push({id:'E'+Date.now().toString(36),nome,whats:w,sem9,ativo:true,criadoEm:now()});toast('Entregador cadastrado.')}
  save();route();
}
function entEditar(id){A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);A.ent.edit=id;route()}
function entCancelar(){A.ent.edit=null;route()}
function entToggle(id){const e=ENTR.find(x=>x.id===id);if(e){e.ativo=e.ativo===false;save();route()}}
function entHist(id){A.ent.hist=A.ent.hist===id?null:id;route()}
function rotaAbrir(id){A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);A.ent.rota=id;A.tab='entregadores';A.ord=null;route();window.scrollTo(0,0)}
function rotaVoltar(){A.ent.rota=null;route()}
function rotaMsg(r){
  const en=ENTR.find(x=>x.id===r.entregadorId)||{nome:''};const os=r.orders.map(id=>orders.find(x=>x.id===id)).filter(Boolean);
  const L=[`*Rota ${rotaCod(r)}* (${fmtDay(r.data)})`,`Entregador: ${en.nome}`,`Pedidos: ${os.length}`,''];
  os.forEach((o,i)=>{
    const e=o.entrega,d=e.dest;
    L.push(`*${i+1}) ${codigoPedido(o)}* | ${e.nome}`,`Tel.: ${e.fone}`,`Endereço: ${d.rua}, ${d.num}${d.comp?', '+d.comp:''}, ${d.bairro}, ${d.cidade}/${String(d.uf).toUpperCase()}, CEP ${d.cep}`);
    if(d.ref)L.push('Referência: '+d.ref);
    L.push(`Entrega: ${fmtDM(e.data)}, ${turnoNome(e.turno)}${e.janela?' ('+e.janela+')':''}`,'Itens: '+o.items.map(i=>i.qty+'x '+(i.base||i.name)).join('; '));
    if(e.obs)L.push('Obs. do cliente: '+e.obs);
    if(e.obsEntregador)L.push('Obs. para o entregador: '+e.obsEntregador);
    L.push('Pagamento: o cliente paga pelo link, não cobrar na entrega','');
  });
  return L.join('\n').trim();
}
function rotaEnviarWA(rid){
  const r=ROTE.find(x=>x.id===rid);if(!r)return;const en=ENTR.find(x=>x.id===r.entregadorId);if(!en){toast('Entregador não encontrado.');return}
  const campo=document.getElementById('rotaMsgT');const t=campo?campo.value:rotaMsg(r);if(!t.trim()){toast('A mensagem está vazia.');return}
  window.open('https://wa.me/55'+digits(en.whats).replace(/^55/,'')+'?text='+encodeURIComponent(t),'_blank');
  r.enviadaEm=now();r.orders.forEach(id=>{const o=orders.find(x=>x.id===id);if(o)addEv(o,{tipo:'whatsapp',publico:false,texto:'Rota '+rotaCod(r)+' enviada ao entregador '+en.nome+' (envio não confirmado pelo sistema)'})});
  save();toast('Conversa aberta com '+en.nome+'. O envio é feito por você no WhatsApp.');route();
}
function rotaIniciar(rid){
  const r=ROTE.find(x=>x.id===rid);if(!r||!ADMIN||ADMIN.papel==='separador')return;
  const alvo=r.orders.map(id=>orders.find(x=>x.id===id)).filter(o=>o&&o.status==='programada');
  if(!alvo.length){toast('Não há pedidos "Entrega programada" nesta rota.');return}
  if(!confirm('Marcar '+alvo.length+' pedido(s) como "Saiu para entrega"? Cada cliente fica com a mensagem do link de pagamento pronta para enviar.'))return;
  alvo.forEach(o=>setStatus(o,'em-rota',{}));r.saiuEm=now();save();toast(alvo.length+' pedido(s) em rota. Envie o link de pagamento a cada cliente.');route();
}
function rotaEntregue(oid){
  const o=orders.find(x=>x.id===oid);if(!o||!ADMIN||ADMIN.papel==='separador'||o.status!=='em-rota')return;
  setStatus(o,'entregue',{});toast(codigoPedido(o)+' entregue.'+(pago(o)?'':' O pagamento ainda não foi registrado.'));route();
}
function rotaRemover(rid,oid){
  const r=ROTE.find(x=>x.id===rid);const o=orders.find(x=>x.id===oid);if(!r||!o||o.status!=='programada')return;
  r.orders=r.orders.filter(x=>x!==oid);delete o.rotaId;delete o.entregadorId;
  if(!r.orders.length){ROTE=ROTE.filter(x=>x.id!==rid);A.ent.rota=null}
  save();route();
}
function rotaLinkCliente(oid){const o=orders.find(x=>x.id===oid);if(!o)return;if(!o.msgPag)o.msgPag={t:now(),texto:msgLinkCliente(o)};enviarLinkCliente(oid)}
function rotaDetalheHtml(r){
  const s=rotaStats(r);const en=ENTR.find(x=>x.id===r.entregadorId)||{nome:'(removido)',whats:''};const sit=rotaSit(r);
  const podeIniciar=s.os.some(o=>o.status==='programada');
  return `<p><button class="btn ghost sm" onclick="rotaVoltar()">&larr; Voltar aos entregadores</button></p>
  <div class="box"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h3 style="margin:0">Rota ${rotaCod(r)} <span class="st ${sit==='Concluída'?'s-confirmado':sit==='Em rota'?'s-rota':'s-prog'}">${sit}</span></h3><div style="color:var(--muted);font-size:.88rem">${fmtDay(r.data)} · Entregador: <b>${esc(en.nome)}</b> · ${esc(en.whats)}</div></div></div>
  <div class="pgrid"><div class="pbox"><small>Pedidos</small><b>${s.entregues} de ${s.qtd} entregues</b></div><div class="pbox"><small>Valor da rota</small><b>${brl(s.valor)}</b><div>Recebido ${brl(s.recebido)}</div></div><div class="pbox"><small>Taxas de entrega</small><b>${brl(s.taxas)}</b></div></div>
  <div class="tbl"><table><thead><tr><th>Pedido</th><th>Cliente e destino</th><th>Etapa</th><th>Pagamento</th><th class="r">Valor</th><th></th></tr></thead><tbody>${s.os.map(o=>{const d=o.entrega.dest;return `<tr><td><b>${codigoPedido(o)}</b></td><td>${esc(o.entrega.nome)}<div style="color:var(--muted);font-size:.8rem">${esc(d.bairro)}, ${esc(d.cidade)} · ${fmtDM(o.entrega.data)} ${turnoNome(o.entrega.turno)}</div></td><td><span class="st ${CLS[o.status]}">${LAB[o.status]}</span></td><td>${pagChip(o)}</td><td class="r">${brl(valorAcordado(o))}</td><td class="r" style="white-space:nowrap">${o.status==='em-rota'&&!pago(o)?`<button class="btn sm wa" onclick="rotaLinkCliente(${o.id})">Enviar link ao cliente</button> `:''}${o.status==='em-rota'?`<button class="btn sm" onclick="rotaEntregue(${o.id})">Entregue</button> `:''}${o.status==='programada'&&sit!=='Concluída'?`<button class="btn sm ghost" onclick="rotaRemover('${r.id}',${o.id})">Remover</button> `:''}<button class="btn sm ghost" onclick="admAbrir(${o.id})">Abrir</button></td></tr>`}).join('')}</tbody></table></div></div>
  <div class="box" style="margin-top:12px"><h3 style="margin-top:0">Rota para o entregador</h3><p style="margin:0 0 6px;font-size:.85rem;color:var(--muted)">${r.enviadaEm?'WhatsApp aberto em '+fmtD(r.enviadaEm)+'. O sistema não confirma o envio.':'Confira o texto, edite se quiser e envie. O envio só acontece quando você enviar no WhatsApp.'}</p><textarea id="rotaMsgT" rows="12">${esc(rotaMsg(r))}</textarea><div class="btns" style="margin-top:8px"><button class="btn wa" onclick="rotaEnviarWA('${r.id}')">Enviar a rota para o WhatsApp de ${esc(en.nome)}</button>${podeIniciar?`<button class="btn acc" onclick="rotaIniciar('${r.id}')">Iniciar rota (saiu para entrega)</button>`:''}</div>${CFG.linkPag?'':'<div class="note warn">O link de pagamento ainda não foi cadastrado na aba Site. Cadastre antes de iniciar a rota.</div>'}</div>`;
}
function tabEntregadores(){
  A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);const E=A.ent;
  if(E.rota){const r=ROTE.find(x=>x.id===E.rota);if(r)return rotaDetalheHtml(r);E.rota=null}
  const ed=E.edit?ENTR.find(x=>x.id===E.edit):null;
  const st=ENTR.map(e=>[e,entStats(e)]);
  const tot=st.reduce((a,x)=>{a.ent+=x[1].ent;a.val+=x[1].val;a.tx+=x[1].tx;return a},{ent:0,val:0,tx:0});
  const card=(v,t,s)=>`<div class="kpi"><b>${v}</b><span>${t}</span>${s?`<small>${s}</small>`:''}</div>`;
  return `<div class="kpis6">${card(ENTR.filter(e=>e.ativo!==false).length,'Entregadores ativos')}${card(ROTE.length,'Rotas montadas')}${card(tot.ent,'Pedidos entregues')}${card(brl(tot.val),'Valor total entregue','produtos mais taxas')}${card(brl(tot.tx),'Taxas de entrega','nos pedidos entregues')}${card(ROTE.filter(r=>rotaSit(r)!=='Concluída').length,'Rotas em aberto')}</div>
  <div class="box"><h3 style="margin-top:0">${ed?'Editar entregador':'Cadastrar entregador'}</h3><div class="fr"><div class="c3"><label for="enN">Nome</label><input id="enN" value="${esc(ed?ed.nome:'')}" autocomplete="off"></div><div class="c3"><label for="enW">WhatsApp</label>${foneCampo('enW',ed?ed.whats:'',ed?!!ed.sem9:false)}</div><div class="c2" style="align-self:start;margin-top:22px"><button class="btn acc" onclick="entSalvar()">${ed?'Salvar':'Cadastrar'}</button>${ed?` <button class="btn ghost" onclick="entCancelar()">Cancelar</button>`:''}</div></div></div>
  <div class="box" style="margin-top:12px"><h3 style="margin-top:0">Entregadores</h3>${ENTR.length?`<div class="tbl"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th class="r">Rotas</th><th class="r">Pedidos entregues</th><th class="r">Valor total entregue</th><th class="r">Taxas de entrega</th><th></th></tr></thead><tbody>${st.map(([e,s])=>`<tr class="${e.ativo===false?'inativo':''}"><td><b>${esc(e.nome)}</b>${e.ativo===false?' <span class="st s-cancelado">Inativo</span>':''}</td><td><a href="https://wa.me/55${digits(e.whats).replace(/^55/,'')}" target="_blank" rel="noopener">${esc(e.whats)}</a></td><td class="r">${s.rotas}</td><td class="r">${s.ent}</td><td class="r">${brl(s.val)}</td><td class="r">${brl(s.tx)}</td><td class="r" style="white-space:nowrap"><button class="btn sm ghost" onclick="entHist('${e.id}')">${E.hist===e.id?'Ocultar histórico':'Histórico'}</button> <button class="btn sm ghost" onclick="entEditar('${e.id}')">Editar</button> <button class="btn sm ghost" onclick="entToggle('${e.id}')">${e.ativo===false?'Ativar':'Desativar'}</button></td></tr>${E.hist===e.id?`<tr><td colspan="7" style="background:#f7faf7">${rotasTabela(ROTE.filter(r=>r.entregadorId===e.id))}</td></tr>`:''}`).join('')}</tbody></table></div>`:'<div class="note">Nenhum entregador cadastrado. Cadastre o primeiro acima.</div>'}</div>
  <div class="box" style="margin-top:12px"><h3 style="margin-top:0">Rotas e controle dos valores</h3>${rotasTabela(ROTE)}<p style="margin:8px 0 0;font-size:.82rem;color:var(--muted)">Para montar uma rota, vá em Logística, marque os pedidos e escolha o entregador. "Valor da rota" soma o valor combinado dos pedidos (produtos e taxa de entrega).</p></div>`;
}
function rotasTabela(L){
  if(!L.length)return '<p style="color:var(--muted);margin:0">Nenhuma rota registrada.</p>';
  return `<div class="tbl"><table><thead><tr><th>Rota</th><th>Data</th><th>Entregador</th><th class="r">Pedidos</th><th class="r">Valor da rota</th><th class="r">Taxas</th><th class="r">Recebido</th><th>Situação</th><th></th></tr></thead><tbody>${L.slice().sort((a,b)=>b.n-a.n).map(r=>{const s=rotaStats(r);const sit=rotaSit(r);return `<tr><td><b>${rotaCod(r)}</b></td><td>${fmtDM(r.data)}</td><td>${esc(entNome(r.entregadorId))}</td><td class="r">${s.entregues}/${s.qtd}</td><td class="r">${brl(s.valor)}</td><td class="r">${brl(s.taxas)}</td><td class="r">${brl(s.recebido)}</td><td>${sit}</td><td class="r"><button class="btn sm" onclick="rotaAbrir('${r.id}')">Abrir</button></td></tr>`}).join('')}</tbody></table></div>`;
}

/* ---------- montar rota na aba Logística ---------- */
const rotaElegivel=o=>ativo(o)&&!o.rotaId&&['aguardando-programacao','programada'].includes(o.status);
function rtTog(id,on){A.rtSel=(A.rtSel||[]).filter(x=>x!==id);if(on)A.rtSel.push(id);route()}
function rtLimpar(){A.rtSel=[];route()}
function rtTodos(){A.rtSel=lgOrders().filter(lgMatch).filter(rotaElegivel).sort((a,b)=>(a.entrega.data+a.entrega.turno).localeCompare(b.entrega.data+b.entrega.turno)).map(o=>o.id);route()}
function rotaChk(o){
  if(rotaElegivel(o))return `<input type="checkbox" style="width:auto;margin-right:8px" ${(A.rtSel||[]).includes(o.id)?'checked':''} onchange="rtTog(${o.id},this.checked)" aria-label="Incluir na rota">`;
  const r=o.rotaId&&ROTE.find(x=>x.id===o.rotaId);

function admItens(id){
  const o=gO(id),mot=v_('imot').trim();const novos=o.items.map((i,k)=>Math.max(0,parseInt(v_('iq'+k)||0,10)||0));

  if(novos.every(q=>q===0)){toast('Para remover todos os itens, cancele o pedido.');return}
  if(!mot){toast('Informe o motivo da alteração.');return}
  for(let k=0;k<novos.length;k++){const p=byId(o.items[k].id);const outros=o.reduced?o.items[k].qty:0;if(p&&novos[k]>stockLeft(p)+outros){toast('Estoque insuficiente para '+p.n+'.');return}}
  const de=o.items.map(i=>i.qty+'x '+(i.base||i.name)).join(', ');const totAntes=total(o);
  o.items.forEach((i,k)=>{i.qty=novos[k]});o.items=o.items.filter(i=>i.qty>0);
  if(o.disc){o.disc.valor=+(subtotal(o)*o.disc.pct/100).toFixed(2)}
  const para=o.items.map(i=>i.qty+'x '+(i.base||i.name)).join(', ');const totDepois=total(o);

  save();toast('Itens salvos. O cliente foi avisado e a mensagem de WhatsApp está pronta.'+(pago(o)&&totDepois!==totAntes?' Pedido já pago: acerte a diferença de '+brl(Math.abs(totDepois-totAntes))+' com o provedor.':'')+' Gere a etiqueta atualizada.');route();
}

   case '':html=pageHome();break;

async function bancoPedidos(){
  const r=await SB.from('pedidos_cliente').select('*').order('id');

async function validarCodigo(code,silencioso){

  if(r.error||!r.data||!r.data.ok){rv.msg=(r.data&&r.data.erro)||'Não foi possível conferir o código agora.';rv.code='';rv.ref=null;if(silencioso){rv.msg=''}return false}

function validateRef(code){
  code=String(code||'').trim().toUpperCase();
  if(window.__banco){
    if(rv.ref&&rv.ref.codigo===code)return {ok:true,owner:rv.ref.owner,pct:rv.ref.pct};
    return {err:rv.msg||''};
  }
  return validateRefLocal(code);
}
function credits(owner){
  if(window.__banco&&owner===me){
    const n=CRED.disponiveis||0;
    return {earned:Array.from({length:n},()=>({pct:CRED.pct})),used:0,avail:n,conf:[]};
  }
  const conf=orders.filter(o=>o.ref&&o.ref.owner===owner&&COUNT.includes(o.status)).sort((a,b)=>a.conf-b.conf);
  const perMonth={},earned=[];
  conf.forEach(o=>{const k=monthKey(o.at);perMonth[k]=(perMonth[k]||0)+1;o._cred=perMonth[k]<=AM.limite?'ok':'limite';if(o._cred==='ok')earned.push({order:o.id,pct:(o.disc&&o.disc.pct)||AM.pct})});
  const used=orders.filter(o=>o.user===owner&&o.disc&&o.disc.tipo==='credito'&&o.status!=='cancelado').length;
  return {earned,used,avail:Math.max(0,earned.length-used),conf};
}
function firstEligible(){
  const u=user();if(!u||!PC.ativa)return false;
  if(orders.some(o=>o.user===me&&o.status!=='cancelado'))return false;
  if(window.__banco)return true;
  for(const [e,x] of Object.entries(users)){
    if(e===me)continue;
    if(!orders.some(o=>o.user===e&&o.status!=='cancelado'))continue;
    if(digits(x.fone)===digits(u.fone)||sameAddr(x.end,u.end))return false;
  }
  return true;
}

function cartAdd(id,vid,qty){
  const p=byId(id);if(!p||p.ativo===false)return false;const v=vid===SP?{id:SP,n:'Unidade',un:1,sp:true}:(p.vars||[]).find(x=>x.id===vid);if(!v)return false;
  const ex=cart.find(i=>i.id===id&&i.v===vid);const lim=maxVar(p,v,ex);
  const novo=(ex?ex.qty:0)+qty;
  if(novo>lim){toast(lim>0?'Só há '+lim+' disponível'+(lim>1?'is':'')+' desta opção.':'Esta opção está sem estoque.');return false}
  if(ex)ex.qty=novo;else cart.push({id,v:vid,opt:v.n,qty});
  return true;
}

  if(q<1)cart=cart.filter(x=>x!==i);else if(v&&q<=maxVar(p,v,i))i.qty=q;else toast('Não há mais unidades desta opção em estoque.');

function redimensionar(file){
  return new Promise((ok,no)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const M=640,s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):no(new Error('foto')),'image/webp',.8)};
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('foto'))};img.src=url;
  });
}

function etqDiffAdm(u,S){

  cmp('endereço',a.dest,S.dest);cmp('telefone',a.fone,S.fone);cmp('data',a.data,S.data);cmp('turno',a.turno,S.turno);cmp('janela',a.janela,S.janela);

  if(u.cfg&&JSON.stringify(u.cfg)!==JSON.stringify(cfgSnap()))ch.push('configuração da etiqueta');

}

/* ---------- preferência de entrega: seletor de dia, mês e ano + horário ---------- */
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var DSEMN=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function entDV(){
  if(!ent.data)return {d:'—',m:'—',y:'—',txt:'Escolha a data de entrega'};
  const [y,m,d]=ent.data.split('-').map(Number);const dt=new Date(y,m-1,d);
  return {d:d,m:MESES[m-1],y:y,txt:DSEMN[dt.getDay()]+', '+d+' de '+MESES[m-1].toLowerCase()+' de '+y};
}
function entDt(part,delta){
  const base=addDias(hojeS(),LOG.antecedencia);
  if(!ent.data){ent.data=base;route();return}
  let [y,m,d]=ent.data.split('-').map(Number);
  const dim=(yy,mm)=>new Date(yy,mm,0).getDate();
  if(part==='d'){d+=delta;if(d>dim(y,m))d=1;if(d<1)d=dim(y,m)}
  if(part==='m'){m+=delta;if(m>12)m=1;if(m<1)m=12;d=Math.min(d,dim(y,m))}
  if(part==='y'){y+=delta;d=Math.min(d,dim(y,m))}
  ent.data=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');route();
}
function prefHtml(turnos){
  const v=entDV();
  const col=(k,t,val)=>`<div class="dp-col"><span class="dp-t">${t}</span><button type="button" class="dp-up" onclick="entDt('${k}',1)" aria-label="Aumentar ${t.toLowerCase()}">+</button><b class="dp-v">${val}</b><button type="button" class="dp-dn" onclick="entDt('${k}',-1)" aria-label="Diminuir ${t.toLowerCase()}">−</button></div>`;
  return '<h3 class="pref-h">Preferência de entrega</h3><div class="pf-l">Data de entrega</div><div class="datepick"><div class="dp-cols">'+col('d','DIA',v.d)+col('m','MÊS',v.m)+col('y','ANO',v.y)+'</div><div class="dp-sum">'+v.txt+'</div></div>'
   +'<div class="pf-l" style="margin-top:16px">Melhor horário para a entrega</div><div class="turnos3">'+(turnos.map(t=>'<label class="turno3 '+(ent.turno===t?'on':'')+'"><input type="radio" name="turno" value="'+t+'" '+(ent.turno===t?'checked':'')+' onchange="ent.turno=this.value;route()">'+TURNOS[t]+'</label>').join('')||'<span class="note err">Nenhum turno disponível no momento.</span>')+'</div>';
}

/* ---------- rastreio por link (sem login) ---------- */
var TRK=window.TRK||{};
function trackUrl(codigo,token){return location.href.split('#')[0]+'#/acompanhar/'+codigo+'/'+token}
function msgRastreio(o){const nome=String((o.entrega||{}).nome||'').split(' ')[0];return nl('Olá, '+nome+'! Acompanhe o seu pedido '+codPed(o)+' por aqui: '+trackUrl(codPed(o),o.token))}
function pageAcompanhar(code,token){
  if(!window.TRK)window.TRK={};
  const caixa=t=>'<div class="wrap pg"><h1 class="t">Acompanhe o seu pedido</h1><div class="box" style="max-width:560px">'+t+'</div></div>';
  if(!code||!token)return caixa('<p style="margin-top:0">Para acompanhar um pedido, abra o link de acompanhamento que enviamos pelo WhatsApp ou entre na sua conta e veja em Meus pedidos.</p><p><button class="btn acc" onclick="nav(\'/pedidos\')">Ver meus pedidos</button></p>');
  if(!window.__banco)return caixa('<p style="margin:0;color:var(--muted)">Carregando...</p>');
  const key=code+'/'+token;
  if(TRK[key]===undefined){
    TRK[key]=null;
    if(!SB)return caixa('<p>Sem conexão com o servidor. Recarregue a página e tente de novo.</p>');
    SB.rpc('rastrear_pedido',{p_codigo:decodeURIComponent(code),p_token:token}).then(r=>{TRK[key]=(r.error||!r.data)?false:r.data;if(/^#\/acompanhar/.test(location.hash))route()});
  }
  const r=TRK[key];
  if(r===null)return caixa('<p style="margin:0;color:var(--muted)">Buscando o seu pedido...</p>');
  if(r===false)return caixa('<div class="note err">Este link não é válido. Confira o link que enviamos pelo WhatsApp.</div><p><button class="btn" onclick="nav(\'/\')">Ir para a loja</button></p>');
  const wa=waUrl('Olá! Gostaria de falar sobre o pedido '+r.codigo+'.');
  const evs=(r.eventos||[]).slice().reverse();
  return '<div class="wrap pg"><h1 class="t">Acompanhe o seu pedido</h1><div class="box pcard"><div class="pc-head"><div><b class="pc-cod">Pedido '+esc(r.codigo)+'</b> <span class="st '+(CLS[r.status]||'')+'">'+esc(LAB[r.status]||r.status)+'</span><div class="pc-sub">Feito em '+fmtD(Date.parse(r.criado_em))+'</div></div><div class="btns"><a class="btn ghost sm" href="'+wa+'" target="_blank" rel="noopener">Falar sobre este pedido</a></div></div>'
   +'<div class="pgrid"><div class="pbox"><small>Previsão de entrega</small><b>'+fmtDay(r.data)+'</b><div>'+esc(TURNOS[r.turno]||'')+'</div></div>'
   +'<div class="pbox"><small>Entrega em</small><b>'+esc(r.cidade||'')+(r.uf?'/'+esc(r.uf):'')+'</b></div>'
   +'<div class="pbox"><small>Pagamento</small><b>'+(r.pago?'Pago':'A combinar pelo WhatsApp')+'</b></div></div>'
   +'<h3>Itens do pedido</h3><div class="tbl"><table><tbody>'+r.itens.map(i=>'<tr><td>'+esc(i.name)+'</td><td>'+i.qty+'</td></tr>').join('')+'</tbody></table></div>'
   +'<h3>Andamento</h3>'+(evs.length?'<div class="tbl"><table><tbody>'+evs.map(e=>'<tr><td style="white-space:nowrap">'+fmtD(Date.parse(e.t))+'</td><td>'+esc(e.texto||'')+(e.motivo?'<div style="color:var(--muted);font-size:.82rem">Motivo: '+esc(e.motivo)+'</div>':'')+'</td></tr>').join('')+'</tbody></table></div>':'<p style="color:var(--muted)">Ainda sem atualizações.</p>')
   +'</div></div>';
}

/* ---------- etiqueta direto da lista de pedidos ---------- */
var ICO_DOC='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>';
async function etqRapida(id){
  if(A9.busy)return;
  const o=(A9.pedidos||[]).find(x=>x.id===id);if(!o)return;
  const w=window.open('about:blank','_blank');
  A9.busy=true;
  try{
    const r=await SB.from('etiquetas').select('*').eq('pedido_id',id).order('v');
    if(r.error)throw r.error;
    o.etiquetas=r.data||[];
    const S=snapOrder(ordAdm(o)),cfg=cfgSnap(),hash=snapHash(S,cfg),u=etqUlt(o);
    let rec=u;
    if(!u||u.hash!==hash){
      const v=(u?u.v:0)+1,motivo=u?etqDiffAdm(u,S):'Primeira geração';
      if(u)await SB.from('etiquetas').update({status:'substituida'}).eq('pedido_id',id).eq('status','atual');
      const ins=await SB.from('etiquetas').insert({pedido_id:id,v,hash,snap:S,cfg,status:'atual',motivo,por:ADMIN.nome});
      if(ins.error)throw ins.error;
      rec={v,snap:S,cfg};
      await etqLog(id,'Etiquetas geradas (versão '+v+')',motivo);
    }
    await etqLog(id,'Impressão solicitada (as duas etiquetas, versão '+rec.v+')');
    const url=blobUrl(etqBytes(rec,'ambas'));
    if(w)w.location.href=url;else window.open(url,'_blank');
    toast('Etiquetas do pedido '+codPed(o)+' abertas. Escolha a impressora e o papel '+LBL.w+' x '+LBL.h+' mm.');
  }catch(x){
    if(w)w.close();
    A9.msg='Não foi possível gerar a etiqueta agora.';A9.erro=true;route();
  }
  A9.busy=false;
}

/* ---------- seleção de pedidos e etiquetas em lote ---------- */
A9.selP={};
function selPed(id,on){if(on)A9.selP[id]=true;else delete A9.selP[id];route()}
function selTodosPed(on){(A9.lastLista||[]).forEach(id=>{if(on)A9.selP[id]=true;else delete A9.selP[id]});route()}
async function etqLote(){
  if(A9.busy)return;
  const ids=(A9.lastLista||[]).filter(id=>A9.selP[id]);
  if(!ids.length){toast('Marque pelo menos um pedido.');return}
  const tipo=v_('etqTipo')||'ambas';
  A9.busy=true;toast('Gerando as etiquetas de '+ids.length+' pedido'+(ids.length>1?'s':'')+'...');
  try{
    const rows=A9.pedidos.filter(o=>ids.includes(o.id));
    const er=await SB.from('etiquetas').select('*').in('pedido_id',ids).order('v');
    if(er.error)throw er.error;
    const por={};(er.data||[]).forEach(x=>{(por[x.pedido_id]=por[x.pedido_id]||[]).push(x)});
    const novos=[],subst=[],logs=[],recs=[];const cfg=cfgSnap();
    rows.forEach(o=>{
      const S=snapOrder(ordAdm(o)),hash=snapHash(S,cfg);const lst=por[o.id]||[];const u=lst[lst.length-1];
      if(u&&u.hash===hash){recs.push(u);return}
      const v=(u?u.v:0)+1,motivo=u?etqDiffAdm(u,S):'Primeira geração';
      if(u)subst.push(o.id);
      const rec={pedido_id:o.id,v,hash,snap:S,cfg,status:'atual',motivo,por:ADMIN.nome};
      novos.push(rec);recs.push(rec);
      logs.push({pedido_id:o.id,tipo:'etiqueta',publico:false,texto:'Etiquetas geradas (versão '+v+')',motivo,por:ADMIN.nome});
    });
    if(subst.length){const u=await SB.from('etiquetas').update({status:'substituida'}).in('pedido_id',subst).eq('status','atual');if(u.error)throw u.error}
    if(novos.length){const i=await SB.from('etiquetas').insert(novos);if(i.error)throw i.error}
    await SB.from('pedido_eventos').insert(ids.map(id=>({pedido_id:id,tipo:'etiqueta',publico:false,texto:'Download em lote ('+ETQ_TIPO[tipo]+')',por:ADMIN.nome})).concat(logs));
    const logo=currentLogo(),pgs=[];
    recs.forEach(rec=>{
      if(tipo!=='interna')pgs.push(etiquetaExterna(rec.snap,rec.cfg,logo));
      if(tipo!=='externa')etiquetaInterna(rec.snap,rec.cfg,logo).forEach(pg=>pgs.push(pg));
    });
    const bytes=pdfBuild(pgs,logo,{title:'Etiquetas de '+recs.length+' pedidos'});
    const a=document.createElement('a');a.href=blobUrl(bytes);a.download='etiquetas-'+hojeS()+'-'+recs.length+'-pedido'+(recs.length>1?'s':'')+'.pdf';document.body.appendChild(a);a.click();a.remove();
    toast('PDF com as etiquetas de '+recs.length+' pedido'+(recs.length>1?'s':'')+' baixado.');
    A9.selP={};
  }catch(x){A9.msg='Não foi possível gerar as etiquetas em lote agora.';A9.erro=true}
  A9.busy=false;route();
}
