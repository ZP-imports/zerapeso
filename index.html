function msgFill(t,vars){
  return String(t).split('\n').map(l=>{
    const ks=[...l.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);
    if(!ks.length)return l;
    const conhecidas=ks.filter(k=>k in vars);
    if(conhecidas.length===ks.length&&ks.every(k=>!String(vars[k]==null?'':vars[k]).trim()))return null;
    return l.replace(/\{(\w+)\}/g,(m,k)=>(k in vars)?String(vars[k]==null?'':vars[k]):m);
  }).filter(l=>l!==null).join('\n').replace(/\n{3,}/g,'\n\n');
}

function validarEntrega(d,t){
  if(!d)return 'Escolha a data desejada para receber o pedido.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||isNaN(new Date(d+'T12:00')))return 'Data inválida.';
  const min=addDias(hojeS(),LOG.antecedencia),max=addDias(hojeS(),LOG.janela);
  if(d<min)return 'A data deve ser a partir de '+fmtDay(min)+'.';
  if(d>max)return 'A data deve ser até '+fmtDay(max)+'.';
  if(LOG.bloqueados.includes(d))return 'Não há entregas em '+fmtDay(d)+'. Escolha outra data.';
  if(!t)return 'Escolha o turno desejado.';
  if(!TURNOS[t]||!LOG.turnos[t])return 'Turno indisponível.';
  return '';
}
function validarEnd(a,pre){

function validateRefLocal(code){
  code=String(code||'').trim().toUpperCase();
  if(!code)return {err:'Informe o código de indicação.'};
  if(!amOn())return {err:'A campanha Amigo Emagrece Amigo não está ativa no momento.'};
  const o=ownerByCode(code);if(!o)return {err:'Código de indicação não encontrado.'};
  const [oe,ou]=o,u=user();
  if(oe===me)return {err:'Você não pode usar o seu próprio código.'};
  if(purchases(me).length||orders.some(x=>x.user===me&&x.ref&&x.status!=='cancelado'))return {err:'O desconto de indicação vale só na primeira compra de quem foi indicado.'};
  if(digits(u.fone)===digits(ou.fone)||sameAddr(u.end,ou.end))return {err:'Não foi possível aplicar: os dados parecem ser da mesma pessoa ou da mesma casa de quem indicou.'};
  if(refMonthCount(oe)>=AM.limite)return {err:'Este código atingiu o limite de indicações deste mês. Peça ao seu amigo para indicar no mês que vem.'};
  return {ok:true,owner:oe,pct:AM.pct};
}

function firstEligible(){

  if(orders.some(o=>o.user===me&&o.status!=='cancelado'))return false;
  for(const [e,x] of Object.entries(users)){
    if(e===me)continue;
    if(!orders.some(o=>o.user===e&&o.status!=='cancelado'))continue;
    if(digits(x.fone)===digits(u.fone)||sameAddr(x.end,u.end))return false;
  }

}

function calcDisc(sub){
  if(!me)return null;const c=[];
  const mk=(tipo,pct,extra)=>Object.assign({tipo,pct,valor:+(sub*pct/100).toFixed(2)},extra||{});
  if(firstEligible())c.push(mk('primeira',PC.pct));
  if(amOn()){
    if(rv.code){const v=validateRef(rv.code);if(v.ok)c.push(mk('indicacao',v.pct,{code:rv.code.trim().toUpperCase(),owner:v.owner}))}
    if(rv.use){const k=credits(me);if(k.avail>0)c.push(mk('credito',k.earned[k.used].pct))}
  }
  if(!c.length)return null;
  const prio={indicacao:3,credito:2,primeira:1};
  c.sort((x,y)=>y.valor-x.valor||prio[y.tipo]-prio[x.tipo]);

}

function addCart(id,qty=1,opt='',btn){
  const p=byId(id);if(p&&p.consulta){window.open(waProd(p),'_blank');return}const left=stockLeft(p);const ex=cart.find(i=>i.id===id&&i.opt===opt);const now_=ex?ex.qty:0;
  if(left<=0){toast('Produto sem estoque.');return}
  if(now_+qty>left){toast('Só há '+left+' unidade'+(left>1?'s':'')+' em estoque.');return}
  if(ex)ex.qty+=qty;else cart.push({id,qty,opt});
  save();updHead();bump();
  if(btn){const o=btn.textContent;btn.classList.add('ok');btn.textContent='Adicionado';setTimeout(()=>{btn.classList.remove('ok');btn.textContent=o},1400)}
  toast('Produto adicionado ao carrinho.',['Ver carrinho','openCart()']);
  openCart();
}
const reRoute=()=>{if(/^#\/(carrinho|revisar)/.test(location.hash))route()};
function setQty(id,opt,d){const i=cart.find(x=>x.id===id&&x.opt===opt);if(!i)return;const p=byId(id);const q=i.qty+d;
  if(q<1){cart=cart.filter(x=>x!==i)}else if(q<=stockLeft(p)){i.qty=q}else{toast('Só há '+stockLeft(p)+' em estoque.')}
  save();updHead();drawDrawer();reRoute()}
function rmItem(id,opt){cart=cart.filter(x=>!(x.id===id&&x.opt===opt));save();updHead();drawDrawer();reRoute()}

function regAmigo(){
  const p=AM.pct,l=AM.limite;
  return `<div class="wrap pg reg" style="max-width:900px"><span class="regtag">Regulamento interno</span><h1 class="t">Campanha Amigo Emagrece Amigo</h1><div class="regbox"><b>${esc(AM.nome)}</b><br>Período: ${fmtDay(AM.inicio)} a ${fmtDay(AM.fim)} (campanha bimestral). Desconto: ${p}%. Limite: ${l} novos amigos que comprarem por mês, por indicador.</div><div class="box">
  <h3>1. Objetivo</h3><p>A campanha Amigo Emagrece Amigo da ${esc(CFG.brand)} premia clientes que indicam novos clientes. Quem indica e quem é indicado recebem desconto, nas condições abaixo.</p>
  <h3>2. Período e vigência</h3><p>A campanha é bimestral. Esta edição vale de ${fmtDay(AM.inicio)} a ${fmtDay(AM.fim)}. A cada bimestre o operador da loja pode definir um novo percentual de desconto e um novo período, que será divulgado no site. Os descontos só podem ser usados enquanto a campanha estiver ativa.</p>
  <h3>3. Quem pode participar</h3><p>Clientes com cadastro no site, maiores de 18 anos, que aceitaram a Política de Privacidade. Cada cliente cadastrado recebe um código pessoal de indicação.</p>
  <h3>4. Como funciona</h3><ul><li>O indicador compartilha o seu código com um amigo.</li><li>O amigo, que precisa ser novo cliente, informa o código na hora da compra, na revisão do primeiro pedido, e recebe ${p}% de desconto sobre o valor dos produtos dessa primeira compra.</li><li>Quando a compra do amigo for confirmada pela loja, o indicador ganha um desconto de ${p}% para usar em uma próxima compra.</li><li>Cada desconto vale para um único pedido e não é acumulável com outros descontos ou campanhas, inclusive o desconto de primeira compra: quando houver mais de um possível no mesmo pedido, vale o de maior valor. O desconto não incide sobre o frete.</li></ul>

  <h3>9. Medicamentos e normas aplicáveis</h3><p>Os descontos seguem as normas aplicáveis à venda e à divulgação de medicamentos. A loja pode excluir produtos da campanha. <em>Ponto a validar com o responsável técnico: aplicação do desconto a medicamentos que exigem prescrição.</em></p>
  <h3>10. Dados pessoais</h3><p>Os dados do amigo indicado são usados apenas para esta campanha e para o atendimento do pedido. O indicador vê somente o primeiro nome e a inicial do sobrenome do amigo e o andamento da indicação.</p>

}

    const c=ch.codePointAt(0);

function wrapTxt(s,size,bold,maxw){
  const out=[];

    let line='';
    par.split(/\s+/).filter(Boolean).forEach(word=>{
      const test=line?line+' '+word:word;
      if(tw(test,size,bold)<=maxw)line=test;
      else{if(line)out.push(line);
        if(tw(word,size,bold)>maxw){let part='';for(const ch of word){if(tw(part+ch,size,bold)>maxw){out.push(part);part=ch}else part+=ch}line=part}else line=word}
    });

  });

}
class Pg{

    o=o||{};let xx=x;const wd=tw(s,size,bold);

    if(o.gray!=null)this.ops.push(o.gray+' g');
    this.ops.push(`BT /F${bold?2:1} ${size} Tf ${this.X(xx)} ${this.Y(y)} Td (${pdfEsc(s)}) Tj ET`);

  }

    this.ops.push(`${this.X(x)} ${this.Y(y+h)} ${(w*K).toFixed(2)} ${(h*K).toFixed(2)} re ${mode||'f'}`);

    this.ops.push(`${(lw||0.3)*K} w`+(dash?' [2 2] 0 d':'')+` ${this.X(x1)} ${this.Y(y1)} m ${this.X(x2)} ${this.Y(y2)} l S`+(dash?' [] 0 d':''));

}

function b64ToBytes(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}

function pdfBuild(pages,logo,info){
  const parts=[];let off=0;const xr=[];
  const push=s=>{const u=typeof s==='string'?strBytes(s):s;parts.push(u);off+=u.length};
  const obj=(n,body)=>{xr[n]=off;push(n+' 0 obj\n'+body+'\nendobj\n')};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const hasImg=!!logo&&pages.some(p=>p.img);
  const first=hasImg?6:5;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(first+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  if(hasImg){
    xr[5]=off;push('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+logo.w+' /Height '+logo.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+logo.bytes.length+' >>\nstream\n');
    push(logo.bytes);push('\nendstream\nendobj\n');
  }
  pages.forEach((p,i)=>{
    const pid=first+i*2,cid=pid+1;
    const content=p.ops.join('\n');
    obj(pid,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+(p.w*K).toFixed(2)+' '+(p.h*K).toFixed(2)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+(hasImg?' /XObject << /Im1 5 0 R >>':'')+' >> /Contents '+cid+' 0 R >>');
    xr[cid]=off;push(cid+' 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
  });
  const infoId=first+pages.length*2;
  obj(infoId,'<< /Title ('+pdfEsc(info&&info.title||'Etiquetas')+') /Producer (ZP Imports) /Creator (ZP Imports) >>');
  const n=infoId+1;const xo=off;
  let x='xref\n0 '+n+'\n0000000000 65535 f \n';
  for(let i=1;i<n;i++)x+=String(xr[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+n+' /Root 1 0 R /Info '+infoId+' 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  const out=new Uint8Array(off);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}

/* ---------- logomarca: aceita PNG/JPG/WebP e converte para JPEG ---------- */
function logoLoad(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const max=600,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      res({data:c.toDataURL('image/jpeg',0.92),w:c.width,h:c.height})};im.onerror=()=>rej(new Error('Imagem inválida'));im.src=fr.result};
    fr.onerror=()=>rej(new Error('Falha ao ler o arquivo'));fr.readAsDataURL(file);
  });
}

function etqDiff(o){

function gerarEtiquetas(o,motivo,force){

function timelineCliente(o){
  const ev=(o.eventos||[]).filter(e=>e.publico);
  const at=atraso(o);const bad=o.status==='cancelado';
  const first=s=>(ev.find(e=>e.tipo==='status'&&e.para===s)||{}).t;
  const last=s=>ev.filter(e=>e.tipo==='status'&&e.para===s).slice(-1)[0];
  const rea=reagendados(o);
  const cur=bad?-1:faseDe(o.status);
  const reached=i=>bad?FASES[i].s.some(s=>first(s)):i<=cur;
  const total6=FASES.length;const nDone=FASES.filter((f,i)=>reached(i)).length;const pct=Math.round(nDone/total6*100);
  let h='';
  if(bad)h+='<div class="note err">Pedido cancelado. Em caso de dúvida, fale com a nossa equipe pelo WhatsApp de atendimento.</div>';
  else{
    const px=PROX[o.status];
    h+=`<div class="rprog"><div class="rprog-t"><b>${o.status==='entregue'?'Pedido entregue':'Fase '+Math.max(1,nDone)+' de '+total6}</b><span>${pct}% concluído</span></div><div class="rprog-b"><i style="width:${pct}%"></i></div>${o.status!=='entregue'?`<div class="rprog-n"><div><small>Agora</small><b>${LAB[o.status]||''}</b></div><div><small>Próximo passo</small><b>${px?esc(LAB[px]):''}</b></div><div><small>Última atualização</small><b>${fmtD(ultimoMov(o))}</b></div></div>`:''}</div>`;
  }
  if(o.track&&(o.track.code||o.track.link))h+=`<div class="trk trk-top"><span>Rastreio: ${esc(o.track.carrier)}</span>${o.track.code?`<code>${esc(o.track.code)}</code>`:''}${o.track.link?`<a href="${esc(o.track.link)}" target="_blank" rel="noopener">Rastrear na transportadora</a>`:''}</div>`;
  if(o.status==='tentativa')h+='<div class="note warn"><b>Tentativa de entrega não concluída.</b> Entraremos em contato para reprogramar.</div>';
  if(rea&&!FINAL.includes(o.status))h+='<div class="note warn"><b>Pedido reagendado.</b> Veja a nova previsão no histórico abaixo.</div>';
  if(at&&at.janela&&!bad)h+='<div class="note warn"><b>Pedido com atraso.</b> A previsão de entrega foi ultrapassada. Estamos tratando e você será avisado por aqui.</div>';
  h+='<ol class="tl">'+FASES.map((f,i)=>{
    const done=reached(i);const isCur=!bad&&i===cur;const isNext=!bad&&i===cur+1;const cls=done?'done':isNext?'cur':'todo';
    const sub=f.s.filter(s=>first(s));
    const unico=f.s.length===1;
    const t=unico?first(f.s[0]):(sub.length?first(sub[0]):0);
    const ult=sub.length?last(sub[sub.length-1]):null;
    const texto=done?(unico&&ult&&ult.texto?ult.texto:(unico?pubTxt(o,f.s[0],''):'')):f.d;
    const subHtml=(!unico&&sub.length)?`<ul class="subtl">${sub.map(s=>`<li><span>${LAB[s]}</span><small>${fmtD(first(s))}</small></li>`).join('')}</ul>`:'';
    return `<li class="${cls}"><span class="d">${done?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="m5 12 5 5 9-10"/></svg>':''}</span><strong>${f.n}${isCur?' <em class="agora">etapa atual</em>':''}${isNext?' <em class="agora prox">próxima etapa</em>':''}</strong>${done&&unico&&t?`<small>${fmtD(t)}</small>`:''}${(unico||!done)&&texto?`<small>${esc(texto)}</small>`:''}${subHtml}${f.s[0]==='em-rota'&&done&&o.track&&(o.track.code||o.track.link)?`<div class="trk"><span>${esc(o.track.carrier)}</span>${o.track.code?`<code>${esc(o.track.code)}</code>`:''}${o.track.link?`<a href="${esc(o.track.link)}" target="_blank" rel="noopener">Rastrear na transportadora</a>`:''}</div>`:''}</li>`}).join('')+'</ol>';
  h+=rotaCliente(o);
  const hist=ev.slice().reverse();
  h+=`<details class="hist-c" ${rea||o.status==='tentativa'||bad?'open':''}><summary>Histórico de atualizações (${hist.length})</summary><ul class="evl">${hist.map(e=>`<li class="${e.tipo==='reagendado'?'rea':e.tipo==='atraso'||(e.para==='tentativa')?'warn':''}"><small>${fmtD(e.t)}</small><div>${e.tipo==='reagendado'?'<b>Entrega reagendada.</b> ':''}${esc(e.texto)}</div></li>`).join('')}</ul></details>`;
  return h;
}

/* ======================= PROGRESSÃO DO PEDIDO: BIPAR E AVANÇAR ETAPA =======================
   Cada etapa tem um responsável. O botão só oferece a próxima etapa, sem pular. Voltar ou pular é só do administrador. */
const FLUXO=['pago','confirmado','preparacao','separacao','aguardando-programacao','programada','em-rota','entregue'];
/* Cada gesto (bip ou clique) leva o pedido ao destino 'to' e ativa, na ordem, as etapas intermediárias 'via'. */
const GESTO={
 preparacao:{acao:'Iniciar preparação',via:{pago:['confirmado'],realizado:['confirmado']},resp:['separador','logistica'],txt:'Ativa Pedido confirmado e Em preparação'},
 'aguardando-programacao':{acao:'Separado: deixar para a logística',via:{preparacao:['separacao']},resp:['separador','logistica'],txt:'Ativa Em separação e Aguardando programação de entrega'},
 programada:{acao:'Programar entrega',via:{},resp:['logistica'],txt:'Ativa Entrega programada'},
 'em-rota':{acao:'Saiu para entrega',via:{},resp:['logistica'],txt:'Ativa Saiu para entrega e prepara a mensagem com o link de pagamento'},
 entregue:{acao:'Marcar como entregue',via:{},resp:['logistica'],txt:'Ativa Entregue'}
};
const ACAO=Object.fromEntries(Object.entries(GESTO).map(([k,g])=>[k,g.acao]));
const RESP=Object.fromEntries(Object.entries(GESTO).map(([k,g])=>[k,g.resp]));
const PAPEL_NOME={admin:'Administração',logistica:'Logística',separador:'Separação'};
const respNome=s=>(RESP[s]||[]).map(p=>PAPEL_NOME[p]).join(' ou ');
const PROX={realizado:'preparacao',pago:'preparacao',confirmado:'preparacao',preparacao:'aguardando-programacao',separacao:'aguardando-programacao','aguardando-programacao':'programada',programada:'em-rota','em-rota':'entregue',tentativa:'programada'};
function proximoStatus(o){
  if(!ativo(o)||o.status==='entregue')return null;
  return PROX[o.status]||null;
}
const podeAvancar=s=>!!ADMIN&&!!RESP[s]&&(ADMIN.papel==='admin'||RESP[s].includes(ADMIN.papel));
function avancarPedido(id){
  const o=orders.find(x=>x.id===id);if(!o||!ADMIN)return false;
  const s=proximoStatus(o);
  if(!s){toast('Este pedido não tem próxima etapa.');return false}
  if(!podeAvancar(s)){toast('Esta etapa é da '+respNome(s)+'.');return false}
  if(['programada','em-rota'].includes(s)&&(!o.entrega.data||!o.entrega.turno)){toast('Defina data e turno antes.');return false}
  const via=(GESTO[s].via[o.status]||[]);
  via.forEach(v=>{setStatus(o,v,{})});
  setStatus(o,s,{});
  A.bp=A.bp||{q:'',oid:null,hist:[],erro:''};
  A.bp.hist.unshift({t:now(),cod:codigoPedido(o),acao:ACAO[s],ativou:via.concat([s]).map(x=>LAB[x]).join(' + '),por:ADMIN.nome});A.bp.hist=A.bp.hist.slice(0,8);
  toast(codigoPedido(o)+': '+via.concat([s]).map(x=>LAB[x]).join(' e ')+'. O cliente já vê.'+(s==='em-rota'?' A mensagem com o link de pagamento está pronta no pedido.':''));
  return true;
}
function admAvancar(id){if(avancarPedido(id))route()}
function admTentativa(id){
  const o=orders.find(x=>x.id===id);const mot=v_('tntM').trim();
  if(!o||!ADMIN||ADMIN.papel==='separador')return;
  if(o.status!=='em-rota'){toast('A tentativa só pode ser registrada em um pedido que saiu para entrega.');return}
  if(!mot){toast('Informe o motivo da tentativa sem sucesso.');return}
  setStatus(o,'tentativa',{motivo:mot});toast('Tentativa registrada. O cliente foi avisado.');route();
}
function avancarHtml(o){
  if(o.status==='cancelado')return '<div class="note err">Pedido cancelado.</div>';
  const s=proximoStatus(o);
  if(!s)return `<div class="note">Pedido ${LAB[o.status].toLowerCase()}. Não há próxima etapa.</div>`;
  const ok=podeAvancar(s);
  let h=`<div class="avanca"><div><small>Etapa atual</small><b>${LAB[o.status]}</b></div><div class="seta">&rarr;</div><div><small>Próxima etapa</small><b>${(GESTO[s].via[o.status]||[]).concat([s]).map(x=>LAB[x]).join(' + ')}</b></div>${ok?`<button class="btn acc" onclick="admAvancar(${o.id})">${ACAO[s]}</button>`:`<span class="note" style="margin:0">Etapa da ${respNome(s)}</span>`}</div>${ok?`<div class="bipsub" style="text-align:left">${GESTO[s].txt}.</div>`:''}`;
  if(o.status==='em-rota'&&ADMIN&&ADMIN.papel!=='separador')h+=`<div class="fr" style="margin-top:10px"><div class="c4"><label for="tntM">Entrega não concluída? Informe o motivo</label><input id="tntM" placeholder="Ex.: cliente ausente"></div><div class="c2" style="align-self:end"><button class="btn ghost sm" onclick="admTentativa(${o.id})">Registrar tentativa sem sucesso</button></div></div>`;
  return h;
}

/* ---------- padronização de endereço ---------- */
const ART=new Set(['de','da','do','das','dos','e','a','o']);
const ROMANO=/^(i{1,3}|iv|v|vi{0,3}|ix|x)$/;
const tc=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase().split(' ').map((w,i)=>ROMANO.test(w)?w.toUpperCase():(i>0&&ART.has(w))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const normEnd=a=>Object.assign({},a,{rua:tc(a.rua),bairro:tc(a.bairro),cidade:tc(a.cidade),uf:String(a.uf||'').toUpperCase()});
const fmtCep=v=>{const d=digits(v).slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d};
async function cepConsulta(d){
  try{const r=await fetch('https://viacep.com.br/ws/'+d+'/json/');if(!r.ok)throw new Error('http');const j=await r.json();if(j.erro)return {erro:'nf'};return {uf:j.uf,cidade:j.localidade,bairro:j.bairro,rua:j.logradouro}}catch(e){return {erro:'net'}}
}
/* map: ids dos campos. Cidade e UF ficam travadas depois de uma busca bem sucedida, para manter o padrão. */
async function cepAuto(el,map){
  el.value=fmtCep(el.value);const d=digits(el.value);
  const lock=(on)=>{const c=document.getElementById(map.cidade),u=document.getElementById(map.uf);if(c)c.readOnly=on;if(u){u.style.pointerEvents=on?'none':'';u.style.background=on?'#eee':''}};
  if(d.length!==8){lock(false);return}
  const r=await cepConsulta(d);if(digits(el.value)!==d)return;
  if(r.erro==='nf'){lock(false);toast('CEP não encontrado. Confira os números ou preencha o endereço.');return}
  if(r.erro){lock(false);toast('Não foi possível buscar o CEP agora. Preencha o endereço manualmente.');return}
  const set=(k,v)=>{const e=document.getElementById(map[k]);if(e&&v)e.value=v};
  set('uf',r.uf);set('cidade',r.cidade);set('bairro',r.bairro);set('rua',r.rua);lock(true);
  toast('Endereço preenchido pelo CEP. Falta só o número.');
  const n=document.getElementById(map.num);if(n)n.focus();
}
async function entCep(el){
  el.value=fmtCep(el.value);ent.s.cep=el.value;const d=digits(el.value);
  if(d.length!==8){ent.slock=false;return}
  const r=await cepConsulta(d);if(digits(el.value)!==d)return;
  if(r.erro==='nf'){ent.slock=false;toast('CEP não encontrado. Confira os números ou preencha o endereço.');return}
  if(r.erro){ent.slock=false;toast('Não foi possível buscar o CEP agora. Preencha o endereço manualmente.');return}
  Object.assign(ent.s,{uf:r.uf,cidade:r.cidade,bairro:r.bairro,rua:r.rua});ent.slock=true;route();
  setTimeout(()=>{const n=document.getElementById('sNum');if(n)n.focus()},60);
}

function saveEnd(e){e.preventDefault();

/* ---------- semáforo do pedido em aberto ---------- */
function nivelPedido(o){
  if(!ativo(o))return {n:-1,cor:'c',rot:'Cancelado',min:0,rest:Infinity,par:0};
  const H=36e5,par=(now()-ultimoMov(o))/H,fim=fimJanela(o),rest=fim?(fim-now())/H:Infinity;
  const venc=!!fim&&rest<0;
  let n=0;
  if(venc||par>LOG.atrasoHoras)n=3;else if(rest<6||par>LOG.alertaLaranja)n=2;else if(rest<24||par>LOG.alertaAmarelo)n=1;
  const min=Math.max(venc?-rest*60:0,par>LOG.atrasoHoras?(par-LOG.atrasoHoras)*60:0);
  return {n,cor:['v','a','l','r'][n],rot:['No prazo','Atenção','Quase atrasado','Atrasado'][n],min,rest,par,venc,forte:n===3&&(par>LOG.atrasoHoras*2||(venc&&rest<-24))};
}
const semDot=o=>{const s=nivelPedido(o);return `<span class="sem ${s.cor}${s.forte?' forte':''}" title="${s.rot}" role="img" aria-label="${s.rot}"></span>`};
function cmpUrgencia(a,b){
  const na=nivelPedido(a),nb=nivelPedido(b);
  if(nb.n!==na.n)return nb.n-na.n;
  if(na.n===3&&nb.min!==na.min)return nb.min-na.min;
  if(na.n>=0&&na.rest!==nb.rest&&isFinite(na.rest)&&isFinite(nb.rest))return na.rest-nb.rest;
  return a.at-b.at;
}
function tempoTxt(o){
  const s=nivelPedido(o);const p=[`aberto há ${dur((now()-o.at)/60000)}`];
  if(s.n===3){p.push(s.venc?`prazo vencido há ${dur(-s.rest*60)}`:`parado há ${dur(s.par*60)}`)}
  return p.join(' · ');
}

/* ---------- filtros por região (cidade e turno) ---------- */
const cidKey=o=>norm(o.entrega.dest.cidade)+'/'+String(o.entrega.dest.uf).toUpperCase();
const regiaoMatch=F=>o=>(!F.cid||cidKey(o)===F.cid)&&(!F.tur||o.entrega.turno===F.tur);
function fltSet(w,k,v,k2,v2){const F=w==='ab'?A.ab:A.fo;F[k]=k==='cid'?decodeURIComponent(v):v;if(k2)F[k2]=v2;route()}
function painelRegiao(base,F,w){
  const C={};const tT={manha:0,tarde:0,noite:0};
  base.forEach(o=>{const k=cidKey(o);const c=C[k]=C[k]||{n:0,nome:o.entrega.dest.cidade+'/'+String(o.entrega.dest.uf).toUpperCase(),t:{manha:0,tarde:0,noite:0}};c.n++;if(c.t[o.entrega.turno]!=null)c.t[o.entrega.turno]++;if(tT[o.entrega.turno]!=null)tT[o.entrega.turno]++});
  const chip=(ck,t,n,lab)=>`<a class="rgt ${F.cid===ck&&F.tur===t?'on':''}" onclick="fltSet('${w}','cid','${enc(ck)}','tur','${t}')">${lab} <b>${n}</b></a>`;
  const linhas=Object.keys(C).sort((a,b)=>C[b].n-C[a].n).map(ck=>{const c=C[ck];return `<div class="rgl ${F.cid===ck?'on':''}"><a class="rgn" onclick="fltSet('${w}','cid','${enc(ck)}','tur','')">${esc(c.nome)} <span class="cn">${c.n}</span></a><span>${chip(ck,'manha',c.t.manha,'Manhã')}${chip(ck,'tarde',c.t.tarde,'Tarde')}${chip(ck,'noite',c.t.noite,'Noite')}</span></div>`}).join('');
  return `<div class="box"><h3 style="margin-top:0">Por região</h3><div class="rgl ${!F.cid?'on':''}"><a class="rgn" onclick="fltSet('${w}','cid','','tur','')">Todas as cidades <span class="cn">${base.length}</span></a><span>${['manha','tarde','noite'].map(t=>`<a class="rgt ${!F.cid&&F.tur===t?'on':''}" onclick="fltSet('${w}','cid','','tur','${t}')">${TURNOS[t]} <b>${tT[t]}</b></a>`).join('')}</span></div>${linhas||'<p style="color:var(--muted);margin:6px 0 0">Nenhum pedido.</p>'}</div>`;
}

/* ---------- aba Em aberto ---------- */
function tabAberto(){
  A.ab=Object.assign({cid:'',tur:'',sem:'',pag:'todos'},A.ab);const F=A.ab;
  let base=orders.filter(o=>!FINAL.includes(o.status));
  if(F.pag==='pagos')base=base.filter(pago);else if(F.pag==='aguardando')base=base.filter(o=>!pago(o));
  const cont={v:0,a:0,l:0,r:0,c:0};base.forEach(o=>cont[nivelPedido(o).cor]++);
  let list=base.filter(regiaoMatch(F));if(F.sem)list=list.filter(o=>nivelPedido(o).cor===F.sem);
  list.sort(cmpUrgencia);
  const leg=[['r','Atrasado','prazo vencido ou parado há mais de '+LOG.atrasoHoras+' h'],['l','Quase atrasado','entrega em menos de 6 h ou parado há mais de '+LOG.alertaLaranja+' h'],['a','Atenção','entrega em menos de 24 h ou parado há mais de '+LOG.alertaAmarelo+' h'],['v','No prazo','pedido recente, dentro do prazo']];

/* ---------- aba Pedidos: período, região e busca ---------- */
function tabPedidos(){
  A.fo=Object.assign({q:'',st:'',per:'',cid:'',tur:'',pag:''},A.fo);const F=A.fo;
  const q=F.q.trim();const byCode=pedidoPorCodigo(q);
  const d0=hojeS(),d1=addDias(d0,-1),mes=d0.slice(0,7);const dOf=o=>ymd(new Date(o.at));
  let base=orders.slice();
  if(F.per==='hoje')base=base.filter(o=>dOf(o)===d0);else if(F.per==='ontem')base=base.filter(o=>dOf(o)===d1);else if(F.per==='mes')base=base.filter(o=>dOf(o).slice(0,7)===mes);
  if(F.pag==='pagos')base=base.filter(pago);else if(F.pag==='sem')base=base.filter(o=>!pago(o));
  let list=base.filter(regiaoMatch(F)).sort((a,b)=>b.at-a.at);
  if(F.st)list=list.filter(o=>o.status===F.st);
  if(q&&!byCode){const n=norm(q);list=list.filter(o=>String(o.id)===q.replace('#','')||norm(o.entrega.nome).includes(n)||norm(o.entrega.dest.cidade).includes(n))}
  if(byCode)list=[byCode];
  const per=[['','Todos'],['hoje','Hoje'],['ontem','Ontem'],['mes','Neste mês']];
  return `<div class="box"><div class="semleg" style="margin:0 0 10px">${per.map(p=>`<a class="${F.per===p[0]?'on':''}" onclick="A.fo.per='${p[0]}';route()">${p[1]}</a>`).join('')}</div>
  <div class="fr" style="margin-bottom:10px"><div class="c4"><label for="foq">Buscar por número, nome, cidade ou código de barras</label><input id="foq" value="${esc(F.q)}" placeholder="Ex.: 105, Maria, Caçapava ou ZP-000105" onkeydown="if(event.key==='Enter'){A.fo.q=this.value;route()}"></div><div class="c2"><label for="fop">Pagamento</label><select id="fop" style="width:100%" onchange="A.fo.pag=this.value;route()"><option value="">Todos</option><option value="pagos" ${F.pag==='pagos'?'selected':''}>Pagos</option><option value="sem" ${F.pag==='sem'?'selected':''}>Sem pagamento</option></select></div><div class="c2"><label for="fos">Status</label><select id="fos" style="width:100%" onchange="A.fo.st=this.value;route()"><option value="">Todos</option>${Object.keys(LAB).map(s=>`<option value="${s}" ${F.st===s?'selected':''}>${LAB[s]}</option>`).join('')}</select></div></div>
  <p><button class="btn sm" onclick="A.fo.q=v_('foq');route()">Buscar</button> ${byCode?'<span class="st s-confirmado">Pedido localizado pelo código de barras</span>':''}</p></div>
  <div class="two" style="grid-template-columns:.7fr 1.3fr;margin-top:14px"><div>${painelRegiao(base,F,'fo')}</div><div class="box"><h3 style="margin-top:0">${list.length} pedido${list.length!==1?'s':''}</h3>
  ${list.length?`<div class="tbl"><table><thead><tr><th></th><th>Pedido</th><th>Cliente</th><th>Cidade</th><th>Entrega</th><th>Status</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td>${FINAL.includes(o.status)?'':semDot(o)}</td><td><b>${codigoPedido(o)}</b><div style="color:var(--muted);font-size:.78rem">${fmtD(o.at)}</div></td><td>${esc(o.entrega.nome)}</td><td>${esc(o.entrega.dest.cidade)}/${esc(String(o.entrega.dest.uf).toUpperCase())}</td><td>${fmtDM(o.entrega.data)} ${turnoNome(o.entrega.turno)}</td><td><span class="st ${CLS[o.status]}">${LAB[o.status]}</span>${flags(o)}</td><td class="r"><button class="btn sm" onclick="admAbrir(${o.id})">Abrir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="note">Nenhum pedido encontrado.</div>'}</div></div>`;
}

/* ---------- alterações do pedido: o cliente é avisado e a loja já fica com a mensagem pronta ---------- */
function notificarAlteracao(o,a){
  const texto='Seu pedido '+codigoPedido(o)+' foi alterado. '+a.titulo+': '+a.detalhe+'.';
  const ev=addEv(o,{tipo:a.tipo,publico:true,texto:a.titulo+': '+a.detalhe+'.',de:a.de||'',para:a.para||'',motivo:a.motivo});
  addAviso(o,'Seu pedido foi alterado',texto,{motivo:a.motivo,evId:ev.id});
  const prim=o.entrega.nome.split(' ')[0];
  o.waRea={t:now(),texto:`Olá, ${prim}! O seu pedido ${codigoPedido(o)} sofreu uma alteração.\n\n${a.titulo}: ${a.detalhe}.\nMotivo: ${a.motivo}.\n\nVocê pode acompanhar todas as atualizações diretamente em nossa plataforma. Qualquer dúvida, é só responder esta mensagem.`};
}

/* ---------- rota prevista para o cliente, a partir da preparação ---------- */
function rotaCliente(o){
  if(!['preparacao','separacao','aguardando-programacao','programada','em-rota','tentativa'].includes(o.status))return '';
  const r=ROTAS[rotaKey(o)];const e=o.entrega;const rota=o.status==='em-rota';
  if(!(r&&r.lista&&r.lista.length))return rota?'<div class="rota"><b>Saiu para entrega</b><div>Previsão: <b>'+fmtDay(e.data)+', '+turnoNome(e.turno)+'</b></div><div style="margin-top:6px;color:var(--muted);font-size:.85rem">A sequência da rota ainda não foi divulgada.</div></div>':'';
  const meu=norm(e.dest.bairro);const i=r.lista.findIndex(l=>norm(l)===meu);
  const hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
  let est='';
  if(r.saida&&/^\d{2}:\d{2}$/.test(r.saida)&&i>=0){const [h,mi]=r.saida.split(':').map(Number);est=`<div style="margin-top:8px">Chegada aproximada na sua região: <b>por volta das ${hhmm(h*60+mi+(i+1)*(r.min||20))}</b></div><div style="font-size:.8rem;color:var(--muted)">Horário estimado, não garantido. A entrega pode chegar mais cedo ou mais tarde.</div>`}
  return `<div class="rota"><b>${rota?'Saiu para entrega':'Rota prevista da sua região'}</b><div>Previsão: <b>${fmtDay(e.data)}, ${turnoNome(e.turno)}</b></div><div style="margin-top:6px;color:var(--muted);font-size:.85rem">Sequência planejada (aproximada):</div><ol class="rota-l">${r.lista.map((l,k)=>`<li class="${rota&&k<=r.atual?'ok':''} ${norm(l)===meu?'meu':''}">${esc(l)}${norm(l)===meu?' <small>(sua região)</small>':''}${rota&&k===r.atual?' <small>andamento atual</small>':''}</li>`).join('')}</ol>${est}<div class="rota-aviso">Rota planejada pela loja. Não é a localização em tempo real do entregador.</div></div>`;
}

/* ---------- telefone: (XX) 9 XXXX-XXXX, ou (XX) XXXX-XXXX para quem não tem o 9 ---------- */
const DDDS=new Set('11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' '));
function fmtFone(d,sem9){
  d=String(d||'');if(!d)return '';if(d.length<=2)return '('+d;
  const ddd=d.slice(0,2),r=d.slice(2);
  if(sem9)return '('+ddd+') '+r.slice(0,4)+(r.length>4?'-'+r.slice(4):'');
  return '('+ddd+') '+r[0]+(r.length>1?' '+r.slice(1,5):'')+(r.length>5?'-'+r.slice(5):'');
}
function foneMask(el,sem9){
  let d=digits(el.value);
  if(!sem9&&d.length>=3&&d[2]!=='9')d=d.slice(0,2)+'9'+d.slice(2);
  d=d.slice(0,sem9?10:11);el.value=fmtFone(d,sem9);
}
function foneToggle9(idCampo,sem9){
  const el=document.getElementById(idCampo);if(!el)return;let d=digits(el.value);
  if(sem9){if(d.length>2&&d[2]==='9')d=d.slice(0,2)+d.slice(3)}else if(d.length>2&&d[2]!=='9')d=d.slice(0,2)+'9'+d.slice(2);
  d=d.slice(0,sem9?10:11);el.value=fmtFone(d,sem9);el.placeholder=sem9?'(12) 8888-7777':'(12) 9 8888-7777';el.focus();
}
/* devolve '' se válido, ou a mensagem de erro */
function foneErro(v,sem9){
  const d=digits(v);
  if(d.length!==(sem9?10:11))return 'Informe o telefone completo, com DDD'+(sem9?'':' e o 9 na frente')+'.';
  if(!DDDS.has(d.slice(0,2)))return 'O DDD informado não existe. Confira o telefone.';
  if(!sem9&&d[2]!=='9')return 'O celular precisa ter o 9 depois do DDD.';
  const rest=d.slice(sem9?2:3);
  if(/^(\d)\1+$/.test(rest))return 'Esse telefone não parece válido. Confira os números.';
  if(sem9&&!/[2-9]/.test(rest[0]))return 'Esse telefone não parece válido. Confira os números.';
  return '';
}
const foneOk=v=>{const d=digits(v);return (d.length===10||d.length===11)&&DDDS.has(d.slice(0,2))};
function foneCampo(id,valor,sem9){
  return `<input id="${id}" type="tel" required inputmode="numeric" autocomplete="tel-national" placeholder="${sem9?'(12) 8888-7777':'(12) 9 8888-7777'}" value="${esc(valor||'')}" oninput="foneMask(this,document.getElementById('${id}n9').checked)"><label style="font-weight:500;font-size:.88rem;margin-top:6px"><input type="checkbox" id="${id}n9" style="width:auto" ${sem9?'checked':''} onchange="foneToggle9('${id}',this.checked)"> Meu número não tem o 9 na frente</label>`;
}

/* ---------- visão geral: painel executivo ---------- */
function chartBars2(labels,vals,vals2,c1,c2){
  const W=560,H=190,pb=28,pt=14,pl=26,mx=Math.max(1,...vals);const bw=(W-pl-8)/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Gráfico de barras: total de pedidos e pagos">`;

  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/mx,h2=(H-pt-pb)*vals2[i]/mx;const x=pl+i*bw+bw*0.15;s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*0.7}" height="${h}" rx="3" fill="${c1}"><title>${labels[i]}: ${v} pedidos, ${vals2[i]} pagos</title></rect><rect x="${x+bw*0.12}" y="${H-pb-h2}" width="${bw*0.46}" height="${h2}" rx="2" fill="${c2}"/>${v?`<text x="${x+bw*0.35}" y="${H-pb-h-3}" font-size="9" text-anchor="middle" fill="#555">${v}</text>`:''}<text x="${x+bw*0.35}" y="${H-10}" font-size="9" text-anchor="middle" fill="#777">${labels[i]}</text>`});

/* ======================= PAGAMENTO POR LINK, NA ROTA =======================
   O valor é combinado antes (com a taxa de entrega). O cliente paga por um link, enviado quando o pedido entra em rota.
   Nada de gateway: a loja registra o recebimento. */
const PAGST={pendente:['Pagar por link na rota','amarelo'],link:['Link enviado','amarelo'],pago:['Pagamento recebido','verde']};
const pago=o=>!!(o&&o.pagamento&&o.pagamento.status==='pago');
const ativo=o=>!!o&&o.status!=='cancelado';
const FORMAS={credito:'Cartão de crédito',debito:'Cartão de débito',pix:'Pix',outro:'Outro'};
const taxaEnt=o=>+((o.pagamento||{}).taxaEntrega)||0;
const valorAcordado=o=>+(total(o)+taxaEnt(o)).toFixed(2);
function pagLabel(p){return p&&p.forma?FORMAS[p.forma]+(p.forma==='credito'&&p.parcelas>1?' em '+p.parcelas+'x':''):'Link de pagamento'}
function pagTxt(o){const p=o.pagamento||{};return {metodo:pagLabel(p),status:(PAGST[p.status]||['Não definido'])[0]}}
function pagChip(o){const p=o.pagamento;if(!p)return '';const s=PAGST[p.status]||['',''];return `<span class="st pg-${s[1]}">${s[0]}</span>`}
function tokenNovo(){return Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8)}
function migPag(o){
  let ch=false;const p=o.pagamento;
  if(!o.token){o.token=tokenNovo();ch=true}
  if(p&&p.modo==='link')return ch;
  const ap=p&&(p.status==='aprovado'||p.status==='Confirmado');
  const forma={pix:'pix',credito:'credito',debito:'debito'}[p&&p.metodo]||'outro';
  o.pagamento={modo:'link',status:ap?'pago':'pendente',taxaEntrega:0};
  if(ap){const bruto=o.items.reduce((s,i)=>s+i.unit*i.qty,0)-(o.disc?o.disc.valor:0);Object.assign(o.pagamento,{forma,parcelas:(p&&p.parcelas)||1,bruto,taxaPct:0,taxaValor:0,liquido:bruto,pagoEm:(p&&p.aprovadoEm)||o.at,prevRepasse:null,repassado:false})}
  return true;
}
const urlAcompanhar=o=>location.href.split('#')[0]+'#/acompanhar/'+codigoPedido(o)+'/'+(o.token||'');
function msgLinkCliente(o){
  const prim=String(o.entrega.nome||'').split(' ')[0];const taxa=taxaEnt(o);
  return `Olá, ${prim}! Seu pedido já está em rota para entrega! 🚚\n\nConforme combinado, o pagamento deverá ser realizado pelo link abaixo, no valor acordado, incluindo a taxa de entrega informada anteriormente.\n\nPedido: ${codigoPedido(o)}\nValor a pagar: ${brl(valorAcordado(o))}${taxa>0?' (produtos '+brl(total(o))+' + entrega '+brl(taxa)+')':''}\n\nAcompanhe seu pedido e realize o pagamento pelo link:\n${urlAcompanhar(o)}`;

/* ---------- o que o cliente vê sobre o pagamento ---------- */
function payCliente(o){
  const p=o.pagamento||{};const v=valorAcordado(o);const link=o._link||CFG.linkPag;const taxa=taxaEnt(o);
  if(pago(o))return `<div class="paybox ok"><b>Pagamento recebido</b><div>${p.pagoEm?'Recebido em '+fmtD(p.pagoEm)+'. ':''}Obrigado!</div></div>`;
  if(o.status==='cancelado')return '';
  const valor=`<div style="margin:6px 0 0"><b>Valor combinado: ${brl(v)}</b>${taxa>0?' (produtos '+brl(total(o))+' + entrega '+brl(taxa)+')':''}</div>`;
  if(!['em-rota','entregue','tentativa'].includes(o.status))return `<div class="paybox wait"><b>Como será o pagamento</b><p style="margin:6px 0 0">O valor combinado será pago por um link de pagamento que enviamos quando o seu pedido entrar em rota para entrega. Você não precisa pagar agora.</p>${valor}</div>`;
  return `<div class="paybox wait"><b>Seu pedido está em rota. Chegou a hora de pagar.</b>${valor}<p style="margin:6px 0 8px">Pague pelo link abaixo, no valor combinado${taxa>0?', já com a taxa de entrega':''}.</p>${link?`<a class="btn acc" href="${esc(link)}" target="_blank" rel="noopener">Pagar ${brl(v)} agora</a>`:'<div class="note warn" style="margin:0">O link de pagamento ainda não foi disponibilizado. Fale com o atendimento.</div>'}</div>`;
}

/* ---------- regras operacionais (não dependem mais de pagamento prévio) ---------- */
function atraso(o){
  if(FINAL.includes(o.status))return null;const r=[];
  const horas=(now()-ultimoMov(o))/36e5;
  if(horas>LOG.atrasoHoras)r.push({tipo:'sem-movimento',min:Math.round((horas-LOG.atrasoHoras)*60)});
  const fim=fimJanela(o);if(fim&&now()>fim)r.push({tipo:'janela',min:Math.round((now()-fim)/60000)});
  if(!r.length)return null;
  return {r,horas,min:Math.max(...r.map(x=>x.min)),janela:r.some(x=>x.tipo==='janela'),sem:r.some(x=>x.tipo==='sem-movimento')};
}
function lgOrders(){return orders.filter(o=>ativo(o)&&(A.lgAll||!FINAL.includes(o.status)))}
function flags(o){
  let f='';const at=atraso(o);
  if(['em-rota','entregue','tentativa'].includes(o.status)&&!pago(o))f+=' <span class="st pg-vermelho">Pagamento pendente</span>';
  if(at)f+=` <span class="st s-falha">${at.janela?'Prazo vencido':'Sem movimentação'}</span>`;
  if(reagendados(o))f+=' <span class="st s-prog">Reagendado</span>';
  if(etqStale(o)&&(o.etiquetas||[]).length)f+=' <span class="st s-aguardando">Etiqueta desatualizada</span>';
  return f;
}
function alertas(){
  const A_=[];
  orders.forEach(o=>{
    if(o.status==='cancelado')return;
    if(o.status==='entregue'&&!pago(o))A_.push({id:'semp:'+o.id,sev:'critico',tipo:'Entregue sem pagamento recebido',o,t:ultimoMov(o)});
    if(FINAL.includes(o.status))return;
    if(o.status==='realizado')A_.push({id:'novo:'+o.id,sev:'info',tipo:'Novo pedido recebido',o,t:o.at});
    if(['confirmado','preparacao'].includes(o.status))A_.push({id:'sep:'+o.id+':'+o.status,sev:'atencao',tipo:'Pedido aguardando separação',o,t:ultimoMov(o)});
    if(o.status==='em-rota'&&o.pagamento&&o.pagamento.status==='pendente')A_.push({id:'link:'+o.id,sev:'atencao',tipo:'Em rota sem link de pagamento enviado',o,t:ultimoMov(o)});
    const at=atraso(o);
    if(at&&at.sem)A_.push({id:'mov:'+o.id+':'+Math.floor(ultimoMov(o)/1000),sev:'critico',tipo:'Pedido sem movimentação há mais de '+LOG.atrasoHoras+' h',o,t:ultimoMov(o)});
    if(at&&at.janela)A_.push({id:'prazo:'+o.id+':'+o.entrega.data+o.entrega.turno,sev:'critico',tipo:'Entrega com prazo ultrapassado',o,t:fimJanela(o)});
    const rg=(o.eventos||[]).filter(e=>e.tipo==='reagendado').pop();
    if(rg)A_.push({id:'rea:'+o.id+':'+rg.id,sev:'atencao',tipo:'Pedido reagendado',o,t:rg.t});
    if(o.status==='programada'&&o.entrega.data&&o.entrega.data<=hojeS())A_.push({id:'saida:'+o.id+':'+o.entrega.data,sev:'atencao',tipo:'Pedido aguardando saída para entrega',o,t:now()});
  });
  const ord={critico:0,atencao:1,info:2};
  return A_.sort((a,b)=>ord[a.sev]-ord[b.sev]||b.t-a.t);
}

  return `<h3 style="margin-top:0">Pagamento por link, na rota</h3><div class="paybox ${pago(o)?'ok':'wait'}" style="margin:0 0 10px"><b>${s[0]}</b> · ${temSPo(o)?'Valor a confirmar':'Valor '+brl(valorAcordado(o))}<div style="font-size:.8rem;color:var(--muted)">Produtos ${brl(total(o))} + taxa de entrega ${brl(taxaEnt(o))}</div></div>

function admTaxa(id){

/* ---------- registro do pagamento recebido ---------- */
const PGDEF={taxaCredito:3.5,taxaDebito:1.5,taxaPix:0,prazoCredito:30,prazoDebito:1,prazoPix:0};
const pgcfg=()=>Object.assign({},PGDEF,DB.get('pgcfg',{}));
function pgAbrir(id){
  const o=orders.find(x=>x.id===id);if(!o)return;const c=pgcfg();const v=valorAcordado(o);
  openModal(`<h3 style="margin-top:0">Registrar pagamento recebido</h3><p style="margin:0 0 8px;color:var(--muted)">Pedido ${codigoPedido(o)} · valor combinado ${brl(v)}</p>
   <div class="fr"><div class="c2"><label for="pgF">Forma</label><select id="pgF" style="width:100%" onchange="pgForma()">${Object.keys(FORMAS).map(k=>`<option value="${k}" ${k==='credito'?'selected':''}>${FORMAS[k]}</option>`).join('')}</select></div><div class="c2" id="pgPw"><label for="pgP">Parcelas</label><input id="pgP" type="number" min="1" max="12" value="1"></div>
   <div class="c2"><label for="pgB">Valor recebido (R$)</label><input id="pgB" type="number" min="0" step="0.01" value="${v}"></div>
   <div class="c2"><label for="pgT">Taxa do provedor (%)</label><input id="pgT" type="number" min="0" max="30" step="0.01" value="${c.taxaCredito}"></div>
   <div class="c2"><label for="pgD">Previsão de repasse</label><input id="pgD" type="date" value="${addDias(hojeS(),c.prazoCredito)}"></div></div>
   <p style="font-size:.78rem;color:var(--muted)">A taxa e o prazo vêm das estimativas da aba Pagamentos. Ajuste com os valores reais do seu provedor.</p>
   <p style="text-align:right"><button class="btn ghost" onclick="closeModal()">Cancelar</button> <button class="btn acc" onclick="pgSalvar(${o.id})">Registrar</button></p>`);
}
function pgForma(){
  const c=pgcfg(),f=v_('pgF');const m={credito:[c.taxaCredito,c.prazoCredito],debito:[c.taxaDebito,c.prazoDebito],pix:[c.taxaPix,c.prazoPix],outro:[0,0]}[f];
  document.getElementById('pgT').value=m[0];document.getElementById('pgD').value=addDias(hojeS(),m[1]);document.getElementById('pgPw').style.display=f==='credito'?'':'none';
}
function pgSalvar(id){
  const o=orders.find(x=>x.id===id);if(!o||!ADMIN)return;
  const f=v_('pgF');const parc=f==='credito'?Math.max(1,Math.min(12,parseInt(v_('pgP'),10)||1)):1;
  const bruto=+v_('pgB'),tx=+v_('pgT'),prev=v_('pgD');
  if(!(bruto>0)){toast('Informe o valor recebido.');return}
  if(!(tx>=0&&tx<=30)){toast('A taxa deve ficar entre 0% e 30%.');return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(prev)){toast('Informe a previsão de repasse.');return}
  const taxaValor=+(bruto*tx/100).toFixed(2);
  Object.assign(o.pagamento,{status:'pago',forma:f,parcelas:parc,bruto:+bruto.toFixed(2),taxaPct:tx,taxaValor,liquido:+(bruto-taxaValor).toFixed(2),pagoEm:now(),prevRepasse:prev,repassado:false});
  const ev=addEv(o,{tipo:'pagamento',publico:true,texto:'Pagamento recebido: '+pagLabel(o.pagamento)+'.'});
  addAviso(o,'Pagamento recebido','Recebemos o pagamento do pedido '+codigoPedido(o)+'. Obrigado!',{evId:ev.id});
  closeModal();save();toast('Pagamento registrado.');route();
}
function pgDesfazer(id){
  const o=orders.find(x=>x.id===id);if(!o||!ADMIN||ADMIN.papel!=='admin'||o.pagamento.repassado)return;
  if(!confirm('Desfazer o registro de pagamento deste pedido?'))return;
  const p=o.pagamento;['forma','parcelas','bruto','taxaPct','taxaValor','liquido','pagoEm','prevRepasse','repassado'].forEach(k=>delete p[k]);
  p.status=p.linkEnviadoEm?'link':'pendente';
  addEv(o,{tipo:'pagamento',publico:false,texto:'Registro de pagamento desfeito'});save();toast('Registro desfeito.');route();
}

const sitPag=o=>!pago(o)?'aguardando':(o.pagamento.repassado?'repassado':'repassar');
function pgFiltro(k,v){A.pg=Object.assign({per:'mes',forma:'',st:'',sel:[]},A.pg);A.pg[k]=v;if(k!=='sel')A.pg.sel=[];route()}
function pgTog(id,on){A.pg.sel=A.pg.sel.filter(x=>x!==id);if(on)A.pg.sel.push(id);route()}
function pgCfgSalvar(){
  const n=k=>+String(v_(k)).replace(',','.');const c={taxaCredito:n('cfC'),taxaDebito:n('cfD'),taxaPix:n('cfX'),prazoCredito:n('cfPC'),prazoDebito:n('cfPD'),prazoPix:n('cfPX')};
  if(![c.taxaCredito,c.taxaDebito,c.taxaPix].every(x=>x>=0&&x<=30)||![c.prazoCredito,c.prazoDebito,c.prazoPix].every(x=>x>=0&&x<=365&&Number.isInteger(x))){toast('Confira as taxas (0 a 30%) e os prazos (0 a 365 dias, números inteiros).');return}
  DB.set('pgcfg',c);toast('Estimativas salvas.');route();
}
function retSalvar(){
  A.pg=Object.assign({per:'mes',forma:'',st:'',sel:[]},A.pg);
  const ids=A.pg.sel.filter(id=>{const o=orders.find(x=>x.id===id);return o&&pago(o)&&!o.pagamento.repassado});

  RETIR.push(r);A.pg.sel=[];save();toast('Retirada registrada: '+brl(total_)+' líquidos.');route();
}
function retDesfazer(id){
  const r=RETIR.find(x=>x.id===id);if(!r||!confirm('Desfazer a retirada nº '+r.n+'? Os pagamentos voltam para "A repassar".'))return;
  r.pedidos.forEach(oid=>{const o=orders.find(x=>x.id===oid);if(o&&o.pagamento){o.pagamento.repassado=false;delete o.pagamento.retiradaId;addEv(o,{tipo:'pagamento',publico:false,texto:'Retirada nº '+r.n+' desfeita'})}});

/* ---------- entregadores ---------- */
const rotaCod=r=>'R-'+String(r.n).padStart(3,'0');
function rotaStats(r){
  const os=r.orders.map(id=>orders.find(x=>x.id===id)).filter(Boolean);
  return {os,qtd:os.length,entregues:os.filter(o=>o.status==='entregue').length,valor:os.reduce((s,o)=>s+valorAcordado(o),0),taxas:os.reduce((s,o)=>s+taxaEnt(o),0),recebido:os.filter(pago).reduce((s,o)=>s+valorAcordado(o),0)};
}
function rotaSit(r){
  const s=rotaStats(r);
  if(s.qtd&&s.os.every(o=>FINAL.includes(o.status)))return 'Concluída';
  if(s.os.some(o=>o.status==='em-rota'||o.status==='tentativa'))return 'Em rota';
  return r.enviadaEm?'Enviada ao entregador':'Montada';
}
function entStats(e){
  let ped=0,ent=0,val=0,tx=0;const rs=ROTE.filter(r=>r.entregadorId===e.id);
  rs.forEach(r=>{const s=rotaStats(r);ped+=s.qtd;s.os.filter(o=>o.status==='entregue').forEach(o=>{ent++;val+=valorAcordado(o);tx+=taxaEnt(o)})});
  return {rotas:rs.length,ped,ent,val,tx};
}
const entNome=id=>{const e=ENTR.find(x=>x.id===id);return e?e.nome:'(removido)'};
function entSalvar(){
  A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);
  const nome=tc(v_('enN'));const sem9=c_('enWn9');const w=v_('enW');
  if(nome.length<2){toast('Informe o nome do entregador.');return}
  const er=foneErro(w,sem9);if(er){toast(er);return}
  const dig=digits(w);
  if(ENTR.some(x=>digits(x.whats)===dig&&x.id!==A.ent.edit)){toast('Já existe um entregador com este WhatsApp.');return}
  if(A.ent.edit){const e=ENTR.find(x=>x.id===A.ent.edit);if(e){e.nome=nome;e.whats=w;e.sem9=sem9}A.ent.edit=null;toast('Entregador atualizado.')}
  else{ENTR.push({id:'E'+Date.now().toString(36),nome,whats:w,sem9,ativo:true,criadoEm:now()});toast('Entregador cadastrado.')}
  save();route();
}
function entEditar(id){A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);A.ent.edit=id;route()}
function entCancelar(){A.ent.edit=null;route()}
function entToggle(id){const e=ENTR.find(x=>x.id===id);if(e){e.ativo=e.ativo===false;save();route()}}
function entHist(id){A.ent.hist=A.ent.hist===id?null:id;route()}
function rotaAbrir(id){A.ent=Object.assign({edit:null,hist:null,rota:null},A.ent);A.ent.rota=id;A.tab='entregadores';A.ord=null;route();window.scrollTo(0,0)}
function rotaVoltar(){A.ent.rota=null;route()}
function rotaMsg(r){
  const en=ENTR.find(x=>x.id===r.entregadorId)||{nome:''};const os=r.orders.map(id=>orders.find(x=>x.id===id)).filter(Boolean);
  const L=[`*Rota ${rotaCod(r)}* (${fmtDay(r.data)})`,`Entregador: ${en.nome}`,`Pedidos: ${os.length}`,''];
  os.forEach((o,i)=>{
    const e=o.entrega,d=e.dest;
    L.push(`*${i+1}) ${codigoPedido(o)}* | ${e.nome}`,`Tel.: ${e.fone}`,`Endereço: ${d.rua}, ${d.num}${d.comp?', '+d.comp:''}, ${d.bairro}, ${d.cidade}/${String(d.uf).toUpperCase()}, CEP ${d.cep}`);
    if(d.ref)L.push('Referência: '+d.ref);
    L.push(`Entrega: ${fmtDM(e.data)}, ${turnoNome(e.turno)}${e.janela?' ('+e.janela+')':''}`,'Itens: '+o.items.map(i=>i.qty+'x '+(i.base||i.name)).join('; '));
    if(e.obs)L.push('Obs. do cliente: '+e.obs);
    if(e.obsEntregador)L.push('Obs. para o entregador: '+e.obsEntregador);
    L.push('Pagamento: o cliente paga pelo link, não cobrar na entrega','');
  });
  return L.join('\n').trim();
}
function rotaEnviarWA(rid){
  const r=ROTE.find(x=>x.id===rid);if(!r)return;const en=ENTR.find(x=>x.id===r.entregadorId);if(!en){toast('Entregador não encontrado.');return}
  const campo=document.getElementById('rotaMsgT');const t=campo?campo.value:rotaMsg(r);if(!t.trim()){toast('A mensagem está vazia.');return}
  window.open('https://wa.me/55'+digits(en.whats).replace(/^55/,'')+'?text='+encodeURIComponent(t),'_blank');
  r.enviadaEm=now();r.orders.forEach(id=>{const o=orders.find(x=>x.id===id);if(o)addEv(o,{tipo:'whatsapp',publico:false,texto:'Rota '+rotaCod(r)+' enviada ao entregador '+en.nome+' (envio não confirmado pelo sistema)'})});
  save();toast('Conversa aberta com '+en.nome+'. O envio é feito por você no WhatsApp.');route();
}
function rotaIniciar(rid){
  const r=ROTE.find(x=>x.id===rid);if(!r||!ADMIN||ADMIN.papel==='separador')return;
  const alvo=r.orders.map(id=>orders.find(x=>x.id===id)).filter(o=>o&&o.status==='programada');
  if(!alvo.length){toast('Não há pedidos "Entrega programada" nesta rota.');return}
  if(!confirm('Marcar '+alvo.length+' pedido(s) como "Saiu para entrega"? Cada cliente fica com a mensagem do link de pagamento pronta para enviar.'))return;
  alvo.forEach(o=>setStatus(o,'em-rota',{}));r.saiuEm=now();save();toast(alvo.length+' pedido(s) em rota. Envie o link de pagamento a cada cliente.');route();
}

function admReag(id){
  const o=gO(id),d=v_('rD'),t=v_('rT'),mot=v_('rM').trim();
  if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)||d<hojeS()){toast('Informe uma nova data válida (hoje ou futura).');return}
  if(!TURNOS[t]){toast('Turno inválido.');return}

  const de=fmtDM(o.entrega.data)+' ('+turnoNome(o.entrega.turno)+')',para=fmtDM(d)+' ('+turnoNome(t)+')';
  if(o.entrega.data===d&&o.entrega.turno===t){toast('A data e o turno são os mesmos.');return}

  const txt='Entrega reagendada de '+de+' para '+para+'. Motivo: '+mot+'.';

}

function admEditEntrega(id){

  cmp('telefone',e.fone,v_('eF'));cmp('CEP',d.cep,n.cep);cmp('UF',d.uf,n.uf);cmp('cidade',d.cidade,n.cidade);cmp('bairro',d.bairro,n.bairro);cmp('rua',d.rua,n.rua);cmp('número',d.num,n.num);cmp('complemento',d.comp,n.comp);cmp('referência',d.ref,n.ref);cmp('janela',e.janela,v_('eJan').trim());cmp('obs. entregador',e.obsEntregador!=null?e.obsEntregador:e.obs,v_('eObsE').trim());

function admItens(id){
  const o=gO(id),mot=v_('imot').trim();const novos=o.items.map((i,k)=>Math.max(0,parseInt(v_('iq'+k)||0,10)||0));
  if(novos.every((q,k)=>q===o.items[k].qty)){toast('Nenhuma quantidade foi alterada.');return}
  if(novos.every(q=>q===0)){toast('Para remover todos os itens, cancele o pedido.');return}
  if(!mot){toast('Informe o motivo da alteração.');return}
  for(let k=0;k<novos.length;k++){const p=byId(o.items[k].id);const outros=o.reduced?o.items[k].qty:0;if(p&&novos[k]>stockLeft(p)+outros){toast('Estoque insuficiente para '+p.n+'.');return}}
  const de=o.items.map(i=>i.qty+'x '+(i.base||i.name)).join(', ');const totAntes=total(o);
  o.items.forEach((i,k)=>{i.qty=novos[k]});o.items=o.items.filter(i=>i.qty>0);
  if(o.disc){o.disc.valor=+(subtotal(o)*o.disc.pct/100).toFixed(2)}
  const para=o.items.map(i=>i.qty+'x '+(i.base||i.name)).join(', ');const totDepois=total(o);
  notificarAlteracao(o,{tipo:'itens',titulo:'Itens alterados',detalhe:'antes '+de+', agora '+para+'. Novo total: '+brl(totDepois),motivo:mot,de,para});
  if(pago(o)&&Math.abs(totDepois-totAntes)>0.004)addEv(o,{tipo:'pagamento',publico:false,texto:'Total alterado de '+brl(totAntes)+' para '+brl(totDepois)+' em pedido já pago: acertar a diferença de '+brl(Math.abs(totDepois-totAntes))+(totDepois<totAntes?' (estorno parcial)':' (cobrança adicional)')+' com o provedor.',motivo:mot});
  save();toast('Itens salvos. O cliente foi avisado e a mensagem de WhatsApp está pronta.'+(pago(o)&&totDepois!==totAntes?' Pedido já pago: acerte a diferença de '+brl(Math.abs(totDepois-totAntes))+' com o provedor.':'')+' Gere a etiqueta atualizada.');route();
}

function lgSel(uf,cid,data,turno){A.lg={uf:uf||'',cid:cid||'',data:data||'',turno:turno||''};route()}
function lgMatch(o){
  const d=o.entrega.dest,L=A.lg;
  return (!L.uf||String(d.uf).toUpperCase()===L.uf)&&(!L.cid||norm(d.cidade)===L.cid)&&(!L.data||o.entrega.data===L.data)&&(!L.turno||o.entrega.turno===L.turno);
}
function tabLogistica(){
  const T={};
  lgOrders().forEach(o=>{
    const d=o.entrega.dest,uf=String(d.uf).toUpperCase(),ck=norm(d.cidade);
    const U=T[uf]=T[uf]||{n:0,c:{}};U.n++;
    const C=U.c[ck]=U.c[ck]||{n:0,nome:d.cidade,d:{}};C.n++;
    const D=C.d[o.entrega.data]=C.d[o.entrega.data]||{n:0,t:{}};D.n++;
    D.t[o.entrega.turno]=(D.t[o.entrega.turno]||0)+1;
  });
  const L=A.lg;
  const tree=Object.keys(T).sort().map(uf=>`<details open><summary><b>${uf}</b> <span class="cn">${T[uf].n}</span></summary>${Object.keys(T[uf].c).sort().map(ck=>{const C=T[uf].c[ck];return `<details class="sub" ${L.uf===uf&&L.cid===ck?'open':''}><summary onclick="event.preventDefault();lgSel('${uf}','${ck}')" class="${L.uf===uf&&L.cid===ck&&!L.data?'on':''}">${esc(C.nome)} <span class="cn">${C.n}</span></summary>${Object.keys(C.d).sort().map(dt=>`<details class="sub2" ${L.cid===ck&&L.data===dt?'open':''}><summary onclick="event.preventDefault();lgSel('${uf}','${ck}','${dt}')" class="${L.cid===ck&&L.data===dt&&!L.turno?'on':''}">${fmtDM(dt)} <span class="cn">${C.d[dt].n}</span></summary>${['manha','tarde','noite'].filter(t=>C.d[dt].t[t]).map(t=>`<a class="${L.cid===ck&&L.data===dt&&L.turno===t?'on':''}" onclick="lgSel('${uf}','${ck}','${dt}','${t}')">${fmtDM(dt)}, ${TURNOS[t]} <span class="cn">${C.d[dt].t[t]}</span></a>`).join('')}</details>`).join('')}</details>`}).join('')}</details>`).join('');
  const list=lgOrders().filter(lgMatch).sort((a,b)=>(a.entrega.data+a.entrega.turno).localeCompare(b.entrega.data+b.entrega.turno)||a.id-b.id);
  const sel=[L.uf,L.cid&&(list[0]?list[0].entrega.dest.cidade:L.cid),L.data&&fmtDay(L.data),L.turno&&TURNOS[L.turno]].filter(Boolean).join(' › ')||'Todos os pedidos';
  const turnoSel=L.uf&&L.cid&&L.data&&L.turno;
  const key=turnoSel?[L.uf,L.cid,L.data,L.turno].join('|'):'';

function admRotaSalvar(k){k=decodeURIComponent(k);const lista=v_('rotaT').split('\n').map(x=>x.trim()).filter(Boolean);const r=ROTAS[k]||{lista:[],atual:-1};r.lista=lista;r.saida=v_('rotaS');r.min=Math.max(5,+v_('rotaM')||20);if(r.atual>=lista.length)r.atual=lista.length-1;ROTAS[k]=r;save();toast('Rota salva.');route()}
function admRotaAvancar(k){k=decodeURIComponent(k);const r=ROTAS[k];if(!r||!r.lista.length){toast('Salve a rota primeiro.');return}
  if(r.atual>=r.lista.length-1){toast('A rota já chegou à última localidade.');return}
  r.atual++;const [uf,cid,data,turno]=k.split('|');
  orders.filter(o=>o.status==='em-rota'&&rotaKey(o)===k).forEach(o=>{addEv(o,{tipo:'rota',publico:true,texto:'A rota da sua região está em andamento: entrega em '+r.lista[r.atual]+'.'})});
  save();toast('Andamento atualizado: '+r.lista[r.atual]+'.');route()}
function admRotaSair(k){k=decodeURIComponent(k);const [uf,cid,data,turno]=k.split('|');
  const alvo=orders.filter(o=>o.status==='programada'&&rotaKey(o)===k);if(!alvo.length){toast('Não há pedidos "Entrega programada" neste turno.');return}

  <p style="color:var(--muted);font-size:.85rem">Entram aqui os pedidos sem movimentação há mais de ${LOG.atrasoHoras} h e os pedidos cuja data ou turno de entrega já passou sem conclusão. Os mais críticos aparecem primeiro.</p>
  ${L.length?`<div class="tbl"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Cidade e região</th><th>Previsto</th><th>Status</th><th>Sem movimentação</th><th>Atraso</th><th>Motivo</th><th></th></tr></thead><tbody>${L.map(x=>{const o=x.o,d=o.entrega.dest;return `<tr class="${x.at.janela?'crit':''}"><td><b>${codigoPedido(o)}</b></td><td>${esc(o.entrega.nome)}</td><td>${esc(d.cidade)}/${esc(String(d.uf).toUpperCase())}<div style="font-size:.78rem;color:var(--muted)">${esc(d.bairro)}</div></td><td>${fmtDM(o.entrega.data)}, ${turnoNome(o.entrega.turno)}</td><td><span class="st ${CLS[o.status]}">${LAB[o.status]}</span></td><td>${ago(ultimoMov(o))}</td><td><b>${dur(x.at.min)}</b><div style="font-size:.74rem;color:var(--muted)">${x.at.janela?'prazo vencido':'sem movimento'}</div></td><td>${esc(o.motivoAtraso||'não registrado')}</td><td class="r"><button class="btn sm" onclick="admAbrir(${o.id})">Abrir</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="note">Nenhum pedido atrasado com estes filtros.</div>'}</div>`;
}

function route(fromHash){

  const h=location.hash.replace(/^#/,'')||'/';const [_,a,b,c]=h.split('/');let html='';
  clearInterval(slT);
  switch(a){
   case '':html=pageHome();break;
   case 'cat':html=pageCat(h.slice(5));break;
   case 'busca':html=pageSearch(h.slice(7));break;
   case 'produto':if(fromHash)pQty=1;html=pageProd(b);break;

   case 'endereco':html=pageEnd();break;
   case 'revisar':html=pageRev();break;

   case 'amigo':html=pageAmigo();break;
   case 'ind':pageIndRoute(b);return;
   case 'operador':html=window.__ADMIN_APP?pageOp():pageNF();break;
   case 'ajuda':html=pageInfo('como-comprar');break;
   case 'perfil':html=pagePerfil();break;
   case 'acompanhar':html=pageAcompanhar(b,c);break;
   case 'entrega':html=pageEntregador(b,c);break;case 'foto':html=pageFotoEntrega(b,c);break;
   case 'notificacoes':html=pageNotificacoes();break;
   case 'info':html=pageInfo(b);break;
   case 'reg':html=pageReg(b);break;
   default:html=pageNF()}
  if(html==='')return;

function traduzErro(err){
  const m=String((err&&err.message)||err||'').toLowerCase();
  if(m.includes('invalid login'))return 'E-mail ou senha incorretos.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'Já existe uma conta com este e-mail.';
  if(m.includes('at least')&&m.includes('character'))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(m.includes('valid email')||m.includes('invalid email')||m.includes('email address'))return 'Informe um e-mail válido.';
  if(m.includes('rate limit')||m.includes('too many'))return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if(m.includes('fetch')||m.includes('network')||m.includes('failed to'))return 'Não foi possível conectar ao servidor. Verifique a internet e tente de novo.';
  if(m.includes('email not confirmed'))return 'Confirme o seu e-mail pelo link que enviamos e tente entrar de novo.';
  return 'Não foi possível concluir agora. Tente de novo em instantes.';
}
function msgRpc(err){
  if(err&&err.code==='P0001'&&err.message)return err.message;   // mensagens escritas pelo próprio sistema, já em português

}

}

async function banSalvarEdicao(ev){
  if(ev)ev.preventDefault();

  if(idx<0||!A9.camp.bans||!A9.camp.bans[idx]){toast('Índice inválido.');return}
  const titulo=v_('bnTit').trim(),seg=Math.max(2,Math.min(30,+(v_('bnSeg')||4)||4));
  if(!titulo){toast('Preencha o título.');return}

  const st=document.getElementById('bnStatus');

  const b=A9.camp.bans[idx];

  const nome='banner-custom-'+Date.now()+'.'+ext;
  if(st)st.textContent='Enviando imagem...';
  const up=await SB.storage.from('produtos').upload(nome,file,{cacheControl:'3600',upsert:true,contentType:file.type});
  if(up.error){if(st)st.textContent='';toast('Erro ao subir imagem: '+up.error.message);return}
  const url=SB_URL+'/storage/v1/object/public/produtos/'+nome;

function freteNome(c){const k=cidNorm(c);const x=(FRETE.lista||[]).find(f=>cidNorm(f.cidade)===k);return x?x.cidade:String(c||'').trim()}

function filtroExtra(o,f){
  f=f||{fc:A9.fc,ft:A9.ft,fq:A9.fq,fe:A9.fe};const e=o.entrega||{};
  if(f.fe==='fin'&&!(o.extra&&o.extra.etq_em))return false;
  if(f.fe==='pend'&&(o.extra&&o.extra.etq_em))return false;
  if(f.fc){const l=String(f.fc).split('|').map(cidNorm);if(!l.includes(cidNorm(cidadeDe(o))))return false}
  if(f.ft&&e.turno!==f.ft)return false;
  if(f.fq==='abertos'&&ENC(o))return false;
  if(f.fq==='feitos-hoje'&&!feitoHoje(o))return false;
  if(f.fq==='entrega-hoje'&&e.data!==hojeS())return false;
  if(f.fq==='atrasados'&&!emAtraso(o))return false;
  if(f.fq==='recorrentes'&&!(+o.seq>=2))return false;
  return true;
}

/* localização gratuita (OpenStreetMap), guardada no aparelho para não repetir a busca */
function geoCache(){try{return JSON.parse(localStorage.getItem('zp_geo')||'{}')}catch(x){return{}}}
function geoSalva(c){try{localStorage.setItem('zp_geo',JSON.stringify(c))}catch(x){}}
var geoUlt=0;
async function geoBusca(q){
  const espera=geoUlt+1150-Date.now();if(espera>0)await new Promise(r=>setTimeout(r,espera));geoUlt=Date.now();
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('geo');const j=await r.json();return j[0]?{lat:+j[0].lat,lon:+j[0].lon}:null;
}
async function geoTexto(tentativas){
  const c=geoCache();
  for(const q of tentativas){
    if(!q)continue;
    if(c[q]!==undefined){if(c[q])return c[q];continue}
    let g=null;try{g=await geoBusca(q)}catch(x){return null}
    c[q]=g;geoSalva(c);if(g)return g;
  }
  return null;
}
function geoDest(d){d=d||{};const j=a=>a.filter(Boolean).join(', ');
  return [j([d.rua,d.num,d.bairro,d.cidade,d.uf,'Brasil']),j([d.rua,d.bairro,d.cidade,d.uf,'Brasil']),j([d.bairro,d.cidade,d.uf,'Brasil']),j([d.cep,'Brasil']),j([d.cidade,d.uf,'Brasil'])]}
function geoKm(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
/* vizinho mais próximo a partir do local de saída, depois melhora trocando trechos (2-opt) */
function geoOrdem(ini,pts){
  const rest=pts.slice(),ord=[];let cur=ini;
  while(rest.length){let bi=0,bd=Infinity;rest.forEach((p,i)=>{const x=geoKm(cur,p);if(x<bd){bd=x;bi=i}});cur=rest.splice(bi,1)[0];ord.push(cur)}
  const P=[ini].concat(ord),n=ord.length;let mel=true,voltas=0;
  while(mel&&voltas++<60){mel=false;
    for(let i=1;i<n;i++)for(let j=i+1;j<=n;j++){
      const a=P[i-1],b=P[i],c=P[j],e=P[j+1];
      const antes=geoKm(a,b)+(e?geoKm(c,e):0),depois=geoKm(a,c)+(e?geoKm(b,e):0);
      if(depois<antes-1e-6){const seg=P.slice(i,j+1).reverse();for(let k=0;k<seg.length;k++)P[i+k]=seg[k];mel=true}}}
  return P.slice(1);
}
/* items: [{id,dest}] ; devolve os ids na ordem da rota (quem não for localizado vai no fim, por CEP) */
async function geoOrdenar(items,saidaTxt,prog){
  const ini=await geoTexto([saidaTxt+', Brasil',saidaTxt]);
  if(!ini)throw new Error('saida');
  const ok=[],sem=[];let k=0;
  for(const it of items){
    const g=await geoTexto(geoDest(it.dest));k++;if(prog)prog(k,items.length);
    if(g)ok.push({id:it.id,lat:g.lat,lon:g.lon});else sem.push(it);
  }
  const ord=geoOrdem(ini,ok).map(p=>p.id);
  sem.sort((a,b)=>String((a.dest||{}).cep).localeCompare(String((b.dest||{}).cep))).forEach(x=>ord.push(x.id));
  return ord;
}

   +'<div class="btns" style="margin-top:10px"><button class="btn wa" onclick="pvEnviar()">Abrir no WhatsApp</button><button class="btn ghost" onclick="pvFechar()">Fechar</button></div>'
   +'<p id="pvDica" style="margin:8px 0 0;color:#667085;font-size:.8rem"></p></div>';
  document.body.appendChild(d);
}
function pvFechar(){const d=document.getElementById('pvbox');if(d)d.remove();A9.pv=null;route()}
function pvEnviar(){
  const p=A9.pv;if(!p)return;const t=document.getElementById('pvTxt').value;
  waAbrir(p.fw,t);A9.pagEnv[p.id]=true;p.aberto=true;
  SB.from('pedido_eventos').insert({pedido_id:p.id,tipo:'whatsapp',publico:false,texto:'Link de pagamento aberto no WhatsApp (envio não confirmado pelo sistema)',por:ADMIN.nome}).then(()=>{},()=>{});
  const dc=document.getElementById('pvDica');if(dc)dc.innerHTML='<b style="color:#16a34a">WhatsApp aberto.</b> Depois toque em Fechar.';
}

/* ======================= PAGAMENTO EM OUTRO DIA: dia combinado, observação e aviso piscando ======================= */
function pagInfo(o){
  const x=o.extra||{},prev=x.pag_prev||'',hoje=hojeS();
  const base=Date.parse(x.pag_base||o.chegou_em||o.atualizado_em||o.criado_em)||0;
  let est='ok';
  if(prev)est=prev<hoje?'vencido':prev===hoje?'hoje':'prometido';
  else if(o.status==='entregue'&&(Date.now()-base)/3600000>=24)est='sem-data';
  return {prev,obs:x.pag_obs||'',est};
}
function pagOrdem(a,b){
  const r=o=>({vencido:0,'sem-data':1,hoje:2,prometido:3,ok:4})[pagInfo(o).est];
  const d=r(a)-r(b);if(d)return d;
  return String(pagInfo(a).prev||'9999').localeCompare(String(pagInfo(b).prev||'9999'));
}
window.pagChipP=function(o){const p=o.pagamento||{};return p.status==='pago'?'<span class="stchip" style="--c:#16a34a">Pago</span>':'<span class="stchip" style="--c:#d92d20">Não pago</span>'};
function pagTag(o){
  if((o.pagamento||{}).status==='pago')return '';
  const i=pagInfo(o),ob=i.obs?'<div style="font-size:.78rem;color:var(--muted)">'+esc(i.obs)+'</div>':'';
  if(i.est==='vencido')return '<div class="pagpulsa" onclick="pagDia('+o.id+')">⚠️ Não pagou! Era para '+esc(dataBr(i.prev))+'. Qual o novo dia?</div>'+ob;
  if(i.est==='sem-data')return '<div class="pagpulsa" onclick="pagDia('+o.id+')">🔔 Ainda não pagou. Qual o dia do pagamento?</div>';
  if(i.est==='hoje')return '<div style="color:#d97706;font-weight:800;font-size:.82rem">💰 Paga hoje</div>'+ob;
  if(i.est==='prometido')return '<div style="color:#b54708;font-weight:700;font-size:.82rem">📅 Paga em '+esc(dataBr(i.prev))+'</div>'+ob;
  return '';
}
function pagDia(id){
  const o=(A9.pedidos||[]).find(x=>x.id===id);if(!o)return;const i=pagInfo(o);
  const old=document.getElementById('pdbox');if(old)old.remove();
  const d=document.createElement('div');d.id='pdbox';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;padding:14px';
  d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:440px;width:100%;padding:16px"><h3 style="margin:0 0 4px">Dia do pagamento</h3><p style="margin:0 0 10px;color:#667085;font-size:.88rem">'+esc(codPed(o))+' · '+esc((o.entrega||{}).nome||'')+'</p>'
   +'<label for="pdD">Dia em que a pessoa vai pagar</label><input id="pdD" type="date" value="'+esc(i.prev||'')+'"><label for="pdO" style="margin-top:8px">Observação</label><input id="pdO" maxlength="160" placeholder="Ex.: recebe dia 30, paga no Pix" value="'+esc(i.obs)+'">'
   +'<div class="btns" style="margin-top:12px"><button class="btn acc" onclick="pagDiaSalvar('+id+')">Salvar</button><button class="btn ghost" onclick="document.getElementById(\'pdbox\').remove()">Fechar</button></div></div>';
  document.body.appendChild(d);
}
async function pagDiaSalvar(id){
  const o=(A9.pedidos||[]).find(x=>x.id===id);if(!o)return;
  const dia=v_('pdD'),ob=v_('pdO').trim();
  const ex=Object.assign({},o.extra||{},{pag_prev:dia||null,pag_obs:ob||null});if(!ex.pag_base)ex.pag_base=new Date(Date.parse(o.chegou_em||o.atualizado_em||o.criado_em)||Date.now()).toISOString();
  const r=await SB.from('pedidos').update({extra:ex}).eq('id',id);
  if(r.error){toast('Não foi possível salvar o dia do pagamento.');return}
  o.extra=ex;
  SB.from('pedido_eventos').insert({pedido_id:id,tipo:'pagamento',publico:false,texto:dia?'Pagamento previsto para '+dataBr(dia)+(ob?': '+ob:''):'Dia de pagamento removido',por:ADMIN.nome}).then(()=>{},()=>{});
  const d=document.getElementById('pdbox');if(d)d.remove();
  toast(dia?'Dia do pagamento salvo: '+dataBr(dia)+'.':'Dia do pagamento removido.');route();
}

/* ======================= FOTO DA ENTREGA PARA O CLIENTE (Meus pedidos + link de acompanhamento) ======================= */
var FOTO_C={};
function fotoCliHtml(F){return '<div class="pbox" style="margin:10px 0"><small>📷 Foto da entrega</small><img alt="Foto do local da entrega" src="'+F.foto+'" style="width:100%;max-width:420px;border-radius:12px;display:block;margin-top:6px"><div style="color:var(--muted);font-size:.82rem;margin-top:4px">Tirada em '+esc(fmtD(Date.parse(F.criado_em)))+'</div></div>'}
function fotoCliBox(o){
  if(!SB||!o||!['em-rota','entregue'].includes(o.status))return '';
  const k=o.id;
  if(FOTO_C[k]===undefined){FOTO_C[k]=null;SB.rpc('foto_entrega_cliente',{p_pedido:+o.id}).then(r=>{FOTO_C[k]=(r.error||!r.data||!r.data.foto)?false:r.data;if(/^#\/pedidos/.test(location.hash))route()})}
  return FOTO_C[k]?fotoCliHtml(FOTO_C[k]):'';
}
var FOTO_T={};
function fotoTrkBox(codigo,token){
  const pid=parseInt(String(codigo).replace(/\D/g,''),10);if(!SB||!pid)return '';
  const k=pid+'/'+token;
  if(FOTO_T[k]===undefined){FOTO_T[k]=null;SB.rpc('foto_entrega_publica',{p_pedido:pid,p_token:token}).then(r=>{FOTO_T[k]=(r.error||!r.data||!r.data.foto)?false:r.data;if(/^#\/acompanhar/.test(location.hash))route()})}
  return FOTO_T[k]?fotoCliHtml(FOTO_T[k]):'';
}

/* ======================= CLIENTES: base de cadastrados (aba oculta) + aviso de fidelidade (10+ pedidos) ======================= */
var CLI_META=10;
function cupomMarcas(){try{return JSON.parse(localStorage.getItem('zp_cupom')||'{}')}catch(e){return {}}}
function cupomMarca(k){try{const m=cupomMarcas();m[k]=hojeS();localStorage.setItem('zp_cupom',JSON.stringify(m))}catch(e){}}
function cliChave(o){return o.usuario_id||('f'+String((o.entrega||{}).fone||'').replace(/\D/g,''))}
/* clientes com 10+ pedidos que ainda não receberam o convite (usa os pedidos já carregados) */
function fielPend(L){const m=cupomMarcas(),s={};(L||[]).forEach(o=>{if(+o.seq>=CLI_META){const k=cliChave(o);if(k&&k!=='f')s[k]=1}});const t=Object.keys(s);return {total:t.length,novos:t.filter(k=>!m[k]).length}}
async function admCarregarClientes(){
  A9.cliBusy=true;
  try{
    let ped=[],ini=0;
    for(;;){const r=await SB.from('pedidos').select('id,usuario_id,seq,status,criado_em,entrega,pagamento,itens,extra').order('id',{ascending:false}).range(ini,ini+999);if(r.error)throw r.error;ped=ped.concat(r.data||[]);if((r.data||[]).length<1000)break;ini+=1000}
    const pf=await SB.from('perfis').select('id,nome,sobrenome,fone,email,endereco,criado_em,papel').limit(5000);
    const M={};
    (pf.data||[]).forEach(p=>{if(p.papel&&p.papel!=='cliente')return;M[p.id]={k:p.id,nome:((p.nome||'')+' '+(p.sobrenome||'')).trim(),fone:p.fone||'',email:p.email||'',cidade:((p.endereco||{}).cidade)||'',cad:p.criado_em,n:0,ent:0,tot:0,pag:{},ult:null}});
    ped.forEach(o=>{
      const k=cliChave(o);if(!k||k==='f')return;const e=o.entrega||{};
      const c=M[k]=M[k]||{k,nome:e.nome||'',fone:e.fone||'',email:'',cidade:'',cad:null,n:0,ent:0,tot:0,pag:{},ult:null};
      if(!c.nome)c.nome=e.nome||'';if(!c.fone)c.fone=e.fone||'';if(!c.cidade)c.cidade=((e.dest||{}).cidade)||'';
      if(o.status==='cancelado')return;
      c.n++;if(o.status==='entregue')c.ent++;
      try{c.tot+=pedTotal(o)+(freteDoPedido(o)||0)}catch(x){}
      const pg=(o.pagamento||{}).preferencia||(o.pagamento||{}).metodo;if(pg)c.pag[pg]=(c.pag[pg]||0)+1;
      if(!c.ult||o.criado_em>c.ult)c.ult=o.criado_em;
    });
    A9.clientes=Object.values(M);
  }catch(x){A9.clientes=[];A9.cliErro='Não foi possível carregar os clientes agora.'}
  A9.cliBusy=false;route();
}
function cliPagTop(c){const e=Object.entries(c.pag).sort((a,b)=>b[1]-a[1])[0];return e?((PAGNOME[e[0]]||e[0])+' ('+e[1]+'x)'):'—'}
function tabClientes(){
  if(!A9.clientes){if(!A9.cliBusy)admCarregarClientes();return '<div class="box">Carregando clientes...</div>'}
  const q=String(A9.cliQ||'').toLowerCase(),f=A9.cliF||'';
  let L=A9.clientes.filter(c=>(!q||(c.nome+' '+c.fone+' '+c.email+' '+c.cidade).toLowerCase().includes(q))&&(f!=='fiel'||c.n>=CLI_META));
  L.sort((a,b)=>b.n-a.n||String(b.ult||'').localeCompare(String(a.ult||'')));
  const fiel=A9.clientes.filter(c=>c.n>=CLI_META).length,m=cupomMarcas();
  return `<div class="box"><h2 style="margin:0 0 4px">Clientes cadastrados</h2><p style="margin:0 0 10px;color:var(--muted)">${A9.clientes.length} cliente${A9.clientes.length===1?'':'s'} · ${fiel} com ${CLI_META} pedidos ou mais. Pedidos cancelados não contam.</p>${A9.cliErro?'<div class="note err">'+esc(A9.cliErro)+'</div>':''}
  <div class="fbar"><div><label for="cq">Buscar</label><input id="cq" value="${esc(A9.cliQ||'')}" placeholder="Nome, telefone, cidade" onkeydown="if(event.key==='Enter'){A9.cliQ=this.value;route()}" onchange="A9.cliQ=this.value;route()"></div><div><label for="cf">Mostrar</label><select id="cf" onchange="A9.cliF=this.value;route()"><option value="">Todos</option><option value="fiel" ${f==='fiel'?'selected':''}>${CLI_META}+ pedidos (fidelidade)</option></select></div><button class="btn ghost sm" onclick="A9.clientes=null;route()">Atualizar</button></div>
  <div class="tbl"><table><thead><tr><th>Cliente</th><th>Contato</th><th>Cidade</th><th>Pedidos</th><th>Entregues</th><th>Total comprado</th><th>Pagamento mais usado</th><th>Último pedido</th><th>Cadastro</th><th></th></tr></thead><tbody>${L.map(c=>`<tr><td><b>${esc(c.nome||'Sem nome')}</b></td><td>${esc(c.fone||'')}${c.email?'<div style="color:var(--muted);font-size:.78rem">'+esc(c.email)+'</div>':''}</td><td>${esc(c.cidade||'')}</td><td><b>${c.n}</b>${c.n>=CLI_META?' <span class="selo purple">Fiel</span>':''}</td><td>${c.ent}</td><td>${brl(c.tot)}</td><td>${esc(cliPagTop(c))}</td><td>${c.ult?esc(fmtD(Date.parse(c.ult))):'—'}</td><td>${c.cad?esc(fmtD(Date.parse(c.cad))):'—'}</td><td>${c.n>=CLI_META&&c.fone?`<button class="btn sm ${m[c.k]?'ghost':'acc pulsa'}" onclick="cupomAbrir('${esc(c.k)}')">${m[c.k]?'Enviar de novo':'Oferecer cupom'}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="10">Nenhum cliente encontrado.</td></tr>'}</tbody></table></div></div>`;
}
var CUPOM_TXT='Olá, {nome}, tudo bem? 😊\nPassando para agradecer de coração: você já fez {pedidos} pedidos com a gente e isso é muito especial para nós!\nComo agradecimento pela sua fidelidade, preparamos um cupom exclusivo para você: *{cupom}*.\nÉ só avisar no seu próximo pedido. Obrigado pela confiança! 💜';
function cupomAbrir(k){
  const c=(A9.clientes||[]).find(x=>x.k===k);if(!c)return;
  const old=document.getElementById('cpbox');if(old)old.remove();
  const sv=localStorage.getItem('zp_cupom_cod')||'FIEL10';
  const d=document.createElement('div');d.id='cpbox';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;padding:14px';
  d.innerHTML='<div style="background:#fff;border-radius:16px;max-width:480px;width:100%;padding:16px;max-height:92vh;overflow:auto"><h3 style="margin:0 0 4px">Cupom de fidelidade</h3><p style="margin:0 0 8px;color:#667085;font-size:.88rem">'+esc(c.nome)+' · '+c.n+' pedidos</p><label for="cpC">Código ou descrição do cupom</label><input id="cpC" value="'+esc(sv)+'" oninput="cupomPrev(\''+esc(k)+'\')"><label for="cpM" style="margin-top:8px">Mensagem (pode editar)</label><textarea id="cpM" rows="9" style="width:100%"></textarea><div class="btns" style="margin-top:10px"><button class="btn acc" onclick="cupomEnviar(\''+esc(k)+'\')">Abrir no WhatsApp</button><button class="btn ghost" onclick="document.getElementById(\'cpbox\').remove()">Fechar</button></div></div>';
  document.body.appendChild(d);cupomPrev(k);
}
function cupomPrev(k){const c=(A9.clientes||[]).find(x=>x.k===k);if(!c)return;document.getElementById('cpM').value=CUPOM_TXT.replace('{nome}',String(c.nome||'').split(' ')[0]||'cliente').replace('{pedidos}',c.n).replace('{cupom}',v_('cpC')||'CUPOM')}
function cupomEnviar(k){
  const c=(A9.clientes||[]).find(x=>x.k===k);if(!c)return;
  try{localStorage.setItem('zp_cupom_cod',v_('cpC'))}catch(e){}
  const fone=foneWa(c.fone);const msg=document.getElementById('cpM').value;
  window.open(waUrlPara(fone,msg),'_blank');cupomMarca(k);
  const d=document.getElementById('cpbox');if(d)d.remove();toast('WhatsApp aberto. O envio é feito por você.');route();
}
</script>
